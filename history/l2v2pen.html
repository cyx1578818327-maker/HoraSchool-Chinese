"text": "Proverbs has a verse about exactly this: \"When a man's folly brings his way to ruin, his heart rages against the Lord.\" On this point, Sima Qian saw clearly. People are responsible for what they do.",

"end": 266.866,
"chunks": [
{
"text": "Proverbs has a verse about exactly this:",
"start": 255.296,
"end": 257.663
},
{
"text": "\"When a man's folly brings his way to ruin, his heart rages against the Lord.\"",
"start": 258.043,
"end": 262.33
},
{
"text": "On this point, Sima Qian saw clearly.",
"start": 262.59,
"end": 264.652
},
{
"text": "People are responsible for what they do.",
"start": 264.912,
"end": 266.866
}
]
},
{
"text": "But we must also remember what we learned last time: the secret things belong to God. What was really in Xiang Yu's heart, Sima Qian did not know, and we do not know either. The Bible says: \"Man looks on the outward appearance, but the Lord looks on the heart.\" Historians can only follow the evidence, and say only as much as the evidence supports. The final judgment is in God's hands.",
"start": 267.616,
"end": 290.158,
"chunks": [
{
"text": "But we must also remember what we learned last time: the secret things belong to God.",
"start": 267.616,
"end": 272.51
},
{
"text": "What was really in Xiang Yu's heart, Sima Qian did not know, and we do not know either.",
"start": 272.77,
"end": 277.392
},
{
"text": "The Bible says: \"Man looks on the outward appearance, but the Lord looks on the heart.\"",
"start": 277.652,
"end": 282.177
},
{
"text": "Historians can only follow the evidence, and say only as much as the evidence supports.",
"start": 282.437,
"end": 287.653
},
{
"text": "The final judgment is in God's hands.",
"start": 287.913,
"end": 290.158
}
]
},
{
"text": "Today we learned three things. Facts need evidence. Judgments depend on who is speaking, and where he stands. And when we make our own judgments, we measure them by the Bible, and we know our limits.",
"start": 290.908,
"end": 302.132,
"chunks": [
{
"text": "Today we learned three things.",
"start": 290.908,
"end": 292.436
},
{
"text": "Facts need evidence.",

{
"text": "Judgments depend on who is speaking, and where he stands.",
"start": 294.196,

{
"text": "And when we make our own judgments, we measure them by the Bible, and we know our limits.",
