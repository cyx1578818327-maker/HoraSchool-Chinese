.top .r{display:flex;gap:22px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:36px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 30px rgba(60,45,25,.14);min-width:170px;z-index:20;padding:6px 0}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 18px;cursor:pointer;font-size:15px}
.menu button:hover{background:#F2ECDF}
/* 进度条 */
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:6px 0 4px}
.prog .st{font-size:13px;color:var(--gray);line-height:1.3}
.prog .st i{display:block;height:4px;background:#E2DBCC;margin-bottom:6px}
.prog .st.done i{background:var(--lu)}.prog .st.cur i{background:var(--jin)}
.prog .st.cur{color:var(--ink)}
.prog .st small{display:block;color:var(--gray);font-size:12px}
/* 屏 */
main{position:relative}
.screen{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.label{font-size:13px;letter-spacing:.2em;color:var(--gray);margin:40px 0 6px}
h1,h2{font-family:var(--serif);font-weight:900;letter-spacing:.04em;line-height:1.35;margin:0 0 14px}
h1{font-size:44px}h2{font-size:32px}
.do{font-size:17px;margin:0 0 22px}
.lead{color:var(--gray);font-size:15px;margin:-6px 0 18px}
.small{font-size:13px;color:var(--gray);font-weight:300;line-height:1.6}
/* 图片与说明牌 */
figure{margin:0}
.ph{box-shadow:0 14px 34px rgba(60,45,25,.18),0 2px 6px rgba(60,45,25,.12);background:#e9e2d2;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.85) sepia(.08)}
figcaption{font-size:13px;color:var(--gray);font-weight:300;margin-top:10px;line-height:1.55}
/* 封面 */
.cover{display:grid;grid-template-columns:1fr 1.1fr;gap:44px;align-items:center;min-height:62vh;padding-top:30px}
.cover .ph{aspect-ratio:3/4}
.cover .num{font-size:14px;letter-spacing:.3em;color:var(--era)}
.cover h1{font-size:30px;margin:6px 0 30px;color:var(--era)}
.cover .q{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1.4;margin:0 0 26px}
.guess{display:grid;gap:10px}
.guess .hint{font-size:14px;color:var(--gray)}
/* 选项卡片（可以点的东西才用白卡） */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:13px 18px;cursor:pointer;transition:opacity .4s,border-color .2s,background .2s;font-size:16px;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#fff}
.opt.dim{opacity:.32}
.opt.ok{border-color:var(--lu);background:#F1F5F1}
.opt.no{border-color:var(--zhu)}
.opt:disabled{cursor:default}
.opts{display:grid;gap:10px;margin:0 0 16px}
/* 反馈小卡片 */
.fb{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);padding:14px 16px;margin:6px 0 0}
.fb .fi{flex:0 0 120px;height:90px}
.fb p{margin:0}
.fb.good{border-left:3px solid var(--lu)}.fb.try{border-left:3px solid var(--jin)}
.fb .ans{color:var(--gray);font-size:14px;margin-top:6px}
/* 逐题 */
.qcount{font-size:13px;color:var(--gray);margin-bottom:10px}
.qstem{font-size:20px;font-weight:500;margin:0 0 16px;line-height:1.6}
/* 拖动 */
.pool{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;min-height:50px}
.chip{background:var(--card);border:1px solid var(--line);padding:9px 14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:15px;line-height:1.55;max-width:100%}
.chip.dragging{box-shadow:0 12px 24px rgba(60,45,25,.22);cursor:grabbing;position:relative;z-index:50;pointer-events:none;border-color:var(--ink);transition:none}
.chip.picked{border-color:var(--ink)}
.chip.placed{cursor:default;background:#F1F5F1;border-color:var(--lu)}
.chip .src{display:block;font-size:12px;color:var(--gray)}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px}
.bin{border-top:2px solid var(--ink);padding:10px 0 6px;min-height:140px;transition:background .2s}
.bin.over{background:rgba(201,162,74,.10)}
.bin h3{font-family:var(--serif);font-weight:900;font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.bin .in{display:grid;gap:8px}
.bin svg{flex:0 0 auto}
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);padding:4px 0}
.slot b{font-family:var(--serif);color:var(--gray);width:24px}
.pop{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:15px}
.pop .ph{flex:0 0 96px;height:72px}
.summary{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.6;border-top:1px solid var(--line);padding-top:18px;margin-top:26px}
/* 视频 */
.vid{position:relative;background:#1d1b19;aspect-ratio:16/9;box-shadow:0 18px 40px rgba(60,45,25,.2);overflow:hidden}
.vid video{width:100%;height:100%;display:block;background:#1d1b19}
.vid .play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:0;background:rgba(245,241,232,.92);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.vid .play svg{margin-left:6px}
.vid.playing .play{opacity:0;pointer-events:none}
.vid .bar{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(transparent,rgba(0,0,0,.35));opacity:0;transition:opacity .3s}
.vid:hover .bar,.vid.paused .bar{opacity:1}
.vid .line{flex:1;height:3px;background:rgba(255,255,255,.3);position:relative;cursor:default}
.vid .line.seek{cursor:pointer}
.vid .line i{position:absolute;left:0;top:0;bottom:0;background:var(--ivory)}
.vid .ic{background:none;border:0;color:var(--ivory);cursor:pointer;padding:4px;display:flex}
.vid .qz{position:absolute;inset:0;background:rgba(34,32,29,.86);display:flex;align-items:center;justify-content:center;padding:24px}
.vid .qz .box{background:var(--paper);max-width:640px;width:100%;padding:24px 26px}
.vid .qz .k{font-size:12px;letter-spacing:.2em;color:var(--gray)}
.vlabel{font-size:13px;color:var(--gray);margin:12px 0 0}
.later{margin-top:22px}
.later>button{background:none;border:0;padding:0;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:4px}
.later>button:disabled{color:var(--gray);text-decoration:none;cursor:default}
.later ul{margin:12px 0 0;padding-left:1.2em}
.later li{margin:6px 0}
/* 层级展开 */
.tier{background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.tier>button{width:100%;text-align:left;background:none;border:0;padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:18px;font-family:var(--serif);font-weight:700}
.tier>button .n{color:var(--jin);font-size:22px}
.tier>button .mk{margin-left:auto;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--gray)}
.tier.open>button .mk{color:var(--lu)}
.tier .body{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:0 18px 18px}
.tier .body .ph{height:150px}
/* 引文版式 */
.scr{background:var(--dark);color:var(--ivory);padding:34px 36px 26px;margin:0 0 10px;position:relative}
.scr::before{content:"";display:block;width:72px;height:1px;background:var(--jin);margin:0 auto 24px}
.scr .t{font-family:var(--kai);font-size:22px;line-height:2;letter-spacing:.04em}
.scr .rf{text-align:center;font-size:13px;color:#A79E8C;letter-spacing:.2em;margin-top:16px}
.cls{position:relative;padding:28px 36px 30px 110px;margin:0 0 10px;overflow:hidden;min-height:260px}
.cls .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.10;filter:grayscale(.3) sepia(.3)}
.cls .t{position:relative;font-family:var(--kai);font-size:30px;line-height:1.9;letter-spacing:.14em;writing-mode:vertical-rl;height:300px;margin-left:auto}
.cls .seal{position:absolute;left:30px;bottom:28px;width:44px;background:var(--zhu);color:var(--paper);font-family:var(--kai);font-size:17px;line-height:1.2;text-align:center;padding:6px 0;border-radius:2px}
.sch{border-left:2px solid var(--gray);padding:4px 0 4px 20px;margin:0 0 10px}
.sch .t{font-size:17px}
.sch .rf{font-size:13px;color:var(--gray);margin-top:8px}
.qtag{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--gray);margin-bottom:6px}
.origin{font-size:14px;color:var(--gray);margin:0 0 10px}
.nt{border-bottom:1px dotted currentColor;cursor:pointer}
.nt.flash{animation:flash 1.4s ease 2}
@keyframes flash{50%{background:rgba(201,162,74,.35)}}
.tip{position:absolute;z-index:30;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 24px rgba(60,45,25,.18);padding:10px 14px;font-family:var(--sans);font-size:14px;line-height:1.6;max-width:280px;writing-mode:horizontal-tb;letter-spacing:0}
.pk{cursor:pointer;border-radius:2px;transition:background .2s}
.pickon .pk:hover{background:rgba(201,162,74,.25)}
.pk.hit{background:rgba(63,107,92,.28)}
.pk.miss{background:rgba(181,69,47,.18)}
.fold>button{background:none;border:0;padding:0;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:4px;color:var(--ink)}
.fold .tx{font-size:15px;margin-top:8px}
.act{margin:14px 0 6px}
.mat{margin-bottom:34px}
/* 书写 */
.bigq{min-height:42vh;display:flex;flex-direction:column;justify-content:center}
.bigq h1{font-size:46px}
.wbox{margin:0 0 18px}
.wbox label{display:block;font-family:var(--kai);font-size:19px;margin-bottom:6px}
textarea{width:100%;min-height:96px;font:inherit;font-size:16px;line-height:1.7;background:var(--card);border:1px solid var(--line);padding:12px 14px;resize:vertical;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--ink)}
textarea:disabled{background:transparent;color:var(--ink)}
.ev{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 22px;font-size:14px}
.ev span{color:var(--gray)}
.ul{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-size:inherit}
.peer{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.after h3{font-family:var(--serif);font-weight:900;font-size:20px;margin:30px 0 10px}
/* 收束 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 0 26px}
.pair>div{border-top:2px solid var(--ink);padding-top:10px}
.pair .k{font-size:13px;color:var(--gray)}
.pair p{margin:6px 0 0;font-size:17px}
.three{counter-reset:k;margin:0 0 26px;padding:0;list-style:none}
.three li{counter-increment:k;font-family:var(--serif);font-weight:700;font-size:21px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:16px}
.three li::before{content:counter(k,cjk-ideographic);color:var(--zhu)}
.award{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center;margin:0 0 26px}
.award .ph{height:220px}
.nextq{background:var(--card);border:1px solid var(--line);padding:18px 22px}
.nextq .k{font-size:13px;color:var(--gray);letter-spacing:.15em}
.nextq p{font-family:var(--serif);font-weight:700;font-size:22px;margin:6px 0 0}
/* 底部导航 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(245,241,232,.94);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.nav .in{max-width:980px;margin:0 auto;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:18px}
.nav .why{flex:1;text-align:right;font-size:14px;color:var(--gray)}
.primary{background:var(--ink);color:var(--paper);border:0;padding:11px 26px;cursor:pointer;font-size:16px}
.primary:disabled{background:#C9C2B4;cursor:not-allowed}
.back{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-size:15px}
.back:disabled{color:#C9C2B4;text-decoration:none;cursor:default}
/* 侧栏 */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(34,32,29,.35);display:flex;justify-content:flex-end}
.drawer .pn{background:var(--paper);width:min(620px,100%);height:100%;overflow:auto;padding:26px 28px 60px;box-shadow:-20px 0 40px rgba(0,0,0,.15)}
.drawer .x{float:right;background:none;border:0;font-size:15px;cursor:pointer;text-decoration:underline}
.lib-it{border-top:1px solid var(--line);padding:16px 0}
.lib-it h4{font-size:17px;font-weight:500;margin:0}
.lib-it .src{font-size:13px;color:var(--gray);margin:2px 0 8px}
.lib-it .why{font-size:14px;color:var(--gray);margin-top:8px}
.lib-it .q{font-family:var(--kai);font-size:17px;line-height:1.9}
.lock{color:var(--gray);font-size:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.gal .ph{height:150px}
textarea.ask{min-height:110px}
@media (max-width:720px){
 h1{font-size:32px}h2{font-size:26px}.cover{grid-template-columns:1fr;gap:24px}.cover .q{font-size:30px}.cover .ph{aspect-ratio:4/3}
 .bins{grid-template-columns:1fr}.tier .body{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.award{grid-template-columns:1fr}
 .bigq h1{font-size:34px}.cls{padding-left:80px}.cls .t{font-size:24px}.prog .st{font-size:11px}.prog .st small{display:none}
 .top .ln{display:none}
}
/* 排序 */
.sort{display:grid;grid-template-columns:28px 1fr;gap:0 12px;margin:0 0 6px;max-width:560px}
.snum div{height:54px;display:flex;align-items:center;font-family:var(--serif);font-weight:700;color:var(--gray);font-size:17px}
.slist{display:grid;gap:8px;user-select:none;-webkit-user-select:none}
.srow{height:46px;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);padding:0 16px;cursor:grab;touch-action:none;transition:transform .18s ease,box-shadow .18s,border-color .18s;font-size:16px}
.srow:hover{border-color:#B9B0A0}
.slist.active .srow{cursor:grabbing}
.srow.lifted{transition:box-shadow .18s,border-color .18s;box-shadow:0 12px 26px rgba(60,45,25,.18);border-color:var(--ink);position:relative;z-index:2}
.srow.fixed{cursor:default;background:#F1F5F1;border-color:var(--lu)}
.grip{display:grid;grid-template-columns:repeat(2,3px);gap:3px;flex:0 0 auto}
.grip i{width:3px;height:3px;border-radius:50%;background:#B9B0A0}
.srow:hover .grip i,.srow.lifted .grip i{background:var(--ink)}
/* 注释 */
.nt.on{background:rgba(201,162,74,.28)}
.tip{position:absolute;z-index:30;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 24px rgba(60,45,25,.16);padding:10px 14px;font-size:14px;line-height:1.65;max-width:300px;letter-spacing:0;writing-mode:horizontal-tb}
.tip b{font-family:var(--kai);font-weight:400;font-size:17px;margin-right:8px;color:var(--zhu)}
.tip::before{content:"";position:absolute;top:-6px;left:calc(var(--ax,20px) - 6px);width:10px;height:10px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.tip.v{writing-mode:vertical-rl;max-width:none;max-height:260px;padding:14px 10px;font-family:var(--kai);font-size:16px;line-height:1.7;letter-spacing:.06em}
.tip.v b{margin:0 0 8px;font-size:19px}
.tip.v::before{top:calc(var(--ay,20px) - 6px);left:auto;right:-6px;border-left:0;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.cls .t{position:relative}
a.primary{display:inline-block;text-decoration:none}
.teach{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;background:#EDE5D3;border-left:3px solid var(--jin);padding:9px 14px;font-size:14px;margin:4px 0 10px}
.teach span{flex:1;min-width:240px;color:var(--ink)}
.recpre{white-space:pre-wrap;font-family:var(--sans);font-size:13px;line-height:1.7;background:var(--card);border:1px solid var(--line);padding:12px 14px;max-height:320px;overflow:auto}
.rub{border-collapse:collapse;font-size:14px;width:100%}
.rub th,.rub td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.rub th{font-weight:500;color:var(--gray)}
.keys{padding-left:1.2em;font-size:14px}.keys li{margin:4px 0}
.drawer h3{font-family:var(--serif);font-weight:900;font-size:18px;margin:24px 0 10px}
[hidden]{display:none!important}
/* 时间轴：按真实年数画，横向；窄屏时左右滑动 */
.tl-scroll{overflow-x:auto;margin:6px 0 10px;padding-bottom:6px}
.tl{position:relative;height:200px;min-width:760px;margin:0 70px}
.tl-line{position:absolute;left:-30px;right:-40px;top:102px;height:2px;background:var(--ink)}
.tl-line::after{content:"";position:absolute;right:-2px;top:-5px;border-left:10px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
.tl-tk{position:absolute;top:98px;width:1px;height:6px;background:#9C9381;margin-left:-.5px}
.tl-tk.mj{top:94px;height:14px;background:var(--ink);width:1.5px}
.tl-tl{position:absolute;top:112px;transform:translateX(-50%);font-size:12px;color:var(--gray);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-slot{position:absolute;left:var(--p);top:0;width:128px;margin-left:-64px;display:flex;flex-direction:column;align-items:center}
.tl-hold{height:92px;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;border-radius:2px;transition:background .2s}
.tl-slot.over .tl-hold{background:rgba(201,162,74,.16)}
.tl-hold .chip{font-size:14px;padding:6px 10px;text-align:center}
.tl-dot{width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);margin-top:-1.5px;position:relative;z-index:1;transition:background .2s,border-color .2s}
.tl-slot.on .tl-dot{background:var(--lu);border-color:var(--lu)}
.tl-y{font-size:14px;font-weight:500;color:var(--ink);margin-top:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 高低两层错开：卡片在轴上方、年代与说明在轴下方，相邻两件事一高一低，不会重叠 */
.tl{height:330px}
.tl-slot{width:156px;margin-left:-78px}
.tl-slot.hi .tl-hold{align-items:flex-start;padding:0;position:relative}
.tl-slot.hi .tl-hold::after{content:"";position:absolute;left:50%;top:38px;bottom:0;width:1px;background:#B9B0A0}
.tl-under{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:24px;width:100%}
.tl-slot.hi .tl-under{padding-top:104px}
.tl-slot.hi .tl-under::before{content:"";position:absolute;left:50%;top:6px;height:94px;width:1px;background:#D6CDBB}
.tl-y{margin-top:0}
.tl-cn{font-size:13px;color:var(--ink);line-height:1.55;text-align:center;margin-top:4px;max-width:156px;background:var(--paper);animation:rise .5s ease both}
/* 翻页：上一屏、下一屏同一种样式 */
.nav .in{gap:16px}
.nav .pg{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 18px;border:1px solid #CFC6B4;background:transparent;color:var(--ink);font-size:15px;letter-spacing:.08em;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.nav .pg .ar{font-family:var(--serif);font-size:15px;line-height:1;transition:transform .2s}
.nav .pg:hover:not(:disabled){border-color:var(--ink);background:rgba(43,42,40,.04)}
.nav .pg.fw{border-color:var(--ink)}
.nav .pg.fw:hover:not(:disabled) .ar{transform:translateX(3px)}
.nav .pg.bk:hover:not(:disabled) .ar{transform:translateX(-3px)}
.nav .pg:disabled{color:#B9B0A0;border-color:#DDD5C6;cursor:not-allowed}
.nav .pg.fw.ready{background:var(--lu);border-color:var(--lu);color:var(--paper)}
.nav .pg.fw.ready:hover{background:#355c4f}
.qdone{padding:22px 0 26px;border-bottom:1px solid var(--line)}

 essay:{q:'基督徒为什么要学中国历史？',
   starts:['因为中国的历史也在神的手中，','读历史里的人，我要记得','所以我读中国历史的时候，'],
   ev:[['使徒行传 17:26','他从一本造出万族的人，住在全地上，并且预先定准他们的年限和所住的疆界。'],['创世记 1:27','神就照着自己的形像造人，乃是照着他的形像造男造女。'],['罗马书 3:23','因为世人都犯了罪，亏缺了神的荣耀。'],['马太福音 5:45','因为他叫日头照好人，也照歹人；降雨给义人，也给不义的人。'],['路加福音 13:4–5','从前西罗亚楼倒塌了，压死十八个人；你们以为那些人比一切住在耶路撒冷的人更有罪吗？我告诉你们，不是的！你们若不悔改，都要如此灭亡！']],
   summary:'学中国历史，不是从外面审判它，也不是把它当成神圣。它是神托着的万国历史中的一段。我们在里面认出神的恩典，也认出人的罪，最后学会感谢，也学会悔改。',
   peers:['因为中国的历史也在神的手中，商朝、汉朝都不在祂的手以外。读历史里的人，我要记得他们和我一样有神的形像，也一样会犯罪。所以我读中国历史的时候，不只看皇帝，也要想那些没有留下名字的人。','因为中国的历史也在神的手中，所以它和我有关系，不是别人的事。读历史里的人，我要记得不要随口说谁被神惩罚了。所以我读中国历史的时候，要诚实，好的坏的都看。'],
   read:[['想知道圣经怎样讲神与列国','但以理书第2章（尼布甲尼撒的梦）；以赛亚书45:1–7（神称外邦的君王居鲁士为“我所膏的”）。'],['想知道“神掌管”和“人负责”怎样同时成立','创世记50:20，约瑟对哥哥们说的话。'],['想看基督徒历史学家怎样想这些问题','史料库里巴特菲尔德和C.S.路易斯两条。']],
   more:'《三国演义》说“天下大势，分久必合，合久必分”。你同意吗？举一个支持它的例子，或者一个反例。'},
 close:{three:['神的手托着万国。中国的历史，也在神的手中。','神的手中有君王，也有百姓。读历史，功劳和过错都要看。','神的手把历史带向审判的日子。我们存敬畏的心去看，也省察自己。'],
   award:'shiji',awardSay:'《史记》宋刻本书影。司马迁写下的，是人对过去的记述；我们靠它去接近过去本身。'},
 lib:[
  {scr:1,q:'被当成药材的“龙骨”，怎样救回了一个朝代？',img:'oracle',
   story:['一百多年前，北京的中药铺里卖一味药，叫“龙骨”。据说磨成粉可以治病。药铺伙计收货的时候，常常顺手把骨头上一道道刻痕刮掉，因为有字的“龙骨”不好卖。',
    '1899年前后，在国子监做官的金石学家王懿荣，注意到这些骨头上刻着比金文还古老的文字。传说他是在给自己抓的药里看见的；这个故事很动听，但未必是真的。可以肯定的是，他开始高价收购，一年之间收了一千多片。',
    '第二年，八国联军打进北京，王懿荣投井殉国。他的收藏转到朋友刘鹗手里，就是写《老残游记》的那位。1903年，刘鹗把一千多片拓印出版，取名《铁云藏龟》，这是第一部甲骨文的书。',
    '药材商一直不肯说骨头是从哪里挖的。后来学者罗振玉一路追查，终于找到河南安阳的小屯村。村边的田地底下，埋着三千多年前商朝后期的都城，殷墟。',
    '1917年，王国维从卜辞里一个一个找出商朝先王的名字，排出他们的先后，再拿去和司马迁《史记·殷本纪》对照：两者大体吻合，只有个别王的次序要调整。司马迁写这篇的时候，离商朝已经一千年，他手里显然有可靠的材料。在这以前，许多人怀疑商朝只是传说。从这一天起，商朝从书上走到了地上。'],
   quote:{k:'学者',t:'吾辈生于今日，幸于纸上之材料外，更得地下之新材料。',src:'王国维《古史新证》，1925年'},
   tie:'司马迁的记述是第二层，商朝真实发生的事是第一层。药铺里差点被磨成粉的龙骨，在两层之间搭起了一座桥。',
   think:'药铺伙计刮掉骨头上的字，是为了好卖。想一想：历史上还有哪些东西，是因为“没人当回事”而差点消失的？'},
  {scr:2,q:'太史一家三兄弟，为什么宁死也要写下一句话？',img:'slips',
   story:['公元前548年，齐国的大臣崔杼因为私怨，派人杀死了国君齐庄公。国君死在大臣手里，这在当时是天大的罪。',
    '齐国的太史提起笔，在竹简上写下五个字：“崔杼弑其君。”一个“弑”字，就是说这是以下犯上的谋杀。崔杼大怒，杀了太史。',
    '按照规矩，史官的职位由家人接替。太史的弟弟接过竹简，写的还是那五个字。崔杼又杀了他。第三个弟弟接着写，同样被杀。到了第四个弟弟，他拿起笔，写下的仍然是“崔杼弑其君”。崔杼手里握着刀，看着那五个字，终于放下了。',
    '故事还没完。齐国南边还有一位史官，叫南史氏。他听说太史一家都死了，抱着竹简就往都城赶，打算接着写。走到半路，听说已经写成了，他才转身回家。',
    '一千八百多年后，南宋的文天祥被元军关在大牢里，写下《正气歌》，第一个举的例子就是这件事：“在齐太史简，在晋董狐笔。”'],
   quote:{k:'古籍',t:'大史书曰：“崔杼弑其君。”崔子杀之。其弟嗣书而死者二人。其弟又书，乃舍之。南史氏闻大史尽死，执简以往。闻既书矣，乃还。',src:'《左传·襄公二十五年》'},
   tie:'第二层不是随手记下的。有人为了写对一句话付出性命，也有人想用刀逼史官改写。所以读任何一本史书，都要先问一句：这是谁写的？',
   think:'假如你是第四个弟弟，你会怎么写？如果史官都怕死改了字，后人读到的历史会是什么样子？'},
  {scr:2,q:'秦朝为什么穿黑衣服？',img:'terracotta',
   story:['战国后期，齐国有一位学者叫邹衍，名气大得很，到哪一国都被奉为上宾。他发明了一套解释朝代兴亡的理论，叫“五德终始”。',
    '他说，天下万物由土、木、金、火、水五种“德”轮流主宰：木克土，金克木，火克金，水克火，土又克水，转一圈，回到开头。每个朝代都得到其中一德，德衰了，就被克它的那一德取代。黄帝是土德，夏是木德，商是金德，周是火德。下一个是谁？当然是能灭火的水。',
    '秦始皇统一天下后，认定这个“水”说的就是秦。从此衣服、旗帜一律用黑色；一年从十月算起；凡事以六为准，帽子六寸，车宽六尺，驾车用六匹马；连黄河都改名叫“德水”。整个王朝，按一种历史观换了颜色。',
    '不过，兵马俑刚出土时，身上残留的彩绘五颜六色，朱红、粉绿、紫蓝都有。可见“尚黑”主要是朝廷礼仪上的规定，并不是士兵人人穿黑。',
    '这套理论还有一个秦始皇不愿多想的结论：既然水能克火，土也能克水。轮子还会转，秦也会被下一德取代。秦朝只存在了十五年。后来汉朝的人争了很久，自己到底算哪一德。'],
   quote:{k:'古籍',t:'始皇推终始五德之传，以为周得火德，秦代周德，从所不胜。……衣服旄旌节旗皆上黑。数以六为纪。',src:'《史记·秦始皇本纪》'},
   tie:'车轮式的历史观不只写在书上。它决定了一个王朝穿什么颜色、怎样定历法，也悄悄预告了这个王朝的结局。',
   think:'如果你相信历史只是一个轮子，你当上皇帝以后，会安心吗？'},
  {scr:3,q:'圣经以外，有人提到过大卫王吗？',img:'telDan',
   story:['很长一段时间里，一些学者认为大卫王只是以色列人的民族传说，就像中国人讲的黄帝。理由很简单：除了圣经，没有任何古代文字提到过他。',
    '1993年夏天，以色列北部的但城遗址正在发掘。考古队的测量员吉拉·库克在一堵古墙里，看见一块玄武岩上刻着字。第二年，队员又在附近找到两块残片。',
    '碑文是亚兰文，约刻于公元前9世纪。立碑的是以色列北边的一位亚兰王，多数学者认为是大马士革的哈薛。他在碑上夸耀自己的战功：杀了“以色列王”，还杀了“大卫家”的王。这是圣经以外，第一次有人写下“大卫家”。',
    '更有意思的是，列王纪下第9章记的是另一个版本：杀死这两位王的，是以色列的将军耶户。到底是谁？可能是两方都在给自己记功。一块敌人的碑和一本圣经，对同一件事说法不同，这正是历史学家最常遇到的难题。',
    '这块石碑现在陈列在耶路撒冷的以色列博物馆。'],
   quote:{k:'经文',t:'拿单对大卫说：“你就是那人！”',src:'撒母耳记下 12:7'},
   tie:'圣经写大卫，连他的罪也原原本本写下来；他的敌人立的碑，也承认有一个“大卫家”。把不同来源的材料对在一起看，就是读历史的办法。',
   think:'一位国王给自己立碑，会把打了败仗的事刻上去吗？读这样的碑文，你要多留一个心眼吗？'},
  {scr:4,q:'牧羊少年扔出的一块石头，打中了什么？',img:'dss',
   story:['1946年冬天到1947年初，死海西北岸的荒山里，一个贝都因少年在找走失的山羊。他往一个山洞里扔了块石头，想把羊赶出来，却听见里面“哐啷”一声，是陶罐碎了。',
    '他钻进洞里，在几个陶罐中找到一些裹着布的旧皮卷。没人知道它们是什么。几卷经卷几经转手，被卖给伯利恒的一个鞋匠兼古董商，又转到别人手里。',
    '1947年11月29日，希伯来大学的苏克尼克教授冒险穿过战乱的街道，买下其中三卷。就在同一天，联合国投票通过了分治巴勒斯坦的决议。另外四卷被一位叙利亚大主教带到美国，1954年竟登在《华尔街日报》的分类广告上出售。苏克尼克的儿子雅丁托人暗中买下，把它们带回了耶路撒冷。',
    '后来，人们在附近十一个山洞里一共找到九百多份经卷和残片。旧约除了以斯帖记，每一卷都有。最完整的以赛亚书长七米多，抄写于公元前125年前后，比此前所知最早的希伯来文完整抄本早了约一千年。',
    '学者把两份相隔一千年的抄本放在一起逐字比对，结果差别极小，大多是拼写和字形的不同。一千年间，一代代抄写的人，几乎没有走样。'],
   quote:{k:'经文',t:'草必枯干，花必凋残，惟有我们神的话必永远立定。',src:'以赛亚书 40:8'},
   tie:'历史要靠留下来的东西去接近。圣经本身，也有一条可以一步步查考的传抄之路。',
   think:'如果没有死海古卷，我们还能用什么办法，知道古人抄书时有没有抄错？'}
 ]

 v1:{src:'l2v1.mp4',poster:'l2v1.jpg',label:'视频一　史料从哪里来　4分17秒',
   quiz:[{at:106.8,q:'原始材料离事件近。它一定比二手材料可靠吗？',opts:['一定，离得近就对','不一定，当时的人也会看错、也会说谎','原始材料都不可靠'],a:1,ok:'两种都要读。好的二手材料把许多证据放在一起比较过。',hint:'视频里说，当时的人也会怎样？'},
         {at:178.6,q:'孟子不信“血流漂杵”。他的理由是什么？',opts:['他找到了别的记载','他亲眼见过那一仗','“仁人不会这样”，这是他心里的道理'],a:2,ok:'孟子敢怀疑书，很可贵；可是心里的道理还不是证据。要靠第三个问题。',hint:'孟子说，仁德的人去讨伐最不仁的人，会怎样？'}],
   points:['路加写福音书：找亲眼看见的人，详细考察，按着次序写。','原始材料是当时的人留下的：卜辞、铭文、当年的信和日记。二手材料是后人根据原始材料写成的。','读史料先问三个问题：谁写的？离多远？有没有别的证据？','孟子说“尽信书，则不如无书”。敢怀疑很可贵，但怀疑也要有证据。','王国维把纸上的古书和地下的甲骨放在一起对：《史记》的商王名单基本吻合。']},

   cards:[{t:'商朝人刻在牛骨上的卜辞',src:'商 · 殷墟',b:0,img:'oracleDi',say:'占卜的人当时刻下的，是研究商朝最直接的材料。'},

          {t:'王国维研究商王世系的文章',src:'1917年',b:1,img:'wgw',say:'他把甲骨和《史记》对照，写成研究。研究本身是二手材料。'},
          {t:'《三国演义》写三国',src:'明代',b:1,img:'sanguo',say:'罗贯中离三国一千多年，根据史书和民间故事写成小说。它是后人写的，而且加进了许多想象。'}],

 v2:{src:'l2v2.mp4',poster:'l2v2.jpg',label:'视频二　同一件事，不同的写法　4分43秒',
   quiz:[{at:116.5,q:'关于项羽之死，下面哪一项最可靠？',opts:['他在乌江边说的每一个字','他兵败自杀这件事','他当时心里的想法'],a:1,ok:'击杀项羽的五个人都封了侯，记在功臣表里；对话的字句却只有司马迁一份。',hint:'哪一项有多份记载互相印证？'},
         {at:216.4,q:'杜牧、王安石、李清照，对同一件事看法不同。这说明什么？',opts:['总有两个人说错了','每一种看法后面，都站着一个人和他的时代','诗人的话不能当历史读'],a:1,ok:'写历史的人站在哪里看、用什么标准评价，这就叫史观。',hint:'李清照写这首诗的时候，宋朝刚刚发生了什么？'}],
   points:['公元前202年，项羽兵败，在乌江边不肯渡江，自刎而死。','三个问题：司马迁是汉朝史官，写在一百年后；兵败自杀有功臣表作证，对话的细节只有这一份。','司马迁把项羽放进“本纪”，又批评他怪天不怪己；班固把他挪到“列传”。事实没变，评价变了。','杜牧、王安石、李清照三首诗，三种看法。这就是史观。','用圣经衡量：人做的事，人要负责；人只看外貌，最后的审判在神手里。']},
 task2:{tiers:[
   {h:'谁写的？他站在哪一边？',img:'liubang',ref:'箴言 18:17',v:'先诉情由的，似乎有理；但邻舍来到，就察出实情。',s:'司马迁是汉朝的史官，项羽是汉朝开国皇帝刘邦的敌人。读他写项羽，要记得他站在哪一边。'},

   summary:'三个问题不是叫我们什么都不信，而是把能确定的和不能确定的分开：事实要查证据，评价要看是谁在说、站在哪里说。'},
 read:[
  {kind:'scr',tag:'经文',origin:'路加福音写于公元一世纪下半叶。这是全书的开头，写给一位叫提阿非罗的人。',ref:'路加福音 1:1–4',
   text:'[[{提阿非罗|收信人的名字，意思是“爱神的人”。}大人哪，]][[有好些人提笔作书，述说在我们中间所成就的事，]][[是照传道的人从起初亲眼看见又传给我们的。]][[这些事我既从起头都详细{考察|查问、核对。}了，]][[就定意要按着次序写给你，]][[使你知道所学之道都是{确实|可靠，靠得住。}的。]]',
   act:{type:'pick',q:'路加写这本书，是为了什么？在经文里点出来。',a:5,ok:'“使你知道所学之道都是确实的。”路加查考、按次序写，是为了让读的人知道这些事靠得住。',hint:'找一找最后一句。'}},
  {kind:'cls',tag:'古籍',book:'史记',bg:'shiji',origin:'司马迁写于公元前100年前后，离项羽之死约一百年。',
   text:'于是项王乃欲东渡乌江。乌江亭长{舣|把船停靠在岸边。}船待，谓项王曰：“江东虽小，地方千里，众数十万人，亦足{王|读wàng，称王。}也。愿大王急渡。今独臣有船，汉军至，无以渡。”[[项王笑曰：“天之亡我，我何渡为！]][[且{籍|项羽名籍，这里是自称。}与江东子弟八千人渡江而西，今无一人还，]][[{纵|即使。}江东父兄怜而{王我|让我做王。}，我何面目见之？]][[纵彼不言，籍独不愧于心乎？”]]',
   plain:'项王想往东渡过乌江。乌江亭长把船靠在岸边等着，对项王说：“江东虽然小，土地也有方圆千里，人口几十万，也足够称王了。请大王赶快渡江。现在只有我有船，汉军来了也没法渡。”项王笑着说：“天要亡我，我还渡江做什么！况且我和江东八千子弟渡江西征，如今没有一个人回来，就算江东父老可怜我、让我做王，我有什么脸见他们？就算他们不说，我难道心里不惭愧吗？”',
   act:{type:'pick',q:'项羽自己说不肯渡江的理由，哪一处说得最直接？点出来。',a:2,ok:'“我何面目见之？”他说的是没脸见江东父老。至于他心里是否还有别的想法，司马迁不知道，我们也不知道。',hint:'找“面目”两个字。'}},
  {kind:'short',q:'杜牧和王安石，你觉得谁说得更有道理？用一句话说出理由。',
   ref:'参考：没有标准答案。支持王安石的人会指出，项羽带出去的八千子弟无一生还，江东人心未必还向着他；支持杜牧的人会指出，刘邦也屡败屡战。重要的是理由来自材料。'}
 ],
 essay:{q:'你怎样评价项羽不肯过江东？',
   starts:['我认为项羽不肯过江东，','我的理由是（引用《史记》或一首诗），','用圣经的话来看，'],
   ev:[['《史记·项羽本纪》','天之亡我，我何渡为！且籍与江东子弟八千人渡江而西，今无一人还，纵江东父兄怜而王我，我何面目见之？'],['太史公曰','五年卒亡其国，身死东城，尚不觉寤而不自责，过矣。乃引“天亡我，非用兵之罪也”，岂不谬哉！'],['杜牧《题乌江亭》','胜败兵家事不期，包羞忍耻是男儿。江东子弟多才俊，卷土重来未可知。'],['王安石《乌江亭》','百战疲劳壮士哀，中原一败势难回。江东子弟今虽在，肯与君王卷土来？'],['李清照《夏日绝句》','生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。'],['箴言 19:3','人的愚昧倾败他的道；他的心也抱怨耶和华。'],['撒母耳记上 16:7','人是看外貌；耶和华是看内心。']],
   summary:'评价一个人，先把事实查清楚，再说明自己站在哪里、用什么标准。项羽怪天不怪己，这一点可以批评；他心里到底怎样，我们只能说到证据能支持的地方。',
   peers:['我认为项羽不肯过江东，是因为他太骄傲，不肯认输。我的理由是，《史记》里他说“天之亡我”，到死都不认为是自己的错，司马迁也批评他“岂不谬哉”。用圣经的话来看，箴言说人的愚昧倾败他的道，心里却抱怨神，项羽就是这样。','我认为项羽不肯过江东，有骄傲，也有羞愧。我的理由是，他说“我何面目见之”，八千子弟都死了，他觉得对不起他们。用圣经的话来看，人是看外貌，耶和华是看内心，我不能替他把心里的事都说完。'],
   read:[['想读完整的故事','《史记·项羽本纪》从“项王军壁垓下”读到篇末，约一千字。'],['想知道司马迁是怎样的人','他写给朋友的信《报任安书》，第1课读过其中一句。'],['想比较圣经怎样写一位失败的王','撒母耳记上第15章和第31章，扫罗的结局。圣经对扫罗的评价放在哪里？']],
   more:'司马迁是汉朝的史官，却把汉朝的敌人项羽写进“本纪”。你觉得他为什么这样做？'},
 close:{three:['读史料，先问三个问题：谁写的？离多远？有没有别的证据？','原始材料离得近，二手材料比较过证据，两种都要读；纸上的和地下的，放在一起对。','事实要查证据；评价要看是谁在说、站在哪里说。我们用圣经衡量，也知道自己的限度。'],
   award:'oracleDi',awardSay:'商代卜骨刻辞拓片。王国维把这样的甲骨和《史记》放在一起对，两个互不相识的见证人，说的是同一件事。'},
 lib:[
  {scr:2,q:'世界上最老的一封名人亲笔信，写了些什么？',img:'pingfu',
   story:['故宫里藏着一张发黄的麻纸，只有九行，八十多个字，字迹像一团团缠绕的草。它是西晋文学家陆机写给朋友的一封信，距今一千七百多年，是现在能见到的最早的名人书法真迹。',
    '信的内容很家常：一位朋友病了，陆机担心他“恐难平复”，怕一时好不了。后人就从这一句里取了两个字，叫它《平复帖》。写信的人当然没想到，这张随手写的问候，会被一代代人当成宝贝。',
    '一千多年里，它在宫廷和收藏家手里辗转。民国年间，收藏家张伯驹听说有外国人想买走它，四处筹钱，终于在1937年底把它买下。抗战时期一路南北奔走，据说他和妻子潘素把它缝在衣被里随身带着，人在帖在。',
    '1956年，张伯驹把《平复帖》连同其他珍贵书画一起捐给了国家。今天它躺在故宫博物院里，偶尔展出几天，就有人排几个小时的队来看。',
    '对研究陆机的人来说，这是最好的原始材料：没有经过别人转述，墨迹就是他本人的手写下的。'],
   quote:{k:'古籍',t:'彦先羸瘵，恐难平复。',src:'陆机《平复帖》（释读各家略有不同）'},
   tie:'原始材料不一定是国家大事。一封问候病人的信，也能让我们隔着一千七百年，听见一个人说话的口气。',
   think:'你今天写下的哪些东西，一千年后可能成为“原始材料”？朋友圈、作业本，还是一张便条？'},
  {scr:2,q:'司马迁为什么要跑遍大半个中国？',img:'shiji',
   story:['司马迁二十岁那年，背起行囊出了门。他往南到了长江、淮河一带，爬上会稽山去找传说中大禹的遗迹，在湘江边上想念投江的屈原；又往北到了孔子的故乡，看鲁国人怎样演习古礼。',
    '他不是去游山玩水，是去“采访”。写《史记》的时候，他常常在篇末交代自己去过哪里、听谁说过什么。写韩信，他说：我到过淮阴，当地人告诉我，韩信还是平民的时候就志向不凡。母亲去世，他穷得没钱下葬，却特意选了一块又高又宽的地，说将来墓旁可以住下一万户人家。',
    '司马迁说：我去看了他母亲的墓，果然是这样。',
    '写孟尝君，他说自己路过薛地，发现那里多是凶悍的年轻人，和别处风气不同。问当地人，才知道当年孟尝君招来天下的游侠，六万多户人家迁到了薛。',
    '两千年前没有火车，没有地图软件。一个年轻人用双脚把材料一条一条核对过，这些文字才有了分量。'],
   quote:{k:'古籍',t:'吾如淮阴，淮阴人为余言，韩信虽为布衣时，其志与众异。……余视其母冢，良然。',src:'《史记·淮阴侯列传》'},
   tie:'这和路加的“详细考察”是同一种功夫：不只读书，还要去现场，去问亲眼看见、亲耳听见的人。',

  {scr:3,q:'鸿门宴上的悄悄话，司马迁是怎么知道的？',img:'xiangyu',

    '有一条线索藏在《史记》的另一篇里。司马迁在樊哙等人的合传末尾说：我和樊他广有交往，他给我讲了高祖功臣们起家时的事。樊他广，正是樊哙的孙子。',

    '还有一些话，比如前一天夜里项伯和张良的密谈，在场的只有两个人。钱锺书说，史家写这样的场面，常常要设身处地去揣摩，写得合情合理。大事可信，细节要留一点余地。'],

  {scr:4,q:'孙子和孙膑，是不是同一个人？',img:'slips',
   story:['《史记》里有两位姓孙的兵法家：春秋时的孙武，写了《孙子兵法》；一百多年后战国时的孙膑，也写过兵法，《汉书》的书目里还记着这本书。',
    '可是孙膑的兵法后来失传了。时间一长，宋朝以后有些学者开始怀疑：会不会只有一个孙子，一部兵法，司马迁把一个人说成了两个？这个疑问争了好几百年，谁也说服不了谁。',
    '1972年4月，山东临沂的银雀山上，工人修建筑时挖到两座西汉墓。墓里有几千枚竹简，整理的人一枚一枚辨认，发现里面既有《孙子兵法》，又有一部从没见过的兵书，写着孙膑和齐威王、田忌的问答。',
    '失传了将近两千年的《孙膑兵法》，就这样从地下回来了。两个人，两部书，司马迁没有写错。',
    '这就是第三个问题的力量：纸上的说法争不清，地下的证据一出来，事情就清楚了。'],

   tie:'王国维说的“纸上的材料”和“地下的材料”放在一起对，在这里又一次用上了。',
   think:'在银雀山竹简出土以前，怀疑“孙子和孙膑是一个人”的学者错了吗？怀疑本身有没有价值？'},
  {scr:4,q:'路加用错了一个官名吗？',img:'luke',
   story:['使徒行传第17章说，保罗在帖撒罗尼迦传道，城里起了骚乱，一群人把信徒拉到“地方官”那里。“地方官”在希腊原文里是一个很少见的词，意思是“城里的首长”。',
    '十九世纪，有些学者翻遍了古希腊罗马的书，找不到这个官名，就怀疑路加记错了，甚至认为使徒行传写得很晚，作者对当地情况并不了解。',
    '后来人们在帖撒罗尼迦的一座古城门上，找到一块石刻铭文，开头列着几位官员的名字，用的正是这个头衔。这块石刻后来运到伦敦，现在藏在大英博物馆。',
    '此后，各地又陆续发现了几十处用这个官名的铭文，其中许多就在帖撒罗尼迦一带。路加用的，正是当地人当时的叫法。',
    '书里找不到，不等于不存在。有时候，是我们手里的证据还不够多。'],

  {kind:'scr',tag:'经文',origin:'保罗在雅典的亚略巴古讲话。听的人是希腊人，他们不读圣经，也不认识以色列的神。',ref:'使徒行传 17:26–27',

  {kind:'cls',tag:'古籍',book:'史记',bg:'shiji',origin:'司马迁写《史记》，从黄帝写起。可是黄帝的时代没有文字留下来，他在《五帝本纪》的末尾说出了自己的难处。',
   text:'学者多称五帝，{尚|久远。}矣。[[然《尚书》独载尧以来；]][[而百家言黄帝，其文不{雅驯|雅正可靠。}，]]{荐绅先生|有学问、有身份的读书人。}难言之。……余尝西至{空桐|山名，在今甘肃。}，北过{涿鹿|地名，在今河北。}，东{渐|到。}于海，南浮江淮矣，[[至长老皆各往往称黄帝、尧、舜之处，]][[风教固殊焉，]][[总之不离古文者近是。]]',
   plain:'学者常常说到五帝，可是年代太久远了。《尚书》只记了尧以后的事；诸子百家讲黄帝，说法不雅正、不可靠，有学问的读书人也难以说清。……我曾经往西到过空桐山，往北经过涿鹿，往东到了海边，往南渡过长江、淮河，所到之处，老人们常常讲起黄帝、尧、舜的事迹，各地的风俗教化本来就不相同。总的来说，和古书记载不相违背的说法，比较接近真实。',
   act:{type:'pick',q:'司马迁觉得哪一种说法靠不住？点出来。',a:1,ok:'“百家言黄帝，其文不雅驯。”他知道关于黄帝的说法很多，并不都可靠，所以要走访各地，再和古书对照。没有文字的时代，司马迁也只能这样小心。',hint:'找“不雅驯”三个字。'}},
  {kind:'short',q:'“中国什么都是自己发明的”和“好东西都是外面来的”，这两种说法你听到过哪一种？用一句话说说你现在怎么看。',
   ref:'参考：没有标准答案。可以用这一课的证据回答：小米、水稻在本地驯化，彩陶从东往西传；小麦、绵羊、黄牛从西边来，商朝人又铸出了别处没有的大鼎。本地长出来，又一直和外面有来往。'}

 essay:{q:'中国人从哪里来？用这一课学到的，写一段话回答。',
   starts:['中国的文明是','我的证据是（举一样考古发现），','用圣经的话来看，'],
   ev:[['使徒行传 17:26','他从一本造出万族的人，住在全地上，并且预先定准他们的年限和所住的疆界，'],['创世记 11:9','因为耶和华在那里变乱天下人的言语，使众人分散在全地上，所以那城名叫巴别。'],['创世记 10:32','这些都是挪亚三个儿子的宗族，各随他们的支派立国。洪水以后，他们在地上分为邦国。'],['使徒行传 14:17','然而为自己未尝不显出证据来，就如常施恩惠，从天降雨，赏赐丰年，叫你们饮食饱足，满心喜乐。'],['夏鼐 · 阳洼湾','1945年在甘肃发掘：齐家的墓葬在上，仰韶系统的彩陶片在下。甘肃的彩陶比河南的晚。'],['苏秉琦','早期中国的文明像“满天星斗”：各地的人各自发展，又互相往来。']],
   summary:'回答“从哪里来”，要分开两件事：文明怎样长成，靠地下的证据；人从哪里来、属于谁，圣经已经说了。两件事都只说到证据和经文能支持的地方。',
   peers:['中国的文明是本地长出来的，但也学了别人的东西。我的证据是，夏鼐在甘肃一层一层往下挖，发现甘肃的彩陶比河南的晚，所以彩陶不是从西边来的；可是小麦是从西亚传来的。用圣经的话来看，神从一本造出万族的人，中国人和别的民族本来就是一家。','中国的文明是许多地方的人一起长成的。我的证据是，仰韶在黄河边，良渚在长江边，石峁在北方的高原上，苏秉琦说这像满天星斗。用圣经的话来看，神定准了各族的疆界，也从天降雨、赏赐丰年，没有留下文字的人也在祂手中。'],
   read:[['想看看良渚','良渚古城遗址2019年列入《世界遗产名录》。良渚博物院的网站上有古城和水坝的图。'],['想知道夏鼐','他的日记已经整理出版，叫《夏鼐日记》。1945年在甘肃的那几个月，日记里都有记录。'],['想读完万民表','创世记第10章全章和第11章1–9节，看看各族怎样分散到全地上。']],
   more:'良渚人在玉琮上刻神人兽面的花纹。你觉得他们在敬拜什么？关于这件事，我们能知道多少，又有多少不能知道？'},
 close:{three:['北方种小米，南方种稻子；早期的文明像满天星斗。','中国的文明是本地长出来的，又一直和外面有来往；一个说法对不对，要看证据。','地上的万族同出一本；没有留下文字的人，也在神的手中。'],
   award:'cong',awardSay:'良渚玉琮。五千年前的人把坚硬的玉磨成这样，上面刻着神人兽面的花纹。他们没有留下一个字，我们只能从器物去读他们。'},
 lib:[
  {scr:2,q:'人面鱼纹盆，原来是做什么用的？',img:'fishbasin',
   story:['1950年代，考古学家在西安东郊的半坡村发掘出一座六千多年前的村子。房子半埋在地下，村子外面挖着一圈壕沟，村边还有烧陶的窑。',
    '出土的彩陶里，最出名的是一只红色的陶盆。盆里用黑色画着一张圆圆的人脸，眼睛眯成一条线，嘴边、耳边各衔着一条鱼，头顶像戴着尖尖的帽子。',
    '这样的盆是怎么用的？考古学家发现，半坡人把夭折的小孩放进陶瓮，埋在房子附近，常常用一只陶盆扣在瓮口做盖子。人面鱼纹盆就出自这样的瓮棺。有的盆底还钻着一个小孔，有学者猜，那是留给孩子灵魂进出的。',
    '那张脸是谁？有人说是部落的图腾，有人说是祈求多打鱼，有人说是巫师戴的面具。说法很多，到今天也没有定论。',
    '因为半坡人没有留下一个字。我们看得见他们的悲伤和盼望，却听不见他们自己怎么说。'],
   quote:{k:'经文',t:'神造万物，各按其时成为美好，又将永生安置在世人心里。',src:'传道书 3:11'},
   tie:'没有文字的时代，器物能告诉我们人做了什么，却很难告诉我们他们心里想什么。这就是考古的长处，也是它的限度。',
   think:'如果六千年后的人只挖到你房间里的东西，他们会怎样猜你？会猜错什么？'},
  {scr:2,q:'良渚古城，是怎样被找到的？',img:'cong',
   story:['1936年，杭州西湖博物馆有一位二十多岁的年轻职员，叫施昕更。他是良渚镇人，回老家时注意到，田里、河边常能捡到黑亮的陶片和磨光的石器。',
    '他自己动手试掘，把发现写成一本报告，书名就叫《良渚》，1938年出版。可是抗战爆发，他颠沛流离，不到三十岁就病逝了，没能看到后来的一切。',
    '1959年，夏鼐提出“良渚文化”这个名字。1986年，考古学家在反山的大墓里挖出了玉琮、玉钺，其中最大的一件玉琮，后来被叫作“琮王”。',
    '真正的惊喜在2007年：考古学家确认，这里有一圈四边城墙围起来的古城。几年后又弄清，城外的山谷里还有一整套水坝系统，是一项要动员成千上万人的工程。',
    '2019年，良渚古城遗址列入《世界遗产名录》。从一个年轻人捡起陶片，到整座古城重见天日，用了八十多年。'],
   tie:'一个发现常常要几代人接力。施昕更没有看到古城，可是他记下的每一块陶片，都是后来的人往下挖的起点。',
   think:'施昕更只看到了陶片和石器。如果当时有人说“良渚有一座大城”，他该信吗？要等什么证据？'},
  {scr:3,q:'夏鼐在甘肃的墓里看见了什么？',img:'majiayao',
   story:['夏鼐是浙江温州人，在英国伦敦大学学过考古，研究古埃及，1941年回国。那时候中国还没有几个受过正规训练的考古学家。',
    '1945年，抗战快要结束，他跟着西北科学考察团到了甘肃，在宁定县（今广河县）的阳洼湾，清理了两座齐家文化的墓葬。',
    '他注意到一个细节：墓坑的填土里，混着仰韶系统的彩陶碎片。这说明，人们挖这座墓的时候，那些彩陶早已碎在地里了。齐家文化，一定比这些彩陶晚。',
    '这一下，安特生排的顺序就站不住了。安特生把齐家放在最前面，当作最早的；夏鼐用地层证明，它其实在后面。',
    '他把发现写成论文《齐家期墓葬的新发现及其年代的改订》。“改订”两个字很老实：不是推倒重来，是把前人排错的地方改过来。'],
   tie:'这就是视频二里“有没有别的证据能对上”的那一刻：证据不是从书里来的，是从一个墓坑的填土里来的。',
   think:'夏鼐发现安特生排错了，他应该怎样看安特生？安特生又应该怎样看夏鼐？'},
  {scr:3,q:'安特生在中国，还找到了什么？',img:'andersson',
   story:['安特生原本不是考古学家，而是地质学家。1914年，北洋政府请他来中国做矿业顾问，帮忙找铁矿和煤矿。',
    '找矿的时候，他也留心收集化石。中药铺里卖的“龙骨”，其实多半是古代动物的骨头化石。顺着这条线索，1921年，他带人来到北京西南的周口店。',
    '同一年，他在河南仰韶村挖出了彩陶。一年之内，他碰到了两个改变中国考古的地方。',
    '周口店后来挖了很多年。1929年，中国学者裴文中在那里发现了第一个完整的“北京人”头盖骨，轰动了世界。',
    '安特生把许多出土品带回瑞典，在斯德哥尔摩建起了东方博物馆。按当时的约定，有一部分要送还中国；送回来的那些，后来在战乱中大多下落不明。'],
   tie:'安特生的“西来说”错了，可他开了头。一门学问往前走，常常是一个人提出猜想，另一个人用证据修正它。',
   think:'一个人的猜想被证明错了，他的工作还有价值吗？为什么？'},
  {scr:4,q:'四千年前的一粒麦子，是怎样找到的？',img:'wheat',
   story:['麦粒比米粒还小，埋在土里几千年，早就烂了，怎么可能找到？',
    '秘密在“炭化”。如果一粒麦子落进火里，烧焦了却没有烧成灰，它就变成一粒小小的炭。炭不会腐烂，可以在土里保存几千年。',
    '考古学家想出了一个办法，叫“浮选”。把挖出来的土倒进水里搅一搅，泥沙沉下去，炭化的种子比较轻，就浮了上来。再用很细的筛网一捞，一粒粒拣出来，放在显微镜下看。',
    '靠着浮选，考古学家在甘肃、山东等地找到了距今四千多年的炭化小麦，也找到了更早的炭化小米和稻米。还可以直接拿一粒麦子去测碳十四，看看它有多老。',
    '一粒焦黑的麦子，就这样成了证据，告诉我们小麦大约什么时候来到了中国。'],
   quote:{k:'经文',t:'就如常施恩惠，从天降雨，赏赐丰年，叫你们饮食饱足，满心喜乐。',src:'使徒行传 14:17'},
   tie:'这就是“别的证据”可以小到什么程度：古书不会记下谁家灶边掉了一粒麦子，可地下记得。',
   think:'你家厨房里，有哪些东西几千年后可能成为“证据”？'}
 ]
};

   points:['1899年王懿荣开始收购刻字的骨头；1928年起，中国学者在河南安阳小屯村科学发掘，找到了商朝后期的都城殷墟。','甲骨上的商王名字，和《史记》的记载基本对上了。商朝从传说变成了可信的历史。','商王事事占卜：在龟甲牛骨背面钻坑、火烧，正面裂开，看裂纹定吉凶，再把问的事和结果刻在旁边。','卜辞是商朝人自己留下的原始材料。甲骨文和今天的汉字是同一种文字，三千多年没有断过。','“国之大事，在祀与戎”：青铜器主要用来祭祀和打仗。妇好墓里的铜器，和卜辞里的妇好对上了。']},

   points:['卜辞里，商人相信三类力量：最高的“帝”，山川风雨的神，死去的祖先。','商人很少直接向帝献祭，而是求祖先。他们知道有一位最高的帝，却不认识祂。','保罗在雅典说：“你们所不认识而敬拜的，我现在告诉你们。”','商王事事占卜，想把明天握在自己手里。圣经说：明天在神的手中。','商人用人献祭，殷墟王陵旁有上千座祭祀坑。圣经说，这是神所憎恶的；那些没有留下名字的人，也是照着神的形像造的。']},

  {kind:'cls',tag:'卜辞',book:'合集',bg:'oracleDi',origin:'这是商王武丁时的一条卜辞，问的是王后妇好生孩子的事。释文据《甲骨文合集》14002，标点是今人加的。',
   text:'[[甲申卜，{㱿|人名，读què。占卜的人。}贞：]][[妇好{娩|生孩子。}，{嘉|好，顺利。}？]][[王{占|看裂纹作判断。}曰：其惟丁娩，嘉；其惟庚娩，{引吉|大吉。}。]][[三旬又一日甲寅娩，不嘉，惟女。]]',
   plain:'甲申这天占卜，一个叫㱿的人问：妇好生产，顺利吗？王看了裂纹说：要是丁日生，好；要是庚日生，大吉。过了三十一天，甲寅日生了，不好，是个女孩。',

 essay:{q:'商朝人在问谁？用这一课学到的，写一段话回答。',
   starts:['商朝人占卜的时候，','我的证据是（举一条卜辞或一件出土的东西），','用圣经的话来看，'],
   ev:[['卜辞 · 合集14002','妇好娩，嘉？王占曰：其惟丁娩，嘉；其惟庚娩，引吉。'],['卜辞','帝令雨足年？（帝会命令下足够的雨，让今年有好收成吗？）'],['使徒行传 17:23','你们所不认识而敬拜的，我现在告诉你们。'],['雅各书 4:14','其实明天如何，你们还不知道。'],['申命记 12:31','甚至将自己的儿女用火焚烧，献与他们的神。'],['胡厚宣统计','卜辞里记载用人献祭的，前后有一万多人。']],
   summary:'回答“在问谁”，要分开说：卜辞告诉我们商人求的是帝、山川和祖先；他们不认识那位最高的帝。圣经说出了他们不知道的：明天在神手中。',
   peers:['商朝人占卜的时候，大多是在问祖先，也知道有一位最高的帝。我的证据是，卜辞里有“帝令雨足年”这样的话，可是他们很少直接向帝献祭。用圣经的话来看，他们像雅典人一样，敬拜一位不认识的神。','商朝人占卜的时候，是想知道明天会怎样。我的证据是妇好生孩子那条卜辞：王说丁日生好，结果甲寅日生了，没有猜对。用圣经的话来看，明天如何我们还不知道，只当说“主若愿意”。'],
   read:[['想看甲骨','中国国家博物馆、殷墟博物馆的网站上都有甲骨的高清图。'],['想知道妇好','妇好墓出土的铜器、玉器，有一部分在殷墟博物馆展出。'],['想读完保罗的讲话','使徒行传第17章22–31节。']],
   more:'商人怕祖先降祸，就献上他们以为最贵重的东西。今天的人怕什么？又会拿什么去“讨好”？'},

  {scr:2,q:'王懿荣真的是在药里发现甲骨文的吗？',img:'wangyr',
   story:['人们最常讲的故事是这样的：1899年，王懿荣得了疟疾，药方里有一味“龙骨”。他在药渣里看见骨头上刻着字，认出这是比金文还古老的文字。',

    '比较可靠的说法是：古董商从河南带来了刻字的骨片，卖给喜欢金石的王懿荣。他认出了上面的字，开始大量收购。',
    '可以确定的事不多，但很重要：他是最早认出甲骨文、并有意收藏的人之一。第二年，八国联军进北京，他投井殉国。'],

  {scr:2,q:'妇好墓为什么没有被盗？',img:'fuhaotomb',
   story:['殷墟的商王大墓，几乎都在很早以前就被盗空了。1976年，考古学家郑振香在小屯村西北发掘时，发现了一座不大的墓。',
    '这座墓的位置不在王陵区，地面上原本有一座房屋式的建筑，墓坑不太显眼。后来地下水位上升，墓的下半部泡在水里，也挡住了盗墓的人。',
    '考古队打开墓室，挖出了四百多件青铜器、七百多件玉器，还有六千多枚海贝。很多铜器上铸着“妇好”两个字。',
    '学者再去对照卜辞：两百多条卜辞提到过妇好，她主持祭祀、带兵打仗。地下的墓和甲骨上的字，说的是同一个人。'],

  {scr:3,q:'后母戊鼎曾经被埋起来又挖出来？',img:'houmuwu',
   story:['1939年，河南安阳武官村的村民在地下挖出一只巨大的铜鼎。那时正是抗战时期，日军占领着安阳。',

  {kind:'cls',tag:'古籍',book:'国语',bg:'shiji',origin:'《国语·周语上》记下了召公劝谏周厉王的话。这一段常被叫作《召公谏厉王弭谤》。',
   text:'厉王虐，国人谤王。召公告曰：“民不堪命矣！”王怒，得卫巫，使监谤者。以告，则杀之。[[国人莫敢言，道路以目。]]王喜，告召公曰：“[[吾能弭谤矣，乃不敢言。]]”召公曰：“是{障|堵塞。}之也。[[防民之口，甚于防川。]]川{壅|堵塞。}而{溃|决口。}，伤人必多，民亦如之。[[是故为川者决之使导，为民者宣之使言。]]”……王弗听，于是国人莫敢出言。[[三年，乃流王于彘。]]',
   plain:'周厉王暴虐，都城里的人指责他。召公报告说：“百姓受不了了！”厉王发怒，找来卫国的巫师，叫他监视说话的人。巫师报告谁，就杀谁。都城里没有人敢说话了，熟人在路上只敢互相看一眼。厉王很高兴，对召公说：“我能止住别人说我的坏话了，他们不敢说了。”召公说：“这只是把它堵住了。堵百姓的嘴，比堵河水还危险。河水堵住了一旦决口，伤的人一定多，百姓也是这样。所以治水的人要开一条路让水流出去，治理百姓的人要让他们开口说话。”……厉王不听，于是都城里没有人敢说话。三年以后，人们就把厉王赶到了彘。',
   act:{type:'pick',q:'召公用什么来比喻百姓的嘴？点出来最关键的一句。',a:2,ok:'“防民之口，甚于防川。”这句话后来成了成语。',hint:'找“川”字。'}},
  {kind:'cls',tag:'古籍',book:'孟子',bg:'mengzi',origin:'孟子也说过君王该怎样对待百姓的意见。这是他对齐宣王说的话。',

  {kind:'cls',tag:'古籍',book:'左传',bg:'lianhe',origin:'《左传·襄公三十一年》记下了子产不毁乡校的事。劝子产毁乡校的人叫然明。',
   text:'郑人游于乡校，以论执政。然明谓子产曰：“毁乡校何如？”子产曰：“何为？[[夫人朝夕退而游焉，以议执政之善否。]][[其所善者，吾则行之；其所恶者，吾则改之。]][[是吾师也，]]若之何毁之？[[我闻忠善以损怨，不闻作威以防怨。]]岂不{遽|立刻。}止？然犹防川：大决所犯，伤人必多，吾不克救也。[[不如小决使{道|同“导”，疏导。}，不如吾闻而药之也。]]”……仲尼闻是语也，曰：“以是观之，人谓子产不仁，吾不信也。”',
   plain:'郑国人到乡校游玩聚会，议论执政的人。然明对子产说：“把乡校毁了，怎么样？”子产说：“为什么要毁？人们早晚干完活到那里走走，议论执政的人做得好不好。他们说好的，我就接着做；他们说不好的，我就改。他们是我的老师，怎么能毁掉呢？我听说用忠诚和善意来减少怨恨，没听说用威势来堵住怨恨。堵，难道不能马上止住吗？可那就像堵河水：大决口一来，伤的人一定多，我救都救不了。不如开个小口子疏导，不如让我听到这些话，把它当作药。”……孔子听到这番话，说：“从这件事看，有人说子产不仁，我不信。”',

  {kind:'cls',tag:'古籍',book:'左传',bg:'cqding',origin:'《左传·昭公六年》：子产铸刑书，晋国的叔向写信责备他，子产回了信。下面是两封信里的几句。',
   text:'三月，郑人铸刑书。叔向使{诒|送给。}子产书，曰：“……[[民知有{辟|法律。}，则不忌于上，]][[并有争心，以征于书，]]……[[国将亡，必多制。]]”……复书曰：“[[若吾子之言，侨不才，不能及子孙，]][[吾以救世也。]]”',
   plain:'三月，郑国把刑法铸在鼎上。叔向派人送信给子产，说：“……百姓知道了法律条文，就不再敬畏在上的人，而且会生出争夺的心，处处拿条文来争……国家快要灭亡的时候，法令一定很多。”……子产回信说：“像您说的那样。我（侨，子产的名）没有才能，顾不到子孙后代，我是为了救眼前这个世道。”',
   act:{type:'pick',q:'子产怎样回答叔向？点出他最关键的一句。',a:4,ok:'“吾以救世也。”他承认顾不到长远，先要救眼前的世道。',hint:'找“救”字。'}},

  {kind:'cls',tag:'古籍',book:'论语',bg:'lunyu',origin:'《论语》是孔子的学生和再传学生记下的孔子言行。下面几句分散在不同的篇里。',
   text:'子贡问曰：“有一言而可以终身行之者乎？”子曰：“其恕乎！[[己所不欲，勿施于人。]]”……齐景公问政于孔子。孔子对曰：“[[君君，臣臣，父父，子子。]]”……子曰：“[[朝闻道，夕死可矣。]]”',
   plain:'子贡问：“有没有一句话可以终身照着做？”孔子说：“大概是‘恕’吧！自己不愿意要的，不要加给别人。”……齐景公问孔子怎样治理国家。孔子回答：“君要像君，臣要像臣，父亲要像父亲，儿子要像儿子。”……孔子说：“早晨听见了道，晚上死也甘心。”',
   act:{type:'pick',q:'哪一句是孔子说可以“终身行之”的？点出来。',a:0,ok:'“己所不欲，勿施于人。”孔子把它叫作“恕”。',hint:'跟在“其恕乎”后面。'}},
  {kind:'cls',tag:'古籍',book:'韩非子',bg:'shangjun',origin:'《韩非子·备内》用做车的人和做棺材的人打比方，说明人为什么各为自己打算。',
   text:'{舆人|做车的工匠。}成舆，[[则欲人之富贵；]]{匠人|这里指做棺材的工匠。}成棺，[[则欲人之夭死也。]][[非舆人仁而匠人贼也，]]人不贵则舆不售，人不死则棺不买，[[情非憎人也，利在人之死也。]]',
   plain:'做车的人做好了车，就希望别人富贵；做棺材的人做好了棺材，就希望别人早死。这不是做车的人仁慈、做棺材的人狠毒。人不富贵，车就卖不出去；人不死，棺材就没人买。做棺材的人并不是憎恨别人，只是别人死了对他有利。',
   act:{type:'pick',q:'韩非说，做棺材的人盼别人死，真正的原因是什么？点出来。',a:3,ok:'“情非憎人也，利在人之死也。”不是心恶，是利益。',hint:'找“利”字。'}},
  {kind:'scr',tag:'选读 · 和圣经放在一起读',origin:'诸子问过的几个问题，圣经里也说到了。下面几句放在一起读一读，不必急着下结论。',
   text:'[[神就照着自己的形像造人。]]（创世记 1:27）<br>[[人心比万物都诡诈，坏到极处，谁能识透呢？]]（耶利米书 17:9）<br>[[我也要赐给你们一个新心，将新灵放在你们里面。]]（以西结书 36:26）<br>[[你们愿意人怎样待你们，你们也要怎样待人。]]（路加福音 6:31）<br>[[太初有道，道与神同在，道就是神。]]（约翰福音 1:1）',

   starts:['我选的是','他的回答是（引一句原文），','我赞成（或不赞成），因为'],
   ev:[['《论语》','己所不欲，勿施于人。'],['《孟子》','民为贵，社稷次之，君为轻。'],['《墨子·兼爱》','视人之国若视其国，视人之家若视其家。'],['《道德经》','小国寡民……民至老死不相往来。'],['《韩非子·五蠹》','以法为教……以吏为师。'],['《论语·子罕》','吾未见好德如好色者也。']],

   text:'丞相绾等言：“诸侯初破，燕、齐、荆地远，[[不为置王，毋以填之。]]请立诸子，唯上幸许。”……廷尉李斯议曰：“周文武所封子弟同姓甚众，然后属疏远，[[相攻击如仇雠，]]诸侯更相诛伐，周天子弗能禁止。今海内赖陛下神灵一统，皆为郡县……则安宁之术也。置诸侯不便。”始皇曰：“[[天下共苦战斗不休，以有侯王。]]”',
   plain:'丞相王绾等人说：“诸侯刚被打败，燕、齐、楚这些地方很远，不在那里立王，就镇不住。请立皇子们为王，希望皇上允许。”……廷尉李斯说：“周文王、周武王分封的子弟同姓很多，可是后代越来越疏远，互相攻打像仇人一样，诸侯之间你杀我伐，周天子也禁止不了。现在天下靠陛下统一了，都设为郡县……这才是安宁的办法。设诸侯不好。”秦始皇说：“天下人都苦于打仗打个不停，就是因为有诸侯王。”',

  {kind:'cls',tag:'古籍',book:'史记',bg:'shiji',origin:'八年以后，又有博士主张分封。丞相李斯上书，提出了焚书的办法，秦始皇批了一个字：“可。”',

 essay:{q:'二选一。甲：用两条材料，写一段话评价秦始皇——功和过都要摆出来。乙：假如你是扶苏，给秦始皇写一封劝谏的信，至少引用一条史料。',
   starts:['我选的是（甲或乙）：','我用的材料是','所以我认为（写信的话：所以请父皇）'],
   ev:[['杜牧《阿房宫赋》','六王毕，四海一。'],['《史记·秦始皇本纪》','分天下以为三十六郡。'],['秦权诏书','法度量则不壹歉疑者，皆明壹之。'],['《史记·秦始皇本纪》','非博士官所职，天下敢有藏《诗》《书》、百家语者，悉诣守、尉杂烧之。'],['《史记·陈涉世家》','王侯将相宁有种乎！'],['贾谊《过秦论》','仁义不施而攻守之势异也。']],
   summary:'选甲：功和过各至少一条材料，最后的看法可以偏向一边，但要说清为什么。选乙：用扶苏的身份和口吻，引的材料要是扶苏当时能知道的事（比如焚书、咸阳的四百多人），不能引后来贾谊的话。',
   peers:['我选的是甲。我认为秦始皇的功在于统一了文字和度量衡，诏书上写着“皆明壹之”，从那以后各地的人能读懂同样的字。可是他的过也很明显，焚书让许多书没有留下来。所以我对他的看法是：他做的事影响了两千年，可是当时的百姓付出了太大的代价。','我选的是乙。父皇：天下刚刚统一，六国的百姓还没有归心。焚书令下，民间的《诗》《书》都要交官府烧掉；咸阳又活埋了四百多个读书人。这些读书人“皆诵法孔子”，用重法处置他们，儿臣恐怕天下不安。请父皇放宽法令，让百姓歇一歇。','我认为秦始皇的功在于结束了五百多年的战乱，“六王毕，四海一”。可是他的过也很明显，陈胜说“王侯将相宁有种乎”，说明百姓已经活不下去了。所以我对他的看法是：会打天下，不会守天下，正像贾谊说的那样。'],
   read:[['想读原书','《史记·秦始皇本纪》《李斯列传》《陈涉世家》，有白话对照本。'],['想读一篇短文','贾谊《过秦论》上篇，中学语文课本里也有。'],['想看考古','兵马俑、里耶秦简、睡虎地秦简，都有很好的图录和纪录片。']],
   more:'秦朝只有十五年，可它留下的皇帝、郡县和文字留了两千年。你怎么看这种“短命而长远”？'},

   text:'于是项王乃欲东渡乌江。乌江{亭长|秦汉时管一亭治安的小吏。}{檥船|把船停靠在岸边。}待，谓项王曰：“[[江东虽小，地方千里，众数十万人，亦足王也。]]愿大王急渡。”项王笑曰：“天之亡我，我何渡为！[[且籍与江东子弟八千人渡江而西，今无一人还，]][[纵江东父兄怜而王我，我何面目见之？]]纵彼不言，籍独不愧于心乎？”',

   text:'高祖曰：“公知其一，未知其二。夫运筹策帷帐之中，决胜于千里之外，[[吾不如子房。]]镇国家，抚百姓，给馈饷，不绝粮道，[[吾不如萧何。]]连百万之军，战必胜，攻必取，[[吾不如韩信。]]此三者，皆人杰也，[[吾能用之，此吾所以取天下也。]]项羽有一范增而不能用，此其所以为我擒也。”',
   plain:'汉高祖说：“你们只知其一，不知其二。在营帐里出谋划策，在千里之外决定胜负，我不如张良。镇守国家，安抚百姓，供应军粮，保证粮道不断，我不如萧何。统率百万大军，打仗一定胜，攻城一定取，我不如韩信。这三位都是人中的豪杰，我能用他们，这就是我能取得天下的原因。项羽只有一个范增却不能用，这就是他被我打败的原因。”',
   act:{type:'pick',q:'刘邦说自己取得天下的原因是哪一句？点出来。',a:3,ok:'“吾能用之，此吾所以取天下也。”前面三句都是“吾不如”。',hint:'不是“吾不如”的那一句。'}},

 read:[

   plain:'现在法律有三种肉刑，可坏事还是不断，错在哪里？难道不是因为我的德行浅薄、教化不明吗！我很惭愧。……刑罚到了砍断肢体、刻伤皮肉、终身不能恢复的地步，是多么痛苦而不合德行啊！这哪里像百姓父母的心意呢！把肉刑废除吧。',

  {kind:'cls',tag:'古籍',book:'史记',bg:'shiji',origin:'《史记·孝文本纪》：文帝废除“诽谤妖言之罪”的诏书。',
   text:'古之治天下，朝有进善之旌，{诽谤之木|让人写下批评意见的木柱。}，所以通治道而来谏者。今法有诽谤妖言之罪，[[是使众臣不敢尽情，]][[而上无由闻过失也。]]将何以来远方之贤良？[[其除之。]]',
   plain:'古代治理天下，朝廷设有进献善言的旗子、写批评意见的木柱，用来打通治国之道、招来进谏的人。现在法律有诽谤妖言之罪，这就使大臣们不敢把心里话说尽，皇帝也就没有办法听到自己的过失了。这样怎么能招来远方的贤良之士？把这条罪废除吧。',

<script>// 课程页面引擎（体例说明版）：七屏、逐项解锁、答案锁定、本机保存
