:root{--grain:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.42%20%200%200%200%200%20.32%20%200%200%200%200%20.2%20%200%200%200%20.06%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E");color-scheme:light;--paper:#F5F1E8;--ink:#2B2A28;--zhu:#B5452F;--lu:#3F6B5C;--jin:#C9A24A;--gray:#8A8378;--line:#D9D1C1;--card:#FFFDF8;--dark:#22201D;--ivory:#EDE6D6;--era:#2F4858;
 --serif:"Noto Serif SC","Noto Serif CJK SC",serif;--sans:"Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;--kai:"LXGW WenKai Lite","LXGW WenKai","Kaiti SC",STKaiti,KaiTi,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;font-weight:400}
body::before{content:"";position:fixed;inset:0;background-image:var(--grain);pointer-events:none;z-index:0;opacity:.9}
button{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 20px 120px}
/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.top a,.tlink{color:var(--ink);text-decoration:none;font-size:15px;background:none;border:0;padding:4px 0;cursor:pointer}
.top a:hover,.tlink:hover{text-decoration:underline;text-underline-offset:4px}
.top .ln{color:var(--gray);font-size:15px;margin-left:14px}
.top .r{display:flex;gap:22px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:36px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 30px rgba(60,45,25,.14);min-width:170px;z-index:20;padding:6px 0}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 18px;cursor:pointer;font-size:15px}
.menu button:hover{background:#F2ECDF}
/* 进度条 */
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:6px 0 4px}
.prog .st{font-size:13px;color:var(--gray);line-height:1.3}
.prog .st i{display:block;height:4px;background:#E2DBCC;margin-bottom:6px}
.prog .st.done i{background:var(--lu)}.prog .st.cur i{background:var(--jin)}
.prog .st.cur{color:var(--ink)}
.prog .st small{display:block;color:var(--gray);font-size:12px}
/* 屏 */
main{position:relative}
.screen{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.label{font-size:13px;letter-spacing:.2em;color:var(--gray);margin:40px 0 6px}
h1,h2{font-family:var(--serif);font-weight:900;letter-spacing:.04em;line-height:1.35;margin:0 0 14px}
h1{font-size:44px}h2{font-size:32px}
.do{font-size:17px;margin:0 0 22px}
.lead{color:var(--gray);font-size:15px;margin:-6px 0 18px}
.small{font-size:13px;color:var(--gray);font-weight:300;line-height:1.6}
/* 图片与说明牌 */
figure{margin:0}
.ph{box-shadow:0 14px 34px rgba(60,45,25,.18),0 2px 6px rgba(60,45,25,.12);background:#e9e2d2;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.85) sepia(.08)}
figcaption{font-size:13px;color:var(--gray);font-weight:300;margin-top:10px;line-height:1.55}
/* 封面 */
.cover{display:grid;grid-template-columns:1fr 1.1fr;gap:44px;align-items:center;min-height:62vh;padding-top:30px}
.cover .ph{aspect-ratio:3/4}
.cover .num{font-size:14px;letter-spacing:.3em;color:var(--era)}
.cover h1{font-size:30px;margin:6px 0 30px;color:var(--era)}
.cover .q{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1.4;margin:0 0 26px}
.guess{display:grid;gap:10px}
.guess .hint{font-size:14px;color:var(--gray)}
/* 选项卡片（可以点的东西才用白卡） */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:13px 18px;cursor:pointer;transition:opacity .4s,border-color .2s,background .2s;font-size:16px;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#fff}
.opt.dim{opacity:.32}
.opt.ok{border-color:var(--lu);background:#F1F5F1}
.opt.no{border-color:var(--zhu)}
.opt:disabled{cursor:default}
.opts{display:grid;gap:10px;margin:0 0 16px}
/* 反馈小卡片 */
.fb{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);padding:14px 16px;margin:6px 0 0}
.fb .fi{flex:0 0 120px;height:90px}
.fb p{margin:0}
.fb.good{border-left:3px solid var(--lu)}.fb.try{border-left:3px solid var(--jin)}
.fb .ans{color:var(--gray);font-size:14px;margin-top:6px}
/* 逐题 */
.qcount{font-size:13px;color:var(--gray);margin-bottom:10px}
.qstem{font-size:20px;font-weight:500;margin:0 0 16px;line-height:1.6}
/* 拖动 */
.pool{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;min-height:50px}
.chip{background:var(--card);border:1px solid var(--line);padding:9px 14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:15px;line-height:1.55;max-width:100%}
.chip.dragging{box-shadow:0 12px 24px rgba(60,45,25,.22);cursor:grabbing;position:relative;z-index:50;pointer-events:none;border-color:var(--ink);transition:none}
.chip.picked{border-color:var(--ink)}
.chip.placed{cursor:default;background:#F1F5F1;border-color:var(--lu)}
.chip .src{display:block;font-size:12px;color:var(--gray)}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px}
.bin{border-top:2px solid var(--ink);padding:10px 0 6px;min-height:140px;transition:background .2s}
.bin.over{background:rgba(201,162,74,.10)}
.bin h3{font-family:var(--serif);font-weight:900;font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.bin .in{display:grid;gap:8px}
.bin svg{flex:0 0 auto}
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);padding:4px 0}
.slot b{font-family:var(--serif);color:var(--gray);width:24px}
.pop{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:15px}
.pop .ph{flex:0 0 96px;height:72px}
.summary{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.6;border-top:1px solid var(--line);padding-top:18px;margin-top:26px}
/* 视频 */
.vid{position:relative;background:#1d1b19;aspect-ratio:16/9;box-shadow:0 18px 40px rgba(60,45,25,.2);overflow:hidden}
.vid video{width:100%;height:100%;display:block;background:#1d1b19}
.vid .play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:0;background:rgba(245,241,232,.92);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.vid .play svg{margin-left:6px}
.vid.playing .play{opacity:0;pointer-events:none}
.vid .bar{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(transparent,rgba(0,0,0,.35));opacity:0;transition:opacity .3s}
.vid:hover .bar,.vid.paused .bar{opacity:1}
.vid .line{flex:1;height:3px;background:rgba(255,255,255,.3);position:relative;cursor:default}
.vid .line.seek{cursor:pointer}
.vid .line i{position:absolute;left:0;top:0;bottom:0;background:var(--ivory)}
.vid .ic{background:none;border:0;color:var(--ivory);cursor:pointer;padding:4px;display:flex}
.vid .qz{position:absolute;inset:0;background:rgba(34,32,29,.86);display:flex;align-items:center;justify-content:center;padding:24px}
.vid .qz .box{background:var(--paper);max-width:640px;width:100%;padding:24px 26px}
.vid .qz .k{font-size:12px;letter-spacing:.2em;color:var(--gray)}
.vlabel{font-size:13px;color:var(--gray);margin:12px 0 0}
.later{margin-top:22px}
.later>button{background:none;border:0;padding:0;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:4px}
.later>button:disabled{color:var(--gray);text-decoration:none;cursor:default}
.later ul{margin:12px 0 0;padding-left:1.2em}
.later li{margin:6px 0}
/* 层级展开 */
.tier{background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.tier>button{width:100%;text-align:left;background:none;border:0;padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:18px;font-family:var(--serif);font-weight:700}
.tier>button .n{color:var(--jin);font-size:22px}
.tier>button .mk{margin-left:auto;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--gray)}
.tier.open>button .mk{color:var(--lu)}
.tier .body{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:0 18px 18px}
.tier .body .ph{height:150px}
/* 引文版式 */
.scr{background:var(--dark);color:var(--ivory);padding:34px 36px 26px;margin:0 0 10px;position:relative}
.scr::before{content:"";display:block;width:72px;height:1px;background:var(--jin);margin:0 auto 24px}
.scr .t{font-family:var(--kai);font-size:22px;line-height:2;letter-spacing:.04em}
.scr .rf{text-align:center;font-size:13px;color:#A79E8C;letter-spacing:.2em;margin-top:16px}
.cls{position:relative;padding:28px 36px 30px 110px;margin:0 0 10px;overflow:hidden;min-height:260px}
.cls .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.10;filter:grayscale(.3) sepia(.3)}
.cls .t{position:relative;font-family:var(--kai);font-size:30px;line-height:1.9;letter-spacing:.14em;writing-mode:vertical-rl;height:300px;margin-left:auto}
.cls .seal{position:absolute;left:30px;bottom:28px;width:44px;background:var(--zhu);color:var(--paper);font-family:var(--kai);font-size:17px;line-height:1.2;text-align:center;padding:6px 0;border-radius:2px}
.sch{border-left:2px solid var(--gray);padding:4px 0 4px 20px;margin:0 0 10px}
.sch .t{font-size:17px}
.sch .rf{font-size:13px;color:var(--gray);margin-top:8px}
.qtag{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--gray);margin-bottom:6px}
.origin{font-size:14px;color:var(--gray);margin:0 0 10px}
.nt{border-bottom:1px dotted currentColor;cursor:pointer}
.nt.flash{animation:flash 1.4s ease 2}
@keyframes flash{50%{background:rgba(201,162,74,.35)}}
.tip{position:absolute;z-index:30;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 24px rgba(60,45,25,.18);padding:10px 14px;font-family:var(--sans);font-size:14px;line-height:1.6;max-width:280px;writing-mode:horizontal-tb;letter-spacing:0}
.pk{cursor:pointer;border-radius:2px;transition:background .2s}
.pickon .pk:hover{background:rgba(201,162,74,.25)}
.pk.hit{background:rgba(63,107,92,.28)}
.pk.miss{background:rgba(181,69,47,.18)}
.fold>button{background:none;border:0;padding:0;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:4px;color:var(--ink)}
.fold .tx{font-size:15px;margin-top:8px}
.act{margin:14px 0 6px}
.mat{margin-bottom:34px}
/* 书写 */
.bigq{min-height:42vh;display:flex;flex-direction:column;justify-content:center}
.bigq h1{font-size:46px}
.wbox{margin:0 0 18px}
.wbox label{display:block;font-family:var(--kai);font-size:19px;margin-bottom:6px}
textarea{width:100%;min-height:96px;font:inherit;font-size:16px;line-height:1.7;background:var(--card);border:1px solid var(--line);padding:12px 14px;resize:vertical;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--ink)}
textarea:disabled{background:transparent;color:var(--ink)}
.ev{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 22px;font-size:14px}
.ev span{color:var(--gray)}
.ul{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-size:inherit}
.peer{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.after h3{font-family:var(--serif);font-weight:900;font-size:20px;margin:30px 0 10px}
/* 收束 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 0 26px}
.pair>div{border-top:2px solid var(--ink);padding-top:10px}
.pair .k{font-size:13px;color:var(--gray)}
.pair p{margin:6px 0 0;font-size:17px}
.three{counter-reset:k;margin:0 0 26px;padding:0;list-style:none}
.three li{counter-increment:k;font-family:var(--serif);font-weight:700;font-size:21px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:16px}
.three li::before{content:counter(k,cjk-ideographic);color:var(--zhu)}
.award{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center;margin:0 0 26px}
.award .ph{height:220px}
.nextq{background:var(--card);border:1px solid var(--line);padding:18px 22px}
.nextq .k{font-size:13px;color:var(--gray);letter-spacing:.15em}
.nextq p{font-family:var(--serif);font-weight:700;font-size:22px;margin:6px 0 0}
/* 底部导航 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(245,241,232,.94);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.nav .in{max-width:980px;margin:0 auto;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:18px}
.nav .why{flex:1;text-align:right;font-size:14px;color:var(--gray)}
.primary{background:var(--ink);color:var(--paper);border:0;padding:11px 26px;cursor:pointer;font-size:16px}
.primary:disabled{background:#C9C2B4;cursor:not-allowed}
.back{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-size:15px}
.back:disabled{color:#C9C2B4;text-decoration:none;cursor:default}
/* 侧栏 */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(34,32,29,.35);display:flex;justify-content:flex-end}
.drawer .pn{background:var(--paper);width:min(620px,100%);height:100%;overflow:auto;padding:26px 28px 60px;box-shadow:-20px 0 40px rgba(0,0,0,.15)}
.drawer .x{float:right;background:none;border:0;font-size:15px;cursor:pointer;text-decoration:underline}
.lib-it{border-top:1px solid var(--line);padding:16px 0}
.lib-it h4{font-size:17px;font-weight:500;margin:0}
.lib-it .src{font-size:13px;color:var(--gray);margin:2px 0 8px}
.lib-it .why{font-size:14px;color:var(--gray);margin-top:8px}
.lib-it .q{font-family:var(--kai);font-size:17px;line-height:1.9}
.lock{color:var(--gray);font-size:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.gal .ph{height:150px}
textarea.ask{min-height:110px}
@media (max-width:720px){
 h1{font-size:32px}h2{font-size:26px}.cover{grid-template-columns:1fr;gap:24px}.cover .q{font-size:30px}.cover .ph{aspect-ratio:4/3}
 .bins{grid-template-columns:1fr}.tier .body{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.award{grid-template-columns:1fr}
 .bigq h1{font-size:34px}.cls{padding-left:80px}.cls .t{font-size:24px}.prog .st{font-size:11px}.prog .st small{display:none}
 .top .ln{display:none}
}
/* 排序 */
.sort{display:grid;grid-template-columns:28px 1fr;gap:0 12px;margin:0 0 6px;max-width:560px}
.snum div{height:54px;display:flex;align-items:center;font-family:var(--serif);font-weight:700;color:var(--gray);font-size:17px}
.slist{display:grid;gap:8px;user-select:none;-webkit-user-select:none}
.srow{height:46px;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);padding:0 16px;cursor:grab;touch-action:none;transition:transform .18s ease,box-shadow .18s,border-color .18s;font-size:16px}
.srow:hover{border-color:#B9B0A0}
.slist.active .srow{cursor:grabbing}
.srow.lifted{transition:box-shadow .18s,border-color .18s;box-shadow:0 12px 26px rgba(60,45,25,.18);border-color:var(--ink);position:relative;z-index:2}
.srow.fixed{cursor:default;background:#F1F5F1;border-color:var(--lu)}
.grip{display:grid;grid-template-columns:repeat(2,3px);gap:3px;flex:0 0 auto}
.grip i{width:3px;height:3px;border-radius:50%;background:#B9B0A0}
.srow:hover .grip i,.srow.lifted .grip i{background:var(--ink)}
/* 注释 */
.nt.on{background:rgba(201,162,74,.28)}
.tip{position:absolute;z-index:30;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 24px rgba(60,45,25,.16);padding:10px 14px;font-size:14px;line-height:1.65;max-width:300px;letter-spacing:0;writing-mode:horizontal-tb}
.tip b{font-family:var(--kai);font-weight:400;font-size:17px;margin-right:8px;color:var(--zhu)}
.tip::before{content:"";position:absolute;top:-6px;left:calc(var(--ax,20px) - 6px);width:10px;height:10px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.tip.v{writing-mode:vertical-rl;max-width:none;max-height:260px;padding:14px 10px;font-family:var(--kai);font-size:16px;line-height:1.7;letter-spacing:.06em}
.tip.v b{margin:0 0 8px;font-size:19px}
.tip.v::before{top:calc(var(--ay,20px) - 6px);left:auto;right:-6px;border-left:0;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.cls .t{position:relative}
a.primary{display:inline-block;text-decoration:none}
.teach{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;background:#EDE5D3;border-left:3px solid var(--jin);padding:9px 14px;font-size:14px;margin:4px 0 10px}
.teach span{flex:1;min-width:240px;color:var(--ink)}
.recpre{white-space:pre-wrap;font-family:var(--sans);font-size:13px;line-height:1.7;background:var(--card);border:1px solid var(--line);padding:12px 14px;max-height:320px;overflow:auto}
.rub{border-collapse:collapse;font-size:14px;width:100%}
.rub th,.rub td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.rub th{font-weight:500;color:var(--gray)}
.keys{padding-left:1.2em;font-size:14px}.keys li{margin:4px 0}
.drawer h3{font-family:var(--serif);font-weight:900;font-size:18px;margin:24px 0 10px}
[hidden]{display:none!important}
/* 时间轴：按真实年数画，横向；窄屏时左右滑动 */
.tl-scroll{overflow-x:auto;margin:6px 0 10px;padding-bottom:6px}
.tl{position:relative;height:200px;min-width:760px;margin:0 70px}
.tl-line{position:absolute;left:-30px;right:-40px;top:102px;height:2px;background:var(--ink)}
.tl-line::after{content:"";position:absolute;right:-2px;top:-5px;border-left:10px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
.tl-tk{position:absolute;top:98px;width:1px;height:6px;background:#9C9381;margin-left:-.5px}
.tl-tk.mj{top:94px;height:14px;background:var(--ink);width:1.5px}
.tl-tl{position:absolute;top:112px;transform:translateX(-50%);font-size:12px;color:var(--gray);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-slot{position:absolute;left:var(--p);top:0;width:128px;margin-left:-64px;display:flex;flex-direction:column;align-items:center}
.tl-hold{height:92px;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;border-radius:2px;transition:background .2s}
.tl-slot.over .tl-hold{background:rgba(201,162,74,.16)}
.tl-hold .chip{font-size:14px;padding:6px 10px;text-align:center}
.tl-dot{width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);margin-top:-1.5px;position:relative;z-index:1;transition:background .2s,border-color .2s}
.tl-slot.on .tl-dot{background:var(--lu);border-color:var(--lu)}
.tl-y{font-size:14px;font-weight:500;color:var(--ink);margin-top:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 高低两层错开：卡片在轴上方、年代与说明在轴下方，相邻两件事一高一低，不会重叠 */
.tl{height:330px}
.tl-slot{width:156px;margin-left:-78px}
.tl-slot.hi .tl-hold{align-items:flex-start;padding:0;position:relative}
.tl-slot.hi .tl-hold::after{content:"";position:absolute;left:50%;top:38px;bottom:0;width:1px;background:#B9B0A0}
.tl-under{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:24px;width:100%}
.tl-slot.hi .tl-under{padding-top:104px}
.tl-slot.hi .tl-under::before{content:"";position:absolute;left:50%;top:6px;height:94px;width:1px;background:#D6CDBB}
.tl-y{margin-top:0}
.tl-cn{font-size:13px;color:var(--ink);line-height:1.55;text-align:center;margin-top:4px;max-width:156px;background:var(--paper);animation:rise .5s ease both}
/* 翻页：上一屏、下一屏同一种样式 */
.nav .in{gap:16px}
.nav .pg{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 18px;border:1px solid #CFC6B4;background:transparent;color:var(--ink);font-size:15px;letter-spacing:.08em;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.nav .pg .ar{font-family:var(--serif);font-size:15px;line-height:1;transition:transform .2s}
.nav .pg:hover:not(:disabled){border-color:var(--ink);background:rgba(43,42,40,.04)}
.nav .pg.fw{border-color:var(--ink)}
.nav .pg.fw:hover:not(:disabled) .ar{transform:translateX(3px)}
.nav .pg.bk:hover:not(:disabled) .ar{transform:translateX(-3px)}
.nav .pg:disabled{color:#B9B0A0;border-color:#DDD5C6;cursor:not-allowed}
.nav .pg.fw.ready{background:var(--lu);border-color:var(--lu);color:var(--paper)}
.nav .pg.fw.ready:hover{background:#355c4f}
.qdone{padding:22px 0 26px;border-bottom:1px solid var(--line)}
.qdone:first-child{padding-top:0}
.qdone:last-child{border-bottom:0}
/* 史料库：故事卡 */
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);padding:10px;cursor:pointer;font:inherit;color:inherit;transition:border-color .2s}
.card:hover:not(:disabled){border-color:var(--ink)}
.card .ph{height:84px;box-shadow:none}
.card .cq{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.5;margin-bottom:4px}
.card.shut{opacity:.55;cursor:default}
.card.shut .ph img{filter:grayscale(1) brightness(1.1)}
.st{font-size:16px;line-height:1.9;margin:14px 0}
.clsh{background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:18px 0}
.clsh .t,.sch .t{font-family:var(--kai);font-size:19px;line-height:1.9}
.clsh .rf,.sch .rf{font-size:13px;color:var(--gray);margin-top:6px}
.clsh .t{color:var(--ink)}
.tie{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.7;border-top:2px solid var(--ink);padding-top:14px;margin-top:22px}
.think{margin-top:20px;background:var(--card);border:1px solid var(--line);padding:12px 16px}.think p{margin:4px 0 0;font-size:15.5px}

.vid .vload{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);font-size:13px;color:#EDE6D6;background:rgba(20,20,20,.55);padding:4px 12px;border-radius:12px;pointer-events:none;letter-spacing:.05em}

.vgo{display:block;margin:14px auto 0;padding:10px 22px;border:1px solid var(--lu);background:var(--lu);color:#F5F1E8;font:inherit;font-size:15px;letter-spacing:.06em;border-radius:22px;cursor:pointer}
.vgo:hover{filter:brightness(1.08)}
/* 课程目录 */
body.cat .wrap{padding-top:28px}
.cat-hd{padding:40px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
.cat-k{font-size:13px;letter-spacing:.24em;color:var(--gray)}.cat-t{color:var(--zhu)}
.cat-hd h1{margin:10px 0 14px}
.cat-p{color:var(--gray);font-size:15px;max-width:640px;margin:0}
.cat-list{display:grid;gap:26px}
.cat-c{display:grid;grid-template-columns:260px 1fr;gap:34px;align-items:center;text-decoration:none;color:inherit;padding:22px;background:var(--card);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
a.cat-c:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(60,45,25,.12)}
.cat-c .ph{aspect-ratio:4/3}
.cat-n{font-size:13px;letter-spacing:.3em;color:var(--era)}
.cat-c h2{margin:4px 0 10px;color:var(--era)}
.cat-q{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.55;margin:0 0 18px}
.cat-s{display:inline-flex;align-items:center;gap:8px;font-size:15px;padding:8px 18px;border:1px solid var(--ink);border-radius:22px}
.cat-s.go{background:var(--lu);border-color:var(--lu);color:#F5F1E8}.cat-s.fin{color:var(--lu);border-color:var(--lu)}
.cat-s .ar{transition:transform .2s}a.cat-c:hover .cat-s .ar{transform:translateX(3px)}
.cat-c.soon{opacity:.55}.cat-c.soon .ph{background:#E6DFD0;box-shadow:none}.cat-c.soon .cat-s{border-style:dashed;color:var(--gray);border-color:var(--gray)}.cat-c.soon h2,.cat-c.soon .cat-n{color:var(--gray)}
@media (max-width:700px){.cat-c{grid-template-columns:1fr;gap:16px;padding:16px}.cat-q{font-size:18px}}

.cls .t{max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.cls.long .t{font-size:26px;height:540px}
@media (max-width:700px){.cls.long .t{font-size:22px;height:440px}}

.nav .pg.fw.locked{color:#B9B0A0;border-color:#DDD5C6;cursor:pointer}
.nav .pg.fw.locked:hover .ar{transform:none}
.nav .why.flash{animation:whyf 1.6s ease}
@keyframes whyf{0%,60%{color:var(--zhu);font-weight:500}100%{color:var(--gray)}}
.lang{margin-left:16px;font-size:13px!important;border:1px solid var(--line)!important;border-radius:12px;padding:2px 10px!important;color:var(--gray)!important}.lang-c{color:inherit}
.cat-tch{margin:-6px 0 26px;font-size:13px;color:var(--gray)}.cat-tch .ul{font-size:13px;color:var(--gray)}.cat-tch div{margin-top:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.cat-tch input{font:inherit;padding:8px 10px;border:1px solid var(--line);background:var(--card);width:180px}
/* 小游戏：穿越展柜、考古探方 */
.game{margin-top:8px}
.gcnt{font-size:14px;color:var(--gray);letter-spacing:.06em;margin:4px 0 12px}
.case{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;background:#2E2A25;padding:18px;border-radius:2px;box-shadow:inset 0 0 0 1px #4a443c,inset 0 18px 40px rgba(0,0,0,.35)}
.exh{position:relative;display:flex;flex-direction:column;background:var(--card);border:0;padding:8px 8px 10px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s,opacity .3s}
.exh:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.35)}

 v1:{src:'l1v1en.mp4',player:'l1v1pen.html',poster:'l1v1en.jpg',label:'Video 1 · Where Is History Going? · 5:36',
   quiz:[{at:128.9,q:'Mencius’s “order, then chaos,” Zou Yan’s five elements, and the opening of Romance of the Three Kingdoms: which answer do they give?',opts:['The wheel','The staircase','The line'],a:0,ok:'All three say that history turns around and comes back to where it started.',hint:'Do they talk about “coming back” or about “going higher”?'},
         {at:211.8,q:'“Better technology does not mean better people.” This sentence questions which answer?',opts:['The wheel','The staircase','The line'],a:1,ok:'The staircase says things keep getting better. The two world wars of the twentieth century make that hard to believe.',hint:'Which answer says things keep getting better?'},
         {bq:1,q:'Zou Yan explained the turning of dynasties by the “five powers.” What are the five?',opts:['Spring, summer, autumn, winter, year','Metal, wood, water, fire, earth','Kindness, justice, ritual, wisdom, trust'],a:1,ok:'The five powers are the five elements: metal, wood, water, fire and earth. Each dynasty matched one of them, and the five took turns.',hint:'They are the same as the “five elements.”'},
         {q:'The “staircase” view of history became popular after what?',opts:['The internet, about thirty years ago','The Enlightenment, about three hundred years ago','The Shang dynasty, about three thousand years ago'],a:1,ok:'The Enlightenment was in 17th- and 18th-century Europe. People trusted that reason and progress would make the world better and better.',hint:'The video says “about three hundred years ago.”'},
         {q:'In the Bible’s “line,” what is at the center of history?',opts:['Christ','The Enlightenment','The Roman Empire'],a:0,ok:'The beginning is creation, the center is Christ, and the end is Christ’s return.',hint:'The beginning is creation; the end is Christ’s return. What is the center?'}],
   points:['“History” has two meanings: what really happened in the past, and what people wrote about the past. We can only reach the first through the second.','The wheel: history turns around and comes back to where it started. Mencius, Zou Yan, and Romance of the Three Kingdoms all saw it this way.','The staircase: each step is higher than the one before. This view became popular after the Enlightenment, about three hundred years ago.','The line: history has a beginning, a center, and an end. The beginning is creation, the center is Christ, and the end is Christ’s return.','On this line, God rules over history, and people are responsible.']},
 task1:{q:'Which answer does each saying give? Drag each one under its picture.',
   bins:['The wheel','The staircase','The line'],
   why:['The wheel says history turns around and comes back.','The staircase says things keep getting better, by human effort.','The line says history has a beginning and an end, and God sets the direction.'],
   cards:[{t:'“The world has existed for a long time: order, then chaos.”',src:'Mencius',b:0,img:'mengzi',say:'Mencius lived in the Warring States period, when China was in chaos. He believed order would come again.'},
          {t:'“The empire, long divided, must unite; long united, must divide.”',src:'Romance of the Three Kingdoms',b:0,img:'sanguo',say:'These are the novel’s opening words, written more than a thousand years after the Three Kingdoms.'},
          {t:'“By human reason, people will grow wiser and society will grow better.”',src:'A belief of the Enlightenment',b:1,img:'encyc',say:'The Encyclopédie tried to collect all human knowledge in one work. People then were very confident about progress.'},
          {t:'“Human society climbs up, one stage after another.”',src:'The five-stage theory',b:1,img:'steam',say:'The steam locomotive let people see a huge leap in technology. Progress seemed visible.'},
          {t:'“In the beginning, God created the heavens and the earth.”',src:'Genesis 1:1',b:2,img:'hubble',say:'This line has a starting point. History did not start by itself.'},
          {t:'“When the fullness of time had come, God sent forth his Son.”',src:'Galatians 4:4',b:2,img:'p46',say:'This papyrus is a copy of Paul’s letters, made only about a hundred and fifty years after Paul.'}],
   summary:'All three answers see repetition and change in history. They truly disagree in only one place: does history have an end, and who decides it?'},
 v2:{src:'l1v2en.mp4',player:'l1v2pen.html',poster:'l1v2en.jpg',label:'Video 2 · Chinese History in God’s Hands · 6:05',
   quiz:[{at:79.4,q:'What do the words of Daniel, Amos, and Paul show when we put them together?',opts:['God cares only about the nation of Israel','The rise and fall, the movements, and the borders of all nations are in God’s hands','History has no direction'],a:1,ok:'Daniel spoke in Babylon, Amos spoke to Israel, and Paul spoke to Greeks. They said the same thing.',hint:'Were the Babylonians, the Philistines, the Syrians, and the Athenians all Israelites?'},
         {at:140.3,q:'The Bible tells clearly about David’s sins. What does this remind us about reading Chinese history?',opts:['Write only the good, so students don’t learn bad things','Look at both the good and the bad','People in the past were all bad'],a:1,ok:'People bear God’s image, and all people sin. So when we write about people, we write about both their good and their bad.',hint:'How does the Bible itself write about David?'},
         {bq:1,q:'What was David in ancient Israel?',opts:['A priest','A king','A fisherman'],a:1,ok:'David was king of Israel. The Bible records what he did well, and it records his sin just as plainly.',hint:'Whom did the prophet Nathan go to rebuke?'},
         {q:'Of the Shang, Zhou, Qin and Han, which came first?',opts:['Shang','Qin','Zhou'],a:0,ok:'The order is Shang, Zhou, Qin, Han. This year’s course follows that order.',hint:'The oracle bones come from this dynasty.'},
         {q:'Paul spoke at the Areopagus. Which city is it in?',opts:['Jerusalem','Rome','Athens'],a:2,ok:'The Areopagus is in Athens, Greece. Paul spoke there to Greeks who had never read the Bible.',hint:'His listeners were Greeks.'}],
   points:['God’s hand holds all nations: Shang, Zhou, Qin, Han. Not one dynasty is outside God’s hand.','In God’s hand are kings, and also ordinary people whose names we don’t know. When we read history, we ask whose voice is missing.','Everyone in God’s hand sins, and everyone also receives good things from God.','God’s hand is leading history to the day of judgment. The judge of the world is Jesus, who rose from the dead.','God has not told us the reason for every event. Don’t quickly say, “This is God punishing so-and-so.”']},
 task2:{tiers:[
   {h:'How big is God’s hand?',img:'ishtar',ref:'Daniel 2:21',v:'He changes times and seasons; he removes kings and sets up kings.',s:'Daniel, who said this, was a young captive in Babylon. Even the king of Babylon, who took him captive, was in God’s hands.'},
   {h:'Who is in God’s hand?',img:'daolian',ref:'Genesis 1:27',v:'So God created man in his own image, in the image of God he created him; male and female he created them.',s:'History books mostly write about emperors and generals. The women preparing silk left no names, but God knows every one of them.'},
   {h:'Where is God’s hand taking history?',img:'areop',ref:'Acts 17:31',v:'He has fixed a day on which he will judge the world in righteousness by a man whom he has appointed.',s:'Paul said this on the Areopagus in Athens. History has an end, and the end is the day of judgment.'}],
   apply:[{t:'mcq',q:'A big earthquake hits a city. Someone says, “This must be God punishing the people there.” According to Luke 13, how would Jesus respond?',opts:['He would agree: disasters are punishments','He would say those people were not worse sinners than others, and unless you repent, you will likewise perish','He would say it has nothing to do with God'],a:1,
          ok:'Jesus did not announce God’s verdict on them. Instead, he turned the question back to the people who were talking.',hint:'Remember the tower in Siloam. Did Jesus say the eighteen people were worse than others?',img:'siloam'},
         {t:'mcq',q:'You read a passage in a history book. It only tells how the emperor fought wars and rewarded or punished his officials. What else should you ask as you read?',opts:['Did the emperor win?','Whose voice is missing from this record?','Did this emperor believe in God?'],a:1,
          ok:'Farmers, weavers, and men sent off to war are often left out of history books. They are in God’s hand too.',hint:'The video said that when we read history, we should not look only at emperors and generals. What should we also ask?',img:'yishe'}],
   summary:'God rules over history, but that does not mean we know the reason for every event. Our part is to write clearly what we can see, and to leave what we cannot see to God.'},
 read:[
  {kind:'scr',tag:'Scripture',origin:'The apostle Paul spoke these words on the Areopagus in Athens around AD 50. Luke recorded them in Acts. The listeners were Greeks who had never read the Bible.',ref:'Acts 17:24–27',
   text:'[[The God who made the world and everything in it, being Lord of heaven and earth,]] [[does not live in temples made by man,]] [[nor is he served by human hands, as though he needed anything,]] [[since he himself gives to all mankind life and breath and everything.]] [[And he made from {one man|Adam, the first ancestor of all people.} every {nation|every people group on earth.} of mankind to live on all the face of the earth,]] [[having determined {allotted periods|the times when a nation rises and flourishes.} and the {boundaries of their dwelling place|the lands where each people lives.},]] [[that they should seek God,]] [[and perhaps {feel their way toward|search for something in the dark.} him and find him.]] [[Yet he is actually not far from each one of us.]]',
   act:{type:'pick',q:'Tap the part of the passage that tells why God set the times and boundaries of the nations.',a:6,ok:'“That they should seek God.” The way Chinese people revered Heaven (天 tiān) and spoke of Shangdi (上帝, the Lord on High) can be read in the light of this sentence.',hint:'Look for the words that tell the purpose: “so that…”'}},
  {kind:'cls',tag:'Classical Chinese',book:'报任安书',bg:'shiji',origin:'Around 91 BC, Sima Qian wrote a letter to his friend Ren An (《报任安书》). He explained why he would bear any shame to finish the Shiji. Tap the underlined words to see what they mean.',
   text:'亦欲以[[{究|jiū: to search out, to understand fully}天人之{际|jì: the meeting point, the relationship}]]，[[{通|tōng: to see through, to understand}古今之变]]，[[成{一家之言|yì jiā zhī yán: a book with one’s own point of view}]]。',
   plain:'I also wanted, through this book, to understand the relationship between Heaven and humans, to understand the changes from ancient times to the present, and to write a book with my own point of view.',
   act:{type:'pick',q:'Which words mean “to understand the changes from ancient times to the present”? Tap them. (Hint: 古 gǔ = ancient, 今 jīn = now, 变 biàn = change.)',a:1,ok:'通古今之变 (tōng gǔ jīn zhī biàn). This is exactly the link between the two meanings of history: Sima Qian used his writing to reach the changes themselves.',hint:'Look for the place with the characters 古今.'}},
  {kind:'short',q:'Sima Qian wanted to “understand the relationship between Heaven and humans.” If Paul had read this sentence, how might he have answered? Write one sentence.',
   ref:'A possible answer: Paul might say that people cannot fully figure out the relationship between Heaven and humans by searching on their own. The God who made heaven and earth has spoken, and he is not far from each one of us; he wants people to seek him.'}

 essay:{q:'Why should Christians study Chinese history?',
   starts:['Because Chinese history is also in God’s hands,','When I read about people in history, I want to remember','So when I read Chinese history,'],
   ev:[['Acts 17:26','And he made from one man every nation of mankind to live on all the face of the earth, having determined allotted periods and the boundaries of their dwelling place.'],['Genesis 1:27','So God created man in his own image, in the image of God he created him; male and female he created them.'],['Romans 3:23','For all have sinned and fall short of the glory of God.'],['Matthew 5:45','For he makes his sun rise on the evil and on the good, and sends rain on the just and on the unjust.'],['Luke 13:4–5','Or those eighteen on whom the tower in Siloam fell and killed them: do you think that they were worse offenders than all the others who lived in Jerusalem? No, I tell you; but unless you repent, you will all likewise perish.']],
   summary:'We study Chinese history not to judge it from the outside, and not to treat it as sacred. It is one part of the history of the nations that God holds in his hand. In it we recognize God’s kindness and human sin, and in the end we learn both to give thanks and to repent.',
   peers:['Because Chinese history is also in God’s hands, the Shang and the Han were never outside his hand. When I read about people in history, I want to remember that they bear God’s image just like me, and that they sinned just like me. So when I read Chinese history, I will not only look at emperors, but also think about the people who left no names.','Because Chinese history is also in God’s hands, it has something to do with me; it is not just someone else’s story. When I read about people in history, I want to remember not to say quickly that someone was punished by God. So when I read Chinese history, I will be honest and look at both the good and the bad.'],
   read:[['The wheel · China and Israel','Mencius 2B:13: “Every five hundred years a true king must arise” (五百年必有王者兴 wǔ bǎi nián bì yǒu wáng zhě xīng). Ecclesiastes 1:9: “What has been is what will be… there is nothing new under the sun.” Both writers see history turning in circles. Compare: what hope does each one find, and where does he look for it?'],['The staircase · Europe and China','Condorcet, Sketch of the Progress of the Human Mind (France, 1795), says humanity will keep improving without limit. Kang Youwei (China, 1890s) taught the “Three Ages” (三世 sān shì): from an age of disorder, to an age of rising peace, to an age of Great Peace (太平 tàipíng). Compare: what drives progress for each writer, and what do both leave out?'],['The historian’s task · China and the Bible','Sima Qian, Letter to Ren An (about 91 BC): he wrote the Shiji “to understand the changes from ancient times to the present.” Luke 1:1–4: Luke wrote “an orderly account” after “having followed all things closely,” so that his reader could “have certainty.” Compare: why did each one write history, and whom was he writing for?']],
   more:'Romance of the Three Kingdoms says, “The empire, long divided, must unite; long united, must divide.” Do you agree? Give one example that supports it, or one that does not.'},
 close:{three:['God’s hand holds all nations. Chinese history is in God’s hands too.','In God’s hand are kings and ordinary people. When we read history, we look at both the good and the bad.','God’s hand is leading history to the day of judgment. We look with reverence, and we examine our own hearts.'],
   award:'shiji',awardSay:'A page from a Song edition of the Shiji. What Sima Qian wrote is people’s account of the past; through it, we reach toward the past itself.'},
 lib:[
  {scr:1,q:'How did “dragon bones” sold as medicine bring back a lost dynasty?',img:'oracle',
   story:['About 120 years ago, Chinese medicine shops in Beijing sold something called “dragon bones” (龙骨 lónggǔ). People said that if you ground them into powder, they could cure illness. Shop workers often scraped off the lines carved on the bones, because bones with writing on them did not sell as well.',
    'Around 1899, Wang Yirong, an official in Beijing who studied ancient inscriptions, noticed that these bones carried writing even older than the writing on bronze vessels. A popular story says he spotted it in medicine bought for his own illness. The story is charming, but it may not be true. What is certain is that he began buying the bones at high prices, more than a thousand pieces in one year.',
    'The next year, foreign armies marched into Beijing, and Wang Yirong took his own life rather than surrender. His collection passed to his friend Liu E, a novelist. In 1903, Liu E printed rubbings of more than a thousand pieces in a book called Tieyun Canggui. It was the first book of oracle bone writing (甲骨文 jiǎgǔwén).',
    'The medicine traders would never say where the bones came from. At last the scholar Luo Zhenyu tracked them down to the village of Xiaotun near Anyang, in Henan province. Under the fields there lay Yinxu, the capital of the late Shang dynasty, more than three thousand years old.',
    'In 1917, the scholar Wang Guowei picked out the names of Shang kings from the oracle bones, one by one, and put them in order. Then he compared his list with Sima Qian’s chapter on the Shang in the Shiji. The two matched closely; only a few kings needed to be moved. Sima Qian wrote that chapter a thousand years after the Shang, yet clearly he had reliable sources. Before this, many people thought the Shang was only a legend. From that day on, the Shang stepped out of the books and onto the ground.'],
   quote:{k:'Scholar',t:'We who live today are fortunate: besides the materials on paper, we also have new materials from under the ground.',src:'Wang Guowei, New Evidence on Ancient History, 1925'},
   tie:'Sima Qian’s account is the second meaning of history; what really happened in the Shang is the first. The “dragon bones” that were almost ground into medicine built a bridge between the two.',
   think:'The shop workers scraped the writing off the bones so they would sell better. What other things in history almost disappeared because nobody thought they mattered?'},
  {scr:2,q:'Why would three brothers die rather than change one sentence?',img:'slips',
   story:['In 548 BC, Cui Zhu, a powerful minister in the state of Qi, had his ruler, Duke Zhuang of Qi, killed over a personal quarrel. For a minister to kill his own ruler was one of the worst crimes of that time.',
    'The court historian of Qi picked up his brush and wrote five characters on a bamboo slip: 崔杼弑其君, “Cui Zhu murdered his ruler.” The word 弑 (shì) means a murder of a superior by someone below him. Cui Zhu was furious and killed the historian.',
    'By custom, the historian’s office passed to his family. The historian’s younger brother took up the bamboo slips and wrote the same five characters. Cui Zhu killed him too. A third brother wrote the same thing and was also killed. Then the fourth brother picked up the brush, and what he wrote was still “Cui Zhu murdered his ruler.” Cui Zhu, with a sword in his hand, looked at those five characters and finally let it go.',
    'The story does not end there. South of the capital lived another historian, known as Nanshi. When he heard that the whole family of historians had been killed, he took his own bamboo slips and hurried toward the capital, ready to write it himself. Halfway there, he heard it had already been written, so he turned around and went home.',
    'More than 1,800 years later, Wen Tianxiang, a Song dynasty official held in a Yuan prison, wrote his famous “Song of Righteousness.” The first example he gave was this very story.'],
   quote:{k:'Classic',t:'The great historian wrote, “Cui Zhu murdered his ruler.” Cui Zhu killed him. Two younger brothers wrote the same and died. Another brother wrote it, and then Cui Zhu let it stand. Nanshi heard that all the historians had died, and set out with his bamboo slips. Hearing it had already been written, he went back.',src:'Zuo Zhuan, Duke Xiang, Year 25'},
   tie:'The second meaning of history is not written down carelessly. Some people gave their lives to write one sentence correctly, and some tried to force historians to change it with a sword. So whatever history book you read, first ask: Who wrote this?',
   think:'If you were the fourth brother, what would you have written? If every historian had changed the words out of fear, what kind of history would we be reading today?'},
  {scr:2,q:'Why did the Qin dynasty wear black?',img:'terracotta',
   story:['Late in the Warring States period, a scholar from the state of Qi named Zou Yan was so famous that rulers everywhere treated him as an honored guest. He created a theory to explain the rise and fall of dynasties, called the “Five Phases” or “Five Virtues” (五德终始 wǔ dé zhōng shǐ).',
    'He said that all things are ruled in turn by five elements: earth, wood, metal, fire, and water. Wood overcomes earth, metal overcomes wood, fire overcomes metal, water overcomes fire, and earth overcomes water, coming full circle. Each dynasty receives one element, and when its power fades, the element that overcomes it takes its place. The Yellow Emperor was earth, the Xia was wood, the Shang was metal, and the Zhou was fire. Who comes next? Of course, the water that puts out fire.',
    'After the First Emperor united China, he decided that this “water” meant Qin. From then on, clothes and flags were black; the year began in the tenth month; and everything was measured by the number six: hats six inches tall, carriages six feet wide, six horses to a chariot. Even the Yellow River was renamed the “River of Virtue.” A whole empire changed its colors to fit a view of history.',
    'But when the terracotta warriors were first dug up, traces of bright paint remained on them: red, green, purple, and blue. So the rule about black was mostly for court ceremony; not every soldier wore black.',
    'The theory had one more conclusion that the First Emperor did not want to think about: if water overcomes fire, then earth overcomes water. The wheel would keep turning, and Qin would be replaced by the next element. The Qin dynasty lasted only fifteen years. Later, people in the Han dynasty argued for a long time about which element their own dynasty belonged to.'],
   quote:{k:'Classic',t:'The First Emperor followed the theory of the five virtues in their cycle. He held that Zhou had the virtue of fire, and that Qin, replacing Zhou, had the virtue that fire cannot overcome… Clothes, banners, and flags all honored black. The number six was the standard.',src:'Shiji, Annals of the First Emperor of Qin'},
   tie:'The wheel view of history was not just an idea in books. It decided what color an empire wore and how it set its calendar, and it quietly predicted how that empire would end.',
   think:'If you believed history was only a wheel, would you feel safe after becoming emperor?'},
  {scr:3,q:'Did anyone outside the Bible mention King David?',img:'telDan',
   story:['For a long time, some scholars thought King David was only a legend of the Israelites, much like the Yellow Emperor in Chinese stories. Their reason was simple: apart from the Bible, no ancient writing mentioned him.',
    'In the summer of 1993, archaeologists were digging at Tel Dan in northern Israel. Gila Cook, the team’s surveyor, noticed words carved on a piece of basalt stone built into an ancient wall. The next year, the team found two more pieces nearby.',
    'The inscription is in Aramaic and was carved in the 9th century BC. It was set up by a king of Aram, north of Israel. Most scholars think he was Hazael of Damascus. On the stone he boasted of his victories: he had killed the “king of Israel” and also a king of the “House of David.” This was the first time anyone outside the Bible was found to have written “House of David.”',
    'Even more interesting, 2 Kings 9 tells a different version: the one who killed these two kings was Jehu, a general of Israel. Which is right? Perhaps each side was giving itself the credit. An enemy’s stone and the Bible tell the same event in different ways. This is exactly the kind of puzzle historians face all the time.',
    'The stone is now on display at the Israel Museum in Jerusalem.'],
   quote:{k:'Scripture',t:'Nathan said to David, “You are the man!”',src:'2 Samuel 12:7'},
   tie:'The Bible writes about David and records even his sins in full. A stone set up by his enemy also admits there was a “House of David.” Putting sources from different sides together is how we read history.',
   think:'Would a king carve his own defeats on a monument he set up? When you read such an inscription, should you be a little careful?'},
  {scr:4,q:'What did a shepherd boy’s stone hit?',img:'dss',
   story:['Between the winter of 1946 and early 1947, in the barren hills on the northwest shore of the Dead Sea, a Bedouin boy was looking for a lost goat. He threw a stone into a cave to drive the goat out, and heard something shatter. It was a clay jar.',
    'He climbed into the cave and found, in several jars, old leather scrolls wrapped in cloth. No one knew what they were. Some of the scrolls passed from hand to hand and were sold to a shoemaker and antiques dealer in Bethlehem, and then to others.',
    'On November 29, 1947, Professor Sukenik of the Hebrew University risked crossing dangerous streets to buy three of the scrolls. On that same day, the United Nations voted to divide Palestine. Four other scrolls were taken to America by a Syrian archbishop, and in 1954 they were even offered for sale in a small advertisement in The Wall Street Journal. Sukenik’s son, Yigael Yadin, secretly arranged to buy them and brought them back to Jerusalem.',
    'Later, more than nine hundred scrolls and fragments were found in eleven caves nearby. Every book of the Old Testament except Esther is among them. The most complete one, the book of Isaiah, is more than seven meters long. It was copied around 125 BC, about a thousand years earlier than the oldest complete Hebrew copy known before.',
    'Scholars compared the two copies, a thousand years apart, word by word. The differences were very small, mostly in spelling and the shapes of letters. Over a thousand years, generation after generation of copyists had hardly changed a thing.'],
   quote:{k:'Scripture',t:'The grass withers, the flower fades, but the word of our God will stand forever.',src:'Isaiah 40:8'},
   tie:'We reach history through what has been left behind. The Bible itself also has a path of copying that we can check step by step.',
   think:'Without the Dead Sea Scrolls, how else could we know whether ancient copyists made mistakes?'}
 ]
};

 v1:{src:'l2v1en.mp4',player:'l2v1pen.html',poster:'l2v1en.jpg',label:'Video 1 · Where Sources Come From · 4:46',
   quiz:[{at:106.8,q:'Primary sources are close to the event. Are they always more reliable than secondary sources?',opts:['Yes: being close means being right','Not always: people at the time could see wrongly or even lie','Primary sources are never reliable'],a:1,ok:'We need to read both. A good secondary source has compared many pieces of evidence.',hint:'What did the video say people at the time could do?'},
         {at:178.6,q:'Mencius did not believe that “blood floated the pestles.” What was his reason?',opts:['He found another record','He had seen the battle himself','“A good ruler would never do that”: an idea in his own mind'],a:2,ok:'It is good that Mencius dared to question a book, but an idea in his mind is not evidence. We need the third question.',hint:'What did Mencius say happens when the kindest ruler attacks the cruelest one?'},
         {bq:1,q:'Who wrote the Shiji (Records of the Grand Historian)?',opts:['Sima Qian','Mencius','Ban Gu'],a:0,ok:'Sima Qian was a Han dynasty historian. He finished the Shiji around 100 BC.',hint:'He served Emperor Wu of Han.'},
         {q:'Which of these is a primary source?',opts:['A biography written much later','A history textbook today','Oracle bones carved by the Shang'],a:2,ok:'Primary sources are left by people at the time: oracle bones, inscriptions, letters and diaries from those years.',hint:'Which one was left when the events happened?'},
         {q:'Wang Guowei compared the Shang king list in the Shiji with what, and found they mostly agreed?',opts:['Tang poems','Oracle bone records','Dunhuang wall paintings'],a:1,ok:'An old book on paper and bones from the ground: two unrelated sources agreed.',hint:'It came out of the ground.'}],
   points:['Luke wrote his Gospel by finding eyewitnesses, checking everything carefully, and writing it in order.','Primary sources were left by people at the time: oracle bone writing, inscriptions, letters and diaries. Secondary sources were written later, based on primary sources.','Ask three questions about any source: Who wrote it? How far away was he? Is there other evidence?','Mencius said, “If you believe everything in the book, it would be better to have no book at all.” Doubting is good, but doubt also needs evidence.','Wang Guowei compared old books with oracle bones from the ground: the Shiji’s list of Shang kings mostly agreed.']},
 task1:{q:'Drag the six sources to the right side. Think: was it left at the time, or written later?',

   cards:[{t:'Oracle bone writing carved by the Shang people',src:'Shang · Yinxu',b:0,img:'oracleDi',say:'Carved by diviners at the time, it is the most direct source for the Shang.'},
          {t:'An inscription cast on a Zhou bronze vessel',src:'Western Zhou · Da Yu ding',b:0,img:'dayuRub',say:'The man who cast this vessel recorded what the Zhou king said to him.'},

 v2:{src:'l2v2en.mp4',player:'l2v2pen.html',poster:'l2v2en.jpg',label:'Video 2 · The Death of Xiang Yu · 5:10',
   quiz:[{at:116.5,q:'About the death of Xiang Yu, which of these is most reliable?',opts:['Every word he said by the Wu River','That he lost the war and took his own life','What he was thinking at the time'],a:1,ok:'The five men who killed Xiang Yu were made lords and listed in the table of founding officials. But for his exact words, we have only Sima Qian’s account.',hint:'Which one is supported by more than one record?'},
         {at:216.4,q:'Du Mu, Wang Anshi, and Li Qingzhao saw the same event differently. What does this show?',opts:['Two of them must be wrong','Behind each view stands a person and his or her time','Poems cannot be read as history'],a:1,ok:'Where a historian stands to look, and what standard he uses to judge: this is called a view of history.',hint:'What had just happened to the Song dynasty when Li Qingzhao wrote her poem?'},
         {bq:1,q:'In what year was Xiang Yu defeated and took his own life?',opts:['202 BC','221 BC','AD 202'],a:0,ok:'In 202 BC, after the battle of Gaixia, Xiang Yu died by the Wujiang River. 221 BC is the year Qin unified China.',hint:'After this year, Liu Bang founded the Han.'},
         {q:'Who was Xiang Yu’s rival, and later founded the Han dynasty?',opts:['Qin Shi Huang','Liu Bang','Sima Qian'],a:1,ok:'Liu Bang defeated Xiang Yu and founded the Han dynasty.',hint:'He is the “Han” in “Chu against Han.”'},
         {q:'The Book of Han moved Xiang Yu from the “basic annals” to the “biographies.” Who wrote it?',opts:['Sima Qian','Du Mu','Ban Gu'],a:2,ok:'Ban Gu was a historian of the Eastern Han. The facts stayed the same; the judgment changed.',hint:'He lived later than Sima Qian.'}],
   points:['In 202 BC, Xiang Yu was defeated. At the Wu River he refused to cross, and took his own life.','The three questions: Sima Qian was a Han historian writing a hundred years later; the defeat and suicide are backed by the table of founding officials, but the words he spoke come from only one source.','Sima Qian put Xiang Yu among the Basic Annals, yet criticized him for blaming Heaven instead of himself. Ban Gu moved him to the Biographies. The facts did not change; the judgment did.','Three poems by Du Mu, Wang Anshi, and Li Qingzhao: three views. This is what we call a view of history.','Measured by the Bible: people are responsible for what they do; people see only the outside, and the final judgment is in God’s hands.']},
 task2:{tiers:[
   {h:'Who wrote it? Which side was he on?',img:'liubang',ref:'Proverbs 18:17',v:'The one who states his case first seems right, until the other comes and examines him.',s:'Sima Qian was a Han historian, and Xiang Yu was the enemy of Liu Bang, who founded the Han. When you read what he wrote about Xiang Yu, remember which side he was on.'},
   {h:'How far away?',img:'luke',ref:'Luke 1:2',v:'…just as those who from the beginning were eyewitnesses and ministers of the word have delivered them to us.',s:'Luke looked for eyewitnesses. Sima Qian wrote about the words by the river a hundred years later, and very few people heard them at the time.'},

 read:[
  {kind:'scr',tag:'Scripture',origin:'The Gospel of Luke was written in the second half of the first century AD. These are its first lines, written to a man named Theophilus.',ref:'Luke 1:1–4',
   text:'[[Inasmuch as many have undertaken to compile a narrative of the things that have been accomplished among us,]] [[just as those who from the beginning were {eyewitnesses|people who saw it with their own eyes.} and ministers of the word have delivered them to us,]] [[it seemed good to me also, having {followed all things closely|investigated and checked everything carefully.} for some time past,]] [[to write an orderly account for you, most excellent {Theophilus|the person Luke wrote to; the name means “friend of God.”},]] [[that you may have {certainty|being sure that something is reliable.} concerning the things you have been taught.]]',
   act:{type:'pick',q:'Why did Luke write this book? Tap the part of the passage that tells you.',a:4,ok:'“That you may have certainty concerning the things you have been taught.” Luke checked everything and wrote it in order so his reader could know these things are reliable.',hint:'Look at the last part.'}},
  {kind:'cls',tag:'Classical Chinese',book:'史记',bg:'shiji',origin:'Sima Qian wrote this around 100 BC, about a hundred years after Xiang Yu died. Tap the underlined words to see what they mean.',
   text:'于是项王乃欲东渡乌江。乌江亭长{舣|yǐ: to bring a boat to the shore}船待，谓项王曰：“江东虽小，地方千里，众数十万人，亦足{王|wàng: to be king}也。愿大王急渡。今独臣有船，汉军至，无以渡。”[[项王笑曰：“天之亡我，我何渡为！]][[且{籍|jí: Xiang Yu’s personal name; he is speaking of himself}与江东子弟八千人渡江而西，今无一人还，]][[{纵|zòng: even if}江东父兄怜而{王我|wàng wǒ: make me king}，我何面目见之？]][[纵彼不言，籍独不愧于心乎？”]]',
   plain:'Xiang Yu wanted to cross the Wu River to the east. The village head of Wujiang brought a boat to the shore and waited. He said to Xiang Yu, “Jiangdong is small, but it is a thousand li of land with several hundred thousand people. That is enough to be king. Please cross quickly, Great King. Only I have a boat here. When the Han army comes, they will have no way to cross.” Xiang Yu laughed and said, “Heaven is destroying me. Why should I cross the river? Once I crossed this river and marched west with eight thousand young men from Jiangdong. Now not one of them has come back. Even if the elders of Jiangdong pitied me and made me king, how could I face them? Even if they said nothing, would I not feel ashamed in my heart?”',
   act:{type:'pick',q:'Where does Xiang Yu give his reason for not crossing most directly? Tap it. (Hint: 面目 miànmù = face.)',a:2,ok:'我何面目见之 (wǒ hé miànmù jiàn zhī): “how could I face them?” He said he could not face the elders of Jiangdong. Whether there was anything else in his heart, Sima Qian did not know, and neither do we.',hint:'Look for the characters 面目.'}},
  {kind:'short',q:'Du Mu or Wang Anshi: whose view makes more sense to you? Give your reason in one sentence.',
   ref:'A possible answer: there is no single right answer. Those who agree with Wang Anshi point out that none of the eight thousand young men came back, so Jiangdong might no longer have supported him. Those who agree with Du Mu point out that Liu Bang also lost many times and kept fighting. What matters is that your reason comes from the sources.'}
 ],
 essay:{q:'How do you judge Xiang Yu’s refusal to cross back to Jiangdong?',
   starts:['I think Xiang Yu would not cross back to Jiangdong because','My reason is (quote the Shiji or one of the poems):','Looking at it through the Bible,'],
   ev:[['Shiji, Annals of Xiang Yu','“Heaven is destroying me. Why should I cross the river? Once I crossed this river and marched west with eight thousand young men from Jiangdong. Now not one of them has come back. Even if the elders of Jiangdong pitied me and made me king, how could I face them?”'],['The Grand Historian says','In five years he lost his kingdom and died at Dongcheng, and still he did not wake up or blame himself. That was wrong. He said, “Heaven destroyed me; it was not my fault in battle.” Isn’t that absurd?'],['Du Mu, “On the Wujiang Pavilion”','Victory and defeat in war cannot be foreseen; to bear shame and endure disgrace is what makes a man. The young men of Jiangdong had many talents; who knows, he might have come back again.'],['Wang Anshi, “The Wujiang Pavilion”','After a hundred battles, worn out, the brave soldiers grieve; one defeat in the Central Plain, and the tide could not be turned. Though the young men of Jiangdong are still there, would they come back with their king?'],['Li Qingzhao, “A Summer Quatrain”','In life, be a hero among men; in death, be a hero among ghosts. Even now I think of Xiang Yu, who would not cross back to Jiangdong.'],['Proverbs 19:3','When a man’s folly brings his way to ruin, his heart rages against the LORD.'],['1 Samuel 16:7','Man looks on the outward appearance, but the LORD looks on the heart.']],
   summary:'To judge a person, first make the facts clear, then say where you stand and what standard you use. Xiang Yu blamed Heaven instead of himself, and we can criticize that. But what was really in his heart, we can only say as far as the evidence allows.',
   peers:['I think Xiang Yu would not cross back to Jiangdong because he was too proud to admit defeat. My reason is that in the Shiji he says, “Heaven is destroying me,” and to the end he did not think it was his own fault; Sima Qian also says, “Isn’t that absurd?” Looking at it through the Bible, Proverbs says a man’s folly ruins his way while his heart rages against the Lord, and that is what Xiang Yu did.','I think Xiang Yu would not cross back to Jiangdong because of both pride and shame. My reason is that he said, “How could I face them?” All eight thousand young men had died, and he felt he had failed them. Looking at it through the Bible, man looks on the outward appearance, but the Lord looks on the heart, so I cannot say everything that was in his heart.'],
   read:[['Historians on the road · China and Greece','Sima Qian traveled across China to check his stories; at Huaiyin he went to see the tomb of Han Xin’s mother himself (Shiji, ch. 92). The Greek historian Herodotus also traveled, and in Histories 2.99 he says: up to here I have written what I saw and judged for myself; from here on I will tell what the Egyptians told me. Compare: how does each one separate what he saw from what he heard?'],['A defeated leader · Xiang Yu and Saul','1 Samuel 31 tells how King Saul, defeated on Mount Gilboa, fell on his own sword. 1 Chronicles 10:13–14 then explains why, in God’s eyes, Saul died. Compare it with the end of the Annals of Xiang Yu: where does each text place the blame, and who makes the final judgment?'],['Speeches nobody wrote down · Sima Qian and Thucydides','The Greek historian Thucydides admitted (History of the Peloponnesian War 1.22) that it was hard to remember speeches word for word, so he wrote what each speaker was likely to have said, keeping close to the general sense. Compare this with Xiang Yu’s words by the Wu River: how should we read speeches in ancient histories?']],
   more:'Sima Qian was a Han historian, yet he put Xiang Yu, the Han dynasty’s enemy, among the Basic Annals. Why do you think he did this?'},
 close:{three:['When you read a source, first ask three questions: Who wrote it? How far away was he? Is there other evidence?','Primary sources are close to the event; good secondary sources compare the evidence. Read both, and put what is on paper side by side with what is under the ground.','Facts need evidence; judgments depend on who is speaking and where he stands. We measure by the Bible, and we know our limits.'],
   award:'oracleDi',awardSay:'A rubbing of a Shang oracle bone inscription. Wang Guowei compared bones like this with the Shiji: two witnesses who never knew each other, telling the same story.'},
 lib:[
  {scr:2,q:'What does the oldest surviving letter by a famous Chinese writer say?',img:'pingfu',
   story:['In the Palace Museum in Beijing there is a yellowed sheet of hemp paper. It has only nine lines and about eighty characters, written in a quick, tangled hand. It is a letter from Lu Ji, a writer of the Western Jin dynasty, to a friend. It is more than 1,700 years old, and it is the earliest handwriting by a famous person that still survives.',
    'The letter is about ordinary things. A friend was sick, and Lu Ji worried that he would not recover soon (恐难平复 kǒng nán píngfù). Later people took two characters from this line and named it the Pingfu Tie. Lu Ji surely never imagined that a simple get-well note would be treasured for generations.',
    'For more than a thousand years it passed between palaces and collectors. In the 1930s, the collector Zhang Boju heard that a foreign buyer wanted it. He raised money everywhere and bought it at the end of 1937. During the war, he moved from place to place, and it is said that he and his wife Pan Su sewed it into their bedding and kept it with them at all times.',
    'In 1956, Zhang Boju gave the Pingfu Tie, along with other precious works, to the nation. Today it rests in the Palace Museum. When it is shown for a few days, people wait in line for hours to see it.',
    'For anyone studying Lu Ji, this is the best primary source: nobody retold it, and the ink was put on the paper by his own hand.'],
   quote:{k:'Classic',t:'Yanxian is weak and ill; I fear it will be hard for him to recover.',src:'Lu Ji, Pingfu Tie (scholars read the characters slightly differently)'},
   tie:'A primary source does not have to be about great affairs of state. A letter to a sick friend lets us hear a person’s voice across 1,700 years.',
   think:'What are you writing today that might become a “primary source” in a thousand years? A social media post, a homework book, a note?'},
  {scr:2,q:'Why did Sima Qian travel across half of China?',img:'shiji',
   story:['When Sima Qian was twenty, he packed his bags and set out. He went south to the Yangtze and Huai rivers, climbed Mount Kuaiji to look for the legendary traces of Yu the Great, and stood by the Xiang River thinking of the poet Qu Yuan, who drowned himself there. Then he went north to the hometown of Confucius to watch how the people of Lu practiced the ancient rites.',
    'He was not sightseeing. He was doing interviews. In the Shiji, he often tells at the end of a chapter where he went and whom he heard. Writing about the general Han Xin, he says: I went to Huaiyin, and the local people told me that even when Han Xin was a commoner, his ambitions were different from others. When his mother died, he was too poor to bury her, yet he chose a high, wide piece of land, saying that one day ten thousand families could live beside her tomb.',
    'Sima Qian writes: I went to see his mother’s tomb, and it was just as they said.',
    'Writing about Lord Mengchang, he says he passed through the region of Xue and found many tough young men there, unlike other places. He asked the locals and learned that Lord Mengchang had once invited wandering fighters from all over, and more than sixty thousand families had moved to Xue.',
    'Two thousand years ago there were no trains and no map apps. A young man checked his sources one by one on his own feet, and that is why his writing carries weight.'],
   quote:{k:'Classic',t:'I went to Huaiyin, and the people of Huaiyin told me that even when Han Xin was a commoner, his ambitions were different from others… I looked at his mother’s tomb, and it was truly so.',src:'Shiji, Biography of the Marquis of Huaiyin'},
   tie:'This is the same work as Luke’s “having followed all things closely”: not only reading books, but going to the place and asking people who saw and heard for themselves.',
   think:'If you were writing the history of your neighborhood or school, whom would you ask first?'},
  {scr:3,q:'How did Sima Qian know what was whispered at the Hongmen Banquet?',img:'xiangyu',
   story:['The most tense scene in the Shiji is the Hongmen Banquet, where Xiang Yu hosted his rival Liu Bang. Xiang Yu’s adviser Fan Zeng raised his jade ring again and again, signaling that it was time to kill Liu Bang. Xiang Zhuang drew his sword to dance, and its point kept moving toward Liu Bang. Fan Kuai burst into the tent with a shield, glaring at Xiang Yu so fiercely that his hair stood on end.',
    'Students often ask: where did Sima Qian get these details? The banquet was more than a hundred years before his time, and he was not there.',
    'One clue is hidden in another chapter of the Shiji. At the end of the biography of Fan Kuai and others, Sima Qian says: I was friends with Fan Taguang, and he told me about how the founding officials of Emperor Gaozu rose to power. Fan Taguang was Fan Kuai’s grandson.',
    'So the part where Fan Kuai bursts into the tent may well rest on stories handed down in the Fan family. When a family tells of a grandfather’s heroic deeds, the story can easily become more exciting. We should keep that in mind too.',
    'Some words, such as the secret talk between Xiang Bo and Zhang Liang the night before, were heard by only two people. The scholar Qian Zhongshu said that historians writing such scenes often have to imagine themselves in the situation and write what is reasonable. The main events are reliable; for the details, we leave a little room.'],
   quote:{k:'Classic',t:'I was friends with Taguang, and he told me that this is how the founding officials of Emperor Gaozu rose.',src:'Shiji, Biographies of Fan, Li, Teng, and Guan'},
   tie:'Here are the questions “How far away?” and “Who wrote it?” Sima Qian was a hundred years from the banquet, his sources may have come from the descendants of people who were there, and descendants telling about their ancestors have their own point of view.',
   think:'If Xiang Yu’s descendants had also told Sima Qian about the banquet, how might the story be different?'},
  {scr:4,q:'Were Sunzi and Sun Bin the same person?',img:'slips',
   story:['The Shiji tells of two military thinkers named Sun. Sun Wu, of the Spring and Autumn period, wrote The Art of War (孙子兵法 Sūnzǐ Bīngfǎ). More than a hundred years later, in the Warring States period, Sun Bin also wrote a book on war, and the book list in the History of the Han still records it.',
    'But Sun Bin’s book was later lost. Over time, from the Song dynasty on, some scholars began to doubt: maybe there was only one Sunzi and one book, and Sima Qian had turned one man into two? This argument went on for several hundred years, and nobody could convince anybody.',
    'In April 1972, workers building on Yinque Mountain in Linyi, Shandong, dug into two Western Han tombs. Inside were thousands of bamboo slips. As scholars read them one by one, they found The Art of War, and also a book on war that no one had ever seen, with conversations between Sun Bin, King Wei of Qi, and the general Tian Ji.',
    'Sun Bin’s Art of War, lost for nearly two thousand years, came back out of the ground. Two men, two books: Sima Qian had not made a mistake.',
    'This is the power of the third question. When arguments on paper cannot settle a matter, evidence from the ground can make it clear.'],
   quote:{k:'Classic',t:'After Sun Wu died, more than a hundred years later, there was Sun Bin.',src:'Shiji, Biographies of Sunzi and Wu Qi'},
   tie:'Here again, Wang Guowei’s method of comparing “materials on paper” with “materials under the ground” is put to work.',
   think:'Before the Yinque Mountain slips were found, were the scholars who doubted wrong? Was their doubt worth anything?'},
  {scr:4,q:'Did Luke use the wrong title for an official?',img:'luke',
   story:['Acts 17 says that when Paul preached in Thessalonica, a riot broke out, and a crowd dragged some believers before the “city authorities.” In the Greek text this is a rare word, politarchs, meaning “rulers of the city.”',
    'In the nineteenth century, some scholars searched the Greek and Roman books and could not find this title. They suspected that Luke had made a mistake, and some even argued that Acts was written much later by someone who did not know the local situation.',
    'Later, on an old city gate in Thessalonica, people found a stone inscription that began with a list of officials, using exactly this title. The stone was taken to London and is now in the British Museum.',
    'Since then, dozens more inscriptions with this title have been found, many of them around Thessalonica. Luke had used the very name local people used at the time.',
    'Not finding something in books does not mean it did not exist. Sometimes we simply do not yet have enough evidence.'],
   quote:{k:'Scripture',t:'And when they could not find them, they dragged Jason and some of the brothers before the city authorities.',src:'Acts 17:6'},
   tie:'This is the same lesson as Sun Bin’s book: a book and a stone inscription that never knew each other, telling the same story.',
   think:'Before you doubt a source, what questions should you ask first? Does “I have never seen it” count as evidence?'}
 ]
};

 v1:{src:'l3v1en.mp4',player:'l3v1pen.html',poster:'l3v1en.jpg',label:'Video 1 · China Before Writing · 4:38',
   quiz:[{at:66.2,q:'Millet in the north, rice in the south. What is the most likely reason?',opts:['The north is drier and colder; the south is warmer and wetter','An emperor ordered it','Southern people could not grow millet'],a:0,ok:'Millet can survive dry weather; rice grows standing in water. Different land and water led to different ways of life.',hint:'Think: what is always in a rice field?'},
         {at:163.5,q:'Was Erlitou the capital of the Xia dynasty? Why are scholars still arguing?',opts:['It is certain; the old books say so clearly','Old books say there was a Xia, but no writing has been found here that matches','It is certain that it was not'],a:1,ok:'This is last lesson’s third question: Is there other evidence that agrees? The old books record it, but the ground is still missing written evidence.',hint:'Use last lesson’s third question.'},
         {bq:1,q:'What is the earliest mature writing in China?',opts:['Patterns on Yangshao pottery','Qin small seal script','Shang oracle bone script'],a:2,ok:'Oracle bone script is about 3,300 years old. For anything earlier, we can only ask what is in the ground.',hint:'The next lesson is about it.'},
         {q:'What main grain was first domesticated along the Yellow River?',opts:['Wheat','Rice','Millet'],a:2,ok:'Along the Yellow River, people made millet from wild green foxtail; rice came from the Yangzi; wheat came later from the west.',hint:'It needs little water.'},
         {q:'Liangzhu is on the lower reaches of which great river?',opts:['The Pearl River','The Yellow River','The Yangzi'],a:2,ok:'Liangzhu is near Hangzhou, Zhejiang, on the lower Yangzi. Its people grew rice and built dams.',hint:'The Liangzhu people grew rice.'}],
   points:['The earliest mature Chinese writing is Shang oracle bone script, about 3,300 years ago. For anything earlier, we can only ask the things under the ground.','Archaeologists measure dates with carbon-14 and other methods; Christians have different views about how to fit them with the family lists in Genesis.','Along the Yellow River, people tamed green foxtail into millet; along the Yangtze, they tamed wild rice.','Four groups of sites: Yangshao, Liangzhu, Taosi and Shimao, and Erlitou. Su Bingqi said early civilization was like “a sky full of stars.”','Paul said in Lystra that God “did not leave himself without witness,” giving “rains from heaven and fruitful seasons.” People who left no writing are also in God’s hands.']},
 task1:{q:'Drag the six objects to the place where they were found. Think: by the Yellow River, by the Yangtze, or on the northern plateau?',
   bins:['Middle Yellow River','Lower Yangtze','Northern plateau'],
   why:['The middle Yellow River: today’s Henan, southern Shanxi, and central Shaanxi.','The lower Yangtze: today’s Zhejiang and Jiangsu.','The northern plateau: the loess plateau along the Great Wall.'],
   cards:[{t:'Painted basin with face and fish',src:'Yangshao culture · Banpo, Xi’an',b:0,img:'fishbasin',say:'The Yangshao people lived on the middle Yellow River, grew millet, and made painted pottery.'},

          {t:'Jade cong',src:'Liangzhu · near Hangzhou, Zhejiang',b:1,img:'cong',say:'The Liangzhu people grew rice on the lower Yangtze, built dams, and polished jade into cong.'},
          {t:'Rice',src:'tamed from wild rice',b:1,img:'rice',say:'People along the Yangtze tamed wild rice into the rice we eat.'},
