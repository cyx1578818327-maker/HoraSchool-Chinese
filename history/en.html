   summary:'The sites are scattered across the land like a sky full of stars: people in different places developed on their own, and also met and traded. Only later did the middle Yellow River slowly become the center.'},
 v2:{src:'l3v2en.mp4',player:'l3v2pen.html',poster:'l3v2en.jpg',label:'Video 2 · Where Did the Chinese People Come From? · 5:10',
   quiz:[{at:80.3,q:'How did Xia Nai know that the painted pottery in Gansu was later than the pottery in Henan?',opts:['He thought the Gansu patterns looked simpler','He dug down layer by layer in Gansu and saw which was on top and which was underneath','The old books said so'],a:1,ok:'Undisturbed layers are like a book: the lower pages were written first, the upper pages later.',hint:'He dug down layer by layer.'},
         {at:175.8,q:'Someone says, “Wheat came from the west, so the Western origin theory is right.” What is wrong with this?',opts:['Nothing is wrong with it','Receiving a few things is not the same as the whole civilization being moved in','Wheat actually began in China'],a:1,ok:'Learning from others and then making something your own is different from being moved in whole.',hint:'After the Shang learned to make bronze, what did they make?'},
         {bq:1,q:'J. G. Andersson dug up painted pottery at Yangshao in 1921 and suggested it came from the west. Where was he from?',opts:['Britain','China','Sweden'],a:2,ok:'Andersson was a Swedish geologist. Later Xia Nai corrected his view with evidence from the layers.',hint:'He came from northern Europe.'},
         {q:'Which of these came into China from the west?',opts:['Wheat','Millet','Rice'],a:0,ok:'Wheat, sheep, cattle and bronze-making came from the west; millet and rice were domesticated in China.',hint:'Rice and millet were both domesticated in China.'},
         {q:'Paul said God “made from one man every nation of mankind.” In which city did he say it?',opts:['Rome','Jerusalem','Athens'],a:2,ok:'Acts 17:26: Paul was speaking at the Areopagus in Athens.',hint:'It is the city of the Areopagus.'}],
   points:['In 1921, Andersson dug up painted pottery at Yangshao and proposed the Western origin theory: China’s painted pottery might have come from the west.','In 1945, Xia Nai dug layer by layer in Gansu: the Gansu pottery was later than the Henan pottery, so painted pottery spread from east to west.','Other evidence agrees: millet and rice were tamed here, pottery changed step by step, and oracle bone writing is completely different from cuneiform.','But China was not closed off: wheat, sheep, cattle, and bronze-making came from the west, and the Shang then cast great vessels found nowhere else.','The Western origin theory must be answered by archaeology; “every nation from one man” is what God himself has told us. So we are not proud, and not ashamed.']},
 task2:{tiers:[

          ok:'False. These are two different questions. The Western origin theory asks where pottery and writing came from, and needs archaeological evidence. “Every nation from one man” is about where all people come from and to whom they belong.',hint:'Do the two sentences answer the same question?',img:'areop'}],
   summary:'A guess can be bold, but testing must be honest. When the evidence does not support a guess, let it go; and do not go too far the other way: Chinese civilization grew up here, and was always in contact with the outside.'},
 read:[
  {kind:'scr',tag:'Scripture',origin:'Genesis 10 lists the descendants of Noah’s three sons. It is often called the “Table of Nations.” Here are verses from its beginning, middle, and end.',ref:'Genesis 10:1, 5, 32',
   text:'[[These are the generations of the sons of Noah, Shem, Ham, and Japheth.]] [[Sons were born to them after the flood.]] [[From these the {coastland peoples|peoples living by the sea and on islands.} spread in their lands,]] [[each with his own language, by their clans, in their nations.]] [[These are the clans of the sons of Noah, according to their {genealogies|family records.}, in their nations,]] [[and from these the nations spread abroad on the earth after the flood.]]',
   act:{type:'pick',q:'How were the peoples divided as they spread out? Tap the part that tells you.',a:3,ok:'“Each with his own language, by their clans, in their nations.” Genesis 11 then tells about Babel: the LORD confused the language of all the earth and dispersed people over the face of all the earth.',hint:'Look for the word “each.”'}},
  {kind:'scr',tag:'Scripture',origin:'Paul spoke on the Areopagus in Athens. His listeners were Greeks who did not read the Bible and did not know the God of Israel.',ref:'Acts 17:26–27',
   text:'[[And he made from {one man|a single source; the Chinese Bible says 一本, “one root.”} every nation of mankind]] [[to live on all the face of the earth,]] [[having {determined|decided and set in advance.} allotted periods and the {boundaries|borders.} of their dwelling place,]] [[that they should seek God,]] [[and perhaps {feel their way toward|search for something in the dark.} him and find him.]] [[Yet he is actually not far from each one of us.]]',
   act:{type:'pick',q:'Why did God set the periods and boundaries of the nations? Tap the answer.',a:3,ok:'“That they should seek God.” The people living by the Yellow River and the Yangtze are included in this sentence too.',hint:'Look for the words “that they should.”'}},
  {kind:'cls',tag:'Classical Chinese',book:'史记',bg:'shiji',origin:'Sima Qian began the Shiji with the Yellow Emperor. But no writing survives from that time, and at the end of his chapter on the Five Emperors he explains his problem. Tap the underlined words to see what they mean.',
   text:'学者多称五帝，{尚|shàng: long ago, far back}矣。[[然《尚书》独载尧以来；]][[而百家言黄帝，其文不{雅驯|yǎxùn: proper and reliable}，]]{荐绅先生|jiànshēn xiānsheng: learned gentlemen}难言之。……余尝西至{空桐|Kōngtóng: a mountain in today’s Gansu}，北过{涿鹿|Zhuōlù: a place in today’s Hebei}，东{渐|jiàn: to reach}于海，南浮江淮矣，[[至长老皆各往往称黄帝、尧、舜之处，]][[风教固殊焉，]][[总之不离古文者近是。]]',
   plain:'Scholars often speak of the Five Emperors, but that was very long ago. The Book of Documents records only the time from Yao onward. The many schools tell of the Yellow Emperor, but their words are not proper or reliable, and learned gentlemen find it hard to speak of him… I once went west to Mount Kongtong, north past Zhuolu, east to the sea, and south across the Yangtze and Huai rivers. Wherever I went, the elders often spoke of the Yellow Emperor, Yao, and Shun, though the customs of each place were different. In short, the accounts that do not depart from the old writings are closest to the truth.',
   act:{type:'pick',q:'Which kind of account did Sima Qian think was not reliable? Tap it. (Hint: 不 bù = not.)',a:1,ok:'百家言黄帝，其文不雅驯: “the many schools tell of the Yellow Emperor, but their words are not reliable.” He knew there were many stories about the Yellow Emperor and not all could be trusted, so he traveled to ask, and then compared what he heard with the old writings. For a time without writing, even Sima Qian had to be this careful.',hint:'Look for the characters 不雅驯.'}},
  {kind:'short',q:'“China invented everything itself” and “every good thing came from outside”: have you heard either of these? Write one sentence about how you see it now.',
   ref:'A possible answer: there is no single right answer. You can use this lesson’s evidence: millet and rice were tamed here, and painted pottery spread from east to west; wheat, sheep, and cattle came from the west, and the Shang then cast great vessels found nowhere else. Chinese civilization grew up here, and was always in contact with the outside.'}

 essay:{q:'Where did the Chinese people come from? Use what you learned in this lesson to write a paragraph.',
   starts:['Chinese civilization','My evidence is (give one archaeological discovery):','Looking at it through the Bible,'],
   ev:[['Acts 17:26','And he made from one man every nation of mankind to live on all the face of the earth, having determined allotted periods and the boundaries of their dwelling place.'],['Genesis 11:9','Therefore its name was called Babel, because there the LORD confused the language of all the earth. And from there the LORD dispersed them over the face of all the earth.'],['Genesis 10:32','These are the clans of the sons of Noah, according to their genealogies, in their nations, and from these the nations spread abroad on the earth after the flood.'],['Acts 14:17','Yet he did not leave himself without witness, for he did good by giving you rains from heaven and fruitful seasons, satisfying your hearts with food and gladness.'],['Xia Nai · Yangwawan','Dug in Gansu in 1945: a Qijia grave above, Yangshao-type pottery pieces below. The Gansu painted pottery is later than the Henan pottery.'],['Su Bingqi','Early Chinese civilization was like “a sky full of stars”: people in different places developed on their own, and also met and traded.']],
   summary:'To answer “Where did we come from?”, separate two questions. How a civilization grew is answered by evidence from the ground; where people come from and to whom they belong, the Bible has told us. In both, say only as much as the evidence and the Scriptures support.',
   peers:['Chinese civilization grew up here, but it also learned from others. My evidence is that Xia Nai dug layer by layer in Gansu and found the Gansu painted pottery was later than the Henan pottery, so painted pottery did not come from the west; but wheat came from Western Asia. Looking at it through the Bible, God made from one man every nation of mankind, so the Chinese and other peoples were always one family.','Chinese civilization grew up from people in many places together. My evidence is that Yangshao is by the Yellow River, Liangzhu by the Yangtze, and Shimao on the northern plateau; Su Bingqi said it was like a sky full of stars. Looking at it through the Bible, God set the boundaries of the nations and gave rains from heaven and fruitful seasons, so even the people who left no writing were in his hands.'],
   read:[['Stories of the first people · China and the Bible','A Chinese legend, recorded by Ying Shao around AD 200, says the goddess Nüwa (女娲) shaped the first people from yellow earth. Genesis 2:7 says the LORD God formed the man of dust from the ground and breathed into him the breath of life. Compare: who makes people in each story, and what makes a person alive?'],['Old stories before writing · Sima Qian and Thucydides','Sima Qian traveled to hear the elders’ stories of the Yellow Emperor, then kept only what agreed with old writings (this lesson’s Reading screen). The Greek historian Thucydides (History 1.20–21) complained that people accept stories about the distant past without testing them. Compare: how did each historian handle stories from before writing?'],['Many peoples · Babel and the Book of Documents','Genesis 11:1–9 explains why there are many peoples and languages. The Book of Documents (“Canon of Yao”) praises the sage-king Yao for bringing “the myriad states” (万邦 wàn bāng) into harmony. Compare: where does each text say the many peoples came from, and what does each hope for them?']],
   more:'The people of Liangzhu carved a god-and-beast face on their jade cong. What do you think they were worshiping? How much can we know about this, and how much can we not know?'},

 games:{
  2:[{t:'spot',id:'g_spot',label:'Mini game',h:'The Time-Travel Showcase',rec:'Time-travel showcase',aj:{start:'I brought the showcase over, but a few things in it look wrong to me. Can you help me pick them out?',end:'You found all five. Still, looks are not enough. You also need to know which layer of earth a thing came from. The next video shows how.'},

    ok:'You found all five. Look at the timeline: the closest one missed the showcase’s age by more than a thousand years; the farthest missed it by more than five thousand. How do we know when an object without writing was made? We look at which layer of earth it came from, what was found with it, and what scientific dating says. Xia Nai, in the next video, used exactly this method.'}],
  3:[{t:'dig',id:'g_dig',label:'Mini game',h:'You Are the Archaeologist',rec:'Excavation',aj:{start:'Your turn with the trowel. Remember: from the top down, one layer at a time.',end:'Look at what lies above and below, and at what got mixed into the fill. That is how Xia Nai set the order right.'},
    do:'How do archaeologists know which things are older and which are newer? Follow two Chinese archaeologists and dig two trenches.',
    why:'There is still a mini game to finish.',go:'Tap here to clear this layer',wait:'Not yet dug',
    acts:[
     {h:'Trench 1　1931, Hougang, Anyang, Henan',intro:'The archaeologist Liang Siyong dug down here. Under the ground, the earth lies in layers, one on top of another. Start with the top layer and clear them one by one.',
      hint:'Not so fast! Archaeologists dig from the top down, one layer at a time. Otherwise you cannot tell which layer a thing came from.',H:300,fx:400,
      bands:[{n:'Topsoil',c:'#8C7B5A',h:34},
       {n:'Upper: gray earth',c:'#6F6558',h:76,zone:1,img:'oracleDi',say:'Upper layer: the gray earth held Shang pottery and bone tools, like those found nearby at Xiaotun, the place where oracle bones were found.'},
       {n:'Middle: black earth',c:'#4A4542',h:76,zone:1,img:'longshan',say:'Middle layer: thin, shiny black pottery. This is black pottery of the Longshan culture.'},
       {n:'Lower: red-brown earth',c:'#94573D',h:76,zone:1,img:'yspot',say:'Lower layer: red pottery with painted patterns. This is painted pottery of the Yangshao culture.'},
       {n:'Natural soil (no sign of people below this)',c:'#C9AE84',h:38}],
      q:{q:'All three layers are cleared. If the earth was never disturbed, which layer is the oldest?',opts:['Upper: Shang','Middle: Longshan','Lower: Yangshao','All three are the same age'],a:2,
        hint:'Think: how did the earth pile up, layer by layer?',
        ok:'The lower earth was laid down first and the upper earth later, so the lowest layer is the oldest. This is the basic rule of stratigraphy. At Hougang, Liang Siyong proved with layers for the first time that Yangshao came before Longshan, and Longshan before the Shang. Archaeologists call it the “Hougang three layers.”'}},
     {h:'Trench 2　1945, Yangwawan, Gansu',intro:'Andersson had placed the Qijia culture of Gansu first, even earlier than the painted pottery there. More than twenty years later, Xia Nai opened a Qijia grave in Gansu. A grave pit is dug down from the surface; after the burial, the earth is filled back in.',
      hint:'First clear the fill in the upper part of the pit. Then you can reach the bottom of the grave.',H:290,
      bands:[{n:'Topsoil',c:'#8C7B5A',h:34},{n:'Loess',c:'#C2A274',h:256}],
      pit:{top:34,bot:250,x0:170,x1:196,zones:[
       {to:170,n:'Fill',c:'#9E8761',img:'majiayao',say:'Mixed into the fill were a few pieces of painted pottery, the same as the painted pottery of Gansu’s Yangshao culture (also called the Majiayao culture).'},
       {to:250,n:'Grave floor',c:'#7A6A52',img:'qijia',say:'On the floor of the grave lay Qijia pottery, placed there at the burial.'}]},
      q:{q:'The fill of the grave pit contains painted pottery pieces. So which is older: that painted pottery, or this Qijia grave?',opts:['The painted pottery','The Qijia grave','They are the same age','There is no way to tell'],a:0,
        hint:'Where did the fill come from? Where were those pieces before the pit was filled?',
        ok:'At the burial, people shoveled the earth around the pit back in, and the pieces already lying in that earth came in with it. So the painted pottery must be older than the grave. Andersson’s order was turned upside down: Qijia was not the earliest; it came after the painted pottery. Later digs and dating also showed that Gansu’s painted pottery was later than Henan’s: painted pottery spread from east to west. One small grave pit changed a big idea.'}}],
    ok:'You have dug both trenches. Look at what lies above and below, and at what got mixed into the fill: this is how archaeologists put a time before writing in order.'}]
 },
 close:{three:['Millet in the north, rice in the south; early civilization was like a sky full of stars.','Chinese civilization grew up here, and was always in contact with the outside; whether a claim is true depends on the evidence.','Every nation on earth comes from one man; people who left no writing are also in God’s hands.'],
   award:'cong',awardSay:'A jade cong from Liangzhu. Five thousand years ago, people polished hard jade into this shape and carved a god-and-beast face on it. They left not a single word; we can only read them through their objects.'},
 lib:[
  {scr:2,q:'What was the basin with the human face and fish used for?',img:'fishbasin',
   story:['In the 1950s, archaeologists dug up a village more than six thousand years old at Banpo, on the eastern edge of Xi’an. Its houses were half underground, a ditch ran around the village, and kilns for firing pottery stood at its edge.',
    'Among the painted pottery, the most famous piece is a red basin. Inside, painted in black, is a round human face with eyes like thin lines. A fish hangs from each side of the mouth and each ear, and the head seems to wear a pointed hat.',
    'How was such a basin used? Archaeologists found that the Banpo people placed children who died young in clay jars and buried them near the houses, often covering the mouth of the jar with a basin. The face-and-fish basin came from such a jar burial. Some basins have a small hole drilled in the bottom; some scholars guess it was left for the child’s spirit to come and go.',
    'Whose face is it? Some say it was the tribe’s totem; some say it was a prayer for good fishing; some say it was a mask worn by a shaman. There are many ideas, and still no answer today.',
    'Because the Banpo people left not a single word. We can see their sorrow and their hope, but we cannot hear what they would say themselves.'],
   quote:{k:'Scripture',t:'He has made everything beautiful in its time. Also, he has put eternity into man’s heart.',src:'Ecclesiastes 3:11'},
   tie:'For a time without writing, objects can tell us what people did, but they find it hard to tell us what people thought. This is both the strength and the limit of archaeology.',
   think:'If people six thousand years from now dug up only the things in your room, what would they guess about you? What might they get wrong?'},
  {scr:2,q:'How was the ancient city of Liangzhu found?',img:'cong',
   story:['In 1936, a young man in his twenties named Shi Xingeng worked at the West Lake Museum in Hangzhou. He came from the town of Liangzhu. On visits home, he noticed shiny black pottery pieces and polished stone tools in the fields and along the rivers.',
    'He dug a little on his own and wrote up what he found in a report simply called Liangzhu, published in 1938. But war broke out. He moved from place to place and died of illness before he was thirty, never seeing what came later.',
    'In 1959, Xia Nai gave the name “Liangzhu culture.” In 1986, archaeologists found jade cong and jade axes in the great tombs at Fanshan. The largest cong was later called the “King of Cong.”',
    'The real surprise came in 2007, when archaeologists confirmed a walled city with walls on all four sides. A few years later, they also learned that the valleys outside held a whole system of dams, a project that needed thousands and thousands of people.',
    'In 2019, the ancient city of Liangzhu was added to the World Heritage List. From one young man picking up pottery pieces to a whole city seeing the light again took more than eighty years.'],
   tie:'A discovery often takes several generations working one after another. Shi Xingeng never saw the city, but every piece of pottery he recorded became a starting point for those who dug after him.',
   think:'Shi Xingeng saw only pottery pieces and stone tools. If someone had told him then, “There is a great city at Liangzhu,” should he have believed it? What evidence should he have waited for?'},
  {scr:3,q:'What did Xia Nai see in a grave in Gansu?',img:'majiayao',
   story:['Xia Nai came from Wenzhou in Zhejiang. He studied archaeology at the University of London, worked on ancient Egypt, and returned to China in 1941. At that time China had very few archaeologists with formal training.',
    'In 1945, as the war was ending, he went to Gansu with a scientific expedition to the northwest. At Yangwawan in Ningding County (today’s Guanghe County), he excavated two graves of the Qijia culture.',
    'He noticed one detail: the soil used to fill the grave was mixed with broken pieces of Yangshao-type painted pottery. That meant those pots had already been broken and lying in the ground when the grave was dug. The Qijia culture must be later than that pottery.',
    'With this, Andersson’s order could not stand. Andersson had put Qijia first, as the earliest; Xia Nai used the layers to show it actually came later.',
    'He wrote up his finding in a paper whose title speaks of “revising the dates” of the Qijia graves. The word “revising” is honest: he did not throw out the work of those before him, but corrected the place where they had the order wrong.'],
   tie:'This is the moment in Video 2 when we ask, “Is there other evidence that agrees?” The evidence did not come from a book; it came from the soil filling a grave.',
   think:'When Xia Nai found that Andersson had the order wrong, how should he have thought about Andersson? And how should Andersson have thought about Xia Nai?'},
  {scr:3,q:'What else did Andersson find in China?',img:'andersson',
   story:['Andersson was not originally an archaeologist but a geologist. In 1914, the Chinese government invited him to China as a mining adviser, to help find iron and coal.',
    'While looking for minerals, he also collected fossils. The “dragon bones” sold in Chinese medicine shops were mostly fossil bones of ancient animals. Following this clue, in 1921 he led a team to Zhoukoudian, southwest of Beijing.',
    'That same year, he dug up painted pottery at the village of Yangshao in Henan. Within one year, he came upon two places that would change Chinese archaeology.',
    'Digging at Zhoukoudian went on for many years. In 1929, the Chinese scholar Pei Wenzhong found the first complete skull of “Peking Man” there, and the news amazed the world.',
    'Andersson took many finds back to Sweden and founded the Museum of Far Eastern Antiquities in Stockholm. By agreement, part of the collection was to be returned to China; most of the pieces sent back were later lost in the turmoil of war.'],
   tie:'Andersson’s Western origin theory was wrong, but he made a beginning. A field of study often moves forward when one person makes a guess and another corrects it with evidence.',
   think:'When someone’s guess is proven wrong, does his work still have value? Why?'},
  {scr:4,q:'How do archaeologists find a grain of wheat four thousand years old?',img:'wheat',
   story:['A grain of wheat is even smaller than a grain of rice. Buried in the ground for thousands of years, it should have rotted long ago. How could anyone find it?',
    'The secret is charring. If a grain of wheat falls into a fire and is burned black without turning to ash, it becomes a tiny piece of charcoal. Charcoal does not rot, and it can last in the ground for thousands of years.',
    'Archaeologists use a method called flotation. They pour excavated soil into water and stir it. The mud and sand sink, but the charred seeds are light and float to the top. Then they scoop them out with a very fine sieve, pick them out one by one, and look at them under a microscope.',
    'Using flotation, archaeologists have found charred wheat more than four thousand years old in Gansu, Shandong, and other places, and even older charred millet and rice. They can also test a single grain with carbon-14 to see how old it is.',
    'A burnt black grain of wheat becomes evidence, telling us roughly when wheat arrived in China.'],
   quote:{k:'Scripture',t:'…for he did good by giving you rains from heaven and fruitful seasons, satisfying your hearts with food and gladness.',src:'Acts 14:17'},
   tie:'This is how small “other evidence” can be: the old books would never record that a grain of wheat fell by someone’s fire, but the ground remembers.',
   think:'What things in your kitchen might become “evidence” thousands of years from now?'}
 ]
};

 v1:{src:'l4v1en.mp4',player:'l4v1pen.html',poster:'l4v1en.jpg',label:'Video 1 · How Was the Shang Dynasty Found? · 5:30',
   quiz:[{q:'Why is the story of Wang Yirong finding writing in “dragon bones” marked as uncertain?',opts:['Because Wang Yirong could not read','The story spread later, and there is no reliable record from the time','Because the bones were fake'],a:1,ok:'What we know for sure is that he bought up many bones with writing. “Found in medicine” is a story people tell. Telling “the story goes” apart from “we know for sure” is how we read sources.',hint:'One is a story; the other is certain.'},
         {q:'How does the tomb of Fu Hao confirm what the oracle bones say?',opts:['Bronzes in the tomb carry the name “Fu Hao,” the same woman named in the oracle bones','The tomb is very large','The tomb is in Anyang'],a:0,ok:'The tomb under the ground and the writing on the bones speak of the same woman. Two witnesses who never knew each other agree.',hint:'What name is cast on the bronzes?'},
         {bq:1,q:'Yinxu, the later Shang capital, is in which city today?',opts:['Anyang, Henan','Beijing','Xi’an, Shaanxi'],a:0,ok:'Yinxu is around Xiaotun village in Anyang, Henan. Scientific digging began in 1928.',hint:'The oracle bones were dug up here.'},
         {q:'Fu Hao was the wife of which Shang king?',opts:['King Zhou','Wu Ding','Tang'],a:1,ok:'Fu Hao was the wife of King Wu Ding. The oracle bones say she led sacrifices and led armies.',hint:'He is the king who asked whether Fu Hao’s childbirth would go well.'},
         {q:'About how heavy is the Houmuwu ding?',opts:['More than 800 kg','More than 80 kg','More than 8,000 kg'],a:0,ok:'It weighs about 832 kg, one of the heaviest bronzes the Shang ever cast.',hint:'The video compares it with a student.'}],
   points:['From 1899, Wang Yirong bought bones with writing on them. From 1928, Chinese scholars dug scientifically at Xiaotun near Anyang and found Yinxu, the capital of the later Shang.','The Shang kings’ names on the oracle bones mostly match the list in Sima Qian’s Records. The Shang turned from legend into history we can trust.','The Shang king asked about almost everything: hollows were drilled in the back of a shell or bone, fire was applied, the front cracked, and the question and result were carved beside the crack.','Oracle bone records are primary sources from the Shang themselves. Oracle bone script is the same writing system as Chinese today.','“The great affairs of a state are sacrifice and war”: bronzes were used mostly for sacrifice and war. The bronzes in Fu Hao’s tomb match the Fu Hao of the oracle bones.']},

 v2:{src:'l4v2en.mp4',player:'l4v2pen.html',poster:'l4v2en.jpg',label:'Video 2 · Whom Did the Shang Worship? · 4:39',
   quiz:[{q:'The Shang rarely made offerings or prayers to Di directly. How do scholars explain this?',opts:['The Shang did not believe Di existed','The Shang believed the kings of the past were with Di, so they asked their ancestors to speak for them','Di had nothing to do with rain or harvest'],a:1,ok:'To the Shang, Di was too high and too far away. They knew there was one above all things, but they did not know him or how to come before him.',hint:'To whom did the Shang make the most offerings?'},
         {q:'One oracle bone asks, “Will Di order rain, enough for a good harvest this year?” What is it asking about?',opts:['Whether the queen’s childbirth will go well','Whether Di will send enough rain for a good harvest','Whether to go to war'],a:1,ok:'The Shang believed Di ruled the wind, the rain and the harvest. Yet they almost never made offerings or prayed to him directly.',hint:'Look at the words “rain” and “harvest.”'},
         {bq:1,q:'About how long did the Shang dynasty last?',opts:['More than 500 years','More than 2,000 years','About 100 years'],a:0,ok:'From about 1600 BC to 1046 BC: more than five hundred years.',hint:'About 1600 BC to 1046 BC.'},
         {q:'Who was the last king of the Shang?',opts:['King Zhou','Wu Ding','Tang'],a:0,ok:'King Zhou was the last Shang king. Tang founded the dynasty; Wu Ding was Fu Hao’s husband.',hint:'His name sounds like the state that ended the Shang.'},
         {q:'Which state brought the Shang dynasty to an end?',opts:['Zhou','Xia','Qin'],a:0,ok:'Zhou, a small state to the west, rose up and ended the Shang. The next lesson is about the Zhou.',hint:'It is the next lesson.'}],
   points:['From the oracle bones, the Shang believed in three kinds of powers: the highest, Di; the spirits of rivers, mountains, wind and rain; and their dead ancestors.','The Shang rarely prayed to Di directly. They asked their ancestors instead. They knew of a highest Di, but did not know him.','In Athens, Paul said: “What therefore you worship as unknown, this I proclaim to you.”','The Shang king asked about everything, wanting to hold tomorrow in his own hands. The Bible says tomorrow is in God’s hands.','The Shang offered human sacrifices; more than a thousand sacrificial pits lie beside the royal tombs. The Bible says this is hateful to God. Those who left no name were also made in the image of God.']},
 task2:{tiers:[
   {h:'What did they know, and what did they not know?',img:'areop',ref:'Acts 17:23',v:'What therefore you worship as unknown, this I proclaim to you.',s:'The Shang knew of a highest power, Di, who ruled wind and rain, harvest, and war. But they did not pray to him directly; they asked their ancestors. They knew of him, but did not know him.'},
   {h:'Why did they ask about everything?',img:'oxbone',ref:'James 4:14–15',v:'Yet you do not know what tomorrow will bring. … Instead you ought to say, “If the Lord wills, we will live and do this or that.”',s:'The Shang king asked about births, rain, and war. He wanted to know tomorrow, and to hold it in his own hands.'},
   {h:'How did they try to please their ancestors?',img:'fuhaotomb',ref:'Deuteronomy 12:31',v:'Every abominable thing that the LORD hates they have done for their gods, for they even burn their sons and their daughters in the fire to their gods.',s:'Again and again, the oracle bones record human sacrifice. Most of those killed were prisoners of war. Afraid their ancestors would send disaster, the Shang tried to please them with human lives.'}],
   apply:[{t:'mcq',q:'True or false: It is certain that the Shang’s Di is the God of the Bible.',opts:['True','False'],a:1,
          ok:'False. Christians hold different views, and this lesson does not decide. What is certain is only this: they did not know him.',hint:'What can we say for sure?',img:'areop'},
         {t:'mcq',q:'True or false: The Shang king used divination because he wanted to know what tomorrow would bring.',opts:['True','False'],a:0,
          ok:'True. But tomorrow is in God’s hands; what people are called to do is trust him.',hint:'Why did the king ask about everything?',img:'oracleDi'},
         {t:'mcq',q:'True or false: The names of the people in the sacrificial pits at Yinxu were all written down.',opts:['True','False'],a:1,
          ok:'False. The oracle bones often record only the word Qiang and a number. Not one of them left a name. But they too were made in the image of God, and God has not forgotten them.',hint:'What do the oracle bones record about them?',img:'fuhaotomb'}],
   summary:'The Shang knew of one above, but did not know him. They used divination to ask about tomorrow, and offerings to please their ancestors. The Bible says tomorrow is in God’s hands, and human sacrifice is hateful to God.'},
 read:[
  {kind:'cls',tag:'Oracle bone record',book:'合集',bg:'oracleDi',origin:'This is an oracle bone record from the reign of King Wu Ding, about the birth of a child to his wife Fu Hao. The transcription follows Heji 14002; the punctuation is modern. Tap the underlined words to see what they mean.',
   text:'[[甲申卜，{㱿|què: the name of the diviner}贞：]][[妇好{娩|miǎn: to give birth}，{嘉|jiā: good, fortunate}？]][[王{占|zhān: to read the cracks and judge}曰：其惟丁娩，嘉；其惟庚娩，{引吉|yǐn jí: very lucky}。]][[三旬又一日甲寅娩，不嘉，惟女。]]',
   plain:'On the day jiashen, divining, Que asked: Fu Hao will give birth; will it be good? The king read the cracks and said: If she gives birth on a ding day, it will be good; if on a geng day, very lucky. About a month later, on the day jiayin, she gave birth. It was not good: it was a girl.',
   act:{type:'pick',q:'Which part records what happened afterward? Tap it.',a:3,ok:'三旬又一日甲寅娩，不嘉，惟女: “on jiayin she gave birth; not good, a girl.” The birth did not fall on the lucky days the king named, and they still recorded it as it happened. Calling a girl “not good” also shows us what people then were thinking.',hint:'Look for 三旬 (sān xún, “three ten-day weeks”).'}},
  {kind:'scr',tag:'Scripture',origin:'Paul speaks at the Areopagus in Athens. His listeners are Greeks who worship many gods.',ref:'Acts 17:22–23',
   text:'[[So Paul, standing in the midst of the Areopagus, said: “Men of Athens, I perceive that in every way you are very religious.]][[For as I passed along and observed the objects of your worship,]][[I found also an altar with this inscription: ‘To the unknown god.’]][[What therefore you worship as unknown, this I proclaim to you.”]]',
   act:{type:'pick',q:'What does Paul say he will do? Tap it.',a:3,ok:'“What therefore you worship as unknown, this I proclaim to you.” The Shang too knew there was one above, but did not know him.',hint:'Look for “proclaim.”'}},
  {kind:'scr',tag:'Scripture',origin:'James writes to believers scattered in many places, about how people make plans for tomorrow.',ref:'James 4:13–15',
   text:'[[Come now, you who say, “Today or tomorrow we will go into such and such a town and spend a year there and trade and make a profit”—]][[yet you do not know what tomorrow will bring.]][[What is your life? For you are a mist that appears for a little time and then vanishes.]][[Instead you ought to say, “If the Lord wills, we will live and do this or that.”]]',
   act:{type:'pick',q:'What does James say we ought to say about tomorrow? Tap it.',a:3,ok:'“If the Lord wills.” The Shang king burned bones to ask about tomorrow; James says tomorrow is in the Lord’s hands.',hint:'Look for “ought to say.”'}},
  {kind:'short',q:'Have you ever wanted to know tomorrow: an exam, a game, a move? In a sentence or two, how will you face a tomorrow you cannot know?',
   ref:'There is no single right answer. You might talk about preparing well, or about what “If the Lord wills” means to you.'}
 ],
 essay:{q:'Whom were the Shang asking? Use what you learned in this lesson to write a paragraph.',
   starts:['When the Shang used divination,','My evidence is (give one oracle bone record or one object found in the ground):','Looking at it through the Bible,'],
   ev:[['Oracle bone · Heji 14002','Fu Hao will give birth; will it be good? The king read the cracks and said: born on a ding day, good; on a geng day, very lucky.'],['Oracle bone','Will Di order rain, enough for a good harvest this year?'],['Acts 17:23','What therefore you worship as unknown, this I proclaim to you.'],['James 4:14','Yet you do not know what tomorrow will bring.'],['Deuteronomy 12:31','They even burn their sons and their daughters in the fire to their gods.'],['Hu Houxuan’s count','The oracle bones record more than 13,000 people killed as offerings.']],
   summary:'To answer “whom were they asking,” keep two things apart: the oracle bones tell us the Shang asked Di, the spirits of rivers and mountains, and their ancestors; and they did not know the highest Di. The Bible says what they did not know: tomorrow is in God’s hands.',
   peers:['When the Shang used divination, they were mostly asking their ancestors, though they also knew of a highest Di. My evidence is the oracle bone that asks, “Will Di order rain?”, while they almost never made offerings to Di directly. Looking at it through the Bible, they were like the people of Athens, worshiping a god they did not know.','When the Shang used divination, they wanted to know what tomorrow would bring. My evidence is the record about Fu Hao: the king named the lucky days, but the child was born on another day. Looking at it through the Bible, we do not know what tomorrow will bring; we ought to say, “If the Lord wills.”'],
   read:[['Asking about tomorrow · China and Greece','The Fu Hao record (Heji 14002) asks a question, gives the king’s judgment, and then carves down what really happened. In Herodotus (Histories 1.53, 1.91), King Croesus of Lydia asks the oracle at Delphi whether to attack Persia and is told he will destroy a great empire. The empire he destroyed was his own. Compare: how did each people ask, and why did asking still not put tomorrow in their hands?'],['A kingdom doubted, then found · the Shang and the Hittites','Oracle bones (recognized in 1899) and the digs at Yinxu (from 1928) matched Sima Qian’s list of Shang kings. The Bible often mentions the Hittites (Genesis 23; Uriah the Hittite in 2 Samuel 11), and some nineteenth-century scholars doubted them. From 1906, digs at Boğazköy in Turkey uncovered the Hittite capital and its royal archives. Compare: what turned each from “legend” into “history we can trust”?'],['Sacrifice · the royal tombs and Genesis 22','Beside the royal tombs at Yinxu lie more than a thousand sacrificial pits; the oracle bones often record only “Qiang” and a number. In Genesis 22:1–14, God stops Abraham from sacrificing Isaac: “God will provide for himself the lamb.” Compare: the Shang took others’ lives to please their ancestors; what does the God of the Bible do? (Going further: Romans 8:32.)']],
   more:'The Shang were afraid their ancestors would send disaster, so they tried to please them. What are people afraid of today? And what do they offer to “please” whatever they fear?'},
 close:{three:['Oracle bones turned the Shang dynasty from legend into history we can trust.','Oracle bone records are primary sources from the Shang themselves; bronzes were used mostly for sacrifice and war.','The Shang knew of a highest Di, but did not know him. Tomorrow is in God’s hands, and human sacrifice is hateful to God.'],
   award:'fuhaozun',awardSay:'The owl-shaped zun of Fu Hao. The name “Fu Hao” is cast inside it. More than three thousand years later, it matched the oracle bone records and bore witness for a queen.'},
 lib:[
  {scr:2,q:'Did Wang Yirong really find oracle bones in his medicine?',img:'wangyr',
   story:['The best-known story goes like this: in 1899, Wang Yirong fell ill with malaria, and his medicine included “dragon bones.” In the leftover medicine, he saw writing carved on the bones and recognized it as older than the writing on bronzes.',
    'It is a moving story, but it appeared late. Wang Yirong left no such record himself, and the earliest articles that tell it were written years after 1899.',
    'A more reliable account is this: antique dealers brought carved bone pieces from Henan and sold them to Wang Yirong, who loved ancient inscriptions. He recognized the writing and began buying up as many as he could.',
    'What we know for sure is not much, but it matters: he was one of the first to recognize oracle bone script and collect it on purpose. The next year, as foreign armies entered Beijing, he died for his country.'],
   tie:'However vivid a story is, we still ask: Who said this? How far was he from the event? These are the questions you learned earlier in this course.',
   think:'Why has the “found in medicine” story spread so widely? Why do people like stories like this?'},
  {scr:2,q:'How do you move a whole pit of oracle bones?',img:'yh127',
   story:['In June 1936, near the end of the thirteenth season of digging at Yinxu, archaeologists found a pit numbered YH127, packed with oracle bones, layer upon layer.',
    'Digging them out one by one would take a long time, and pieces might break. So they cut out the whole block of earth with the bones inside and boxed it in wooden planks.',
    'The block weighed several tons. Workers took several days to move it to the railway station, and from there it went all the way to Nanjing.',
    'Indoors, scholars cleaned it bit by bit and freed more than seventeen thousand pieces of oracle bones. It is the richest pit ever found at Yinxu.'],
   tie:'Archaeology is not only digging but keeping. Moving the whole pit kept a record of where every piece lay and what lay next to it.',
   think:'Why do archaeologists care so much about where a piece of oracle bone was found?'},
  {scr:2,q:'Why was Fu Hao’s tomb never robbed?',img:'fuhaotomb',
   story:['Almost all the great royal tombs at Yinxu were emptied by robbers long ago. In 1976, while digging northwest of Xiaotun, the archaeologist Zheng Zhenxiang found a tomb that was not very large.',
    'It was not in the royal cemetery. A building once stood over it, so the pit was hard to notice. Later the groundwater rose and flooded the lower part of the tomb, which also kept robbers away.',
    'Inside, the team found more than four hundred bronzes, more than seven hundred jade objects, and over six thousand cowrie shells. Many bronzes carried the name “Fu Hao.”',
    'Scholars then turned to the oracle bones: more than two hundred records mention Fu Hao. She led sacrifices and led armies. The tomb and the writing speak of the same woman.'],
   tie:'This is “two witnesses who never knew each other agree”: one is a record of divination from three thousand years ago, the other a tomb opened in 1976.',
   think:'If Fu Hao’s tomb had been robbed too, how much could we still know about her?'},
  {scr:3,q:'Was the Houmuwu ding buried twice?',img:'houmuwu',
   story:['In 1939, villagers in Wuguan, near Anyang, dug a huge bronze ding out of the ground. It was wartime, and the Japanese army held Anyang.',
    'When the occupiers heard about it, they came to buy it or take it. The villagers buried the great ding again, and handed over a small bronze instead.',
    'Only in 1946, after the war, was the ding dug up again. It is now in the National Museum of China. It stands 133 cm tall and weighs more than 800 kg, the heaviest Shang bronze known.',
    'Three characters are cast inside it. They used to be read “Simuwu”; most scholars now read them “Houmuwu.” A Shang king cast it for offerings to his mother.'],
   tie:'This ding was cast for sacrifice. “The great affairs of a state are sacrifice and war”: the Shang put their greatest effort into sacrifice.',
   think:'How many people would it take to cast a ding like this? What does that tell us about the Shang king’s power?'}
 ]
};

  {t:'order',q:'Put these four events in order.',items:['King Wu defeats King Zhou of Shang at Muye','The Duke of Zhou marches east and puts down the rebellion','Luoyi is built','The Duke of Zhou hands power back to King Cheng'],start:[2,0,3,1],

 v1:{src:'l5v1en.mp4',player:'l5v1pen.html',poster:'l5v1en.jpg',label:'Video 1 · Little Zhou and Great Shang · 4:18',
   quiz:[{q:'About the same battle of Muye, the Shiji says the Shang soldiers turned their weapons around, while another old text says “blood flowed until it floated the pestles.” How should we treat this?',opts:['One of the books must be fake','Old books tell the same event differently; compare them and look for other evidence','Neither can be trusted'],a:1,ok:'Mencius himself did not believe “blood floated the pestles.” When accounts differ, we compare them as careful readers of sources.',hint:'Mencius said, “If you believe everything in a book, it is better to have no book.”'},
         {q:'Where do the two characters for “China” (中国, Zhongguo) first appear, as far as we know today?',opts:['The Shiji','The He zun inscription, “宅兹中国”','The oracle bones'],a:1,ok:'The He zun inscription quotes King Wu: “I will dwell in this central land.” Here it means the area around Luoyang.',hint:'A bronze found in Baoji in 1963.'},
         {bq:1,q:'Where did the Zhou people first live?',opts:['The lower Yangzi','The Wei River valley, in today’s Shaanxi','Near today’s Beijing'],a:1,ok:'The Zhou lived on the plain below Mount Qi in the Wei River valley, and were known as farmers.',hint:'West of the Shang, along a river that flows into the Yellow River.'},
         {q:'Which king of Zhou defeated King Zhou of Shang at Muye?',opts:['King Wen','King Cheng','King Wu'],a:2,ok:'King Wu, the son of King Wen, won at Muye around 1046 BC.',hint:'The Li gui inscription names him.'},
         {q:'The Duke of Zhou built a new city to watch over the east. What was it called?',opts:['Luoyi','Hao','Anyang'],a:0,ok:'Luoyi, where Luoyang stands today. Hao, near Xi’an, was the older Zhou capital.',hint:'Today the city there is called Luoyang.'}],
   points:['The Zhou called themselves “little Zhou.” They lived on the plain below Mount Qi, in the Wei River valley.','Around 1046 BC, King Wu defeated King Zhou of Shang at Muye. The Li gui inscription, “King Wu campaigned against Shang; it was the morning of a jiazi day,” matches the old books.','After King Wu died, the Duke of Zhou ran the government, put down a rebellion in the east, and built Luoyi. The He zun inscription contains “宅兹中国.”','The Zhou sent relatives and loyal followers to set up states in many places. This is fengjian, granting land to lords: Lu, Qi, Yan, Wei, Jin…','The Zhou gave the land of Song to the Shang descendants so they could keep offering to their ancestors. The Zuo Zhuan says: “They granted lands to their kin, as a fence and screen for Zhou.”']},
 task1:{q:'Drag each of the six states under the kind of person it was given to.',
   bins:['Relatives of the Zhou king','A loyal follower','Descendants of the Shang'],
   why:['Relatives of the Zhou king: the king’s brothers, sons, and the descendants of his uncles.','A loyal follower: someone who helped the Zhou win, such as Jiang Taigong.','Descendants of the Shang: the Zhou let them keep offering to their own ancestors.'],
   cards:[{t:'Lu',src:'today Qufu, Shandong',b:0,img:'zhougong',say:'Lu was given to the son of the Duke of Zhou.'},
          {t:'Jin',src:'today southern Shanxi',b:0,img:'map',say:'Jin (first called Tang) was given to King Cheng’s brother.'},

          {t:'Qi',src:'today Linzi, Shandong',b:1,img:'map',say:'Qi was given to Jiang Taigong, who helped King Wu win.'},
          {t:'Song',src:'today Shangqiu, Henan',b:2,img:'map',say:'Song was given to Weizi, King Zhou of Shang’s elder brother. The Shang descendants kept offering to their ancestors there.'}],
   summary:'Most of the states were given to relatives, like a fence around the Zhou king. And the Zhou did not wipe out the Shang people.'},
 v2:{src:'l5v2en.mp4',player:'l5v2pen.html',poster:'l5v2en.jpg',label:'Video 2 · Family Lines and the Mandate of Heaven · 4:37',
   quiz:[{q:'Is “feudal society,” as people say today, the same as fengjian in the Zhou dynasty?',opts:['Yes','No. Zhou fengjian means granting land and setting up states','Both are just insults'],a:1,ok:'“Feudal society” and “feudal superstition” are modern uses. Zhou fengjian originally meant granting land and setting up states.',hint:'The video strikes a line through the modern words.'},
         {q:'The Zhou said, “Heaven’s mandate does not stay the same.” When the Duke of Shao said this to King Cheng, whom was he warning?',opts:['The Shang people','The Zhou king himself: lose virtue, and you lose the mandate','The common people'],a:1,ok:'“Did you notice? He was saying this to the Zhou king himself.”',hint:'As the Shang lost the mandate, so could the Zhou.'},
         {bq:1,q:'Under zongfa, who inherited the father’s position?',opts:['The youngest son','Any son the father liked best','The eldest son of the principal wife'],a:2,ok:'He was the “main line”; the other sons started “side lines.”',hint:'He is called the “main line.”'},
         {q:'About how many years after the early Zhou did the First Emperor of Qin replace fengjian with officials he sent himself?',opts:['About 80 years','About 800 years','About 8,000 years'],a:1,ok:'About eight hundred years later, Qin ruled through commanderies and counties.',hint:'The video says “about eight hundred years later.”'},
         {q:'Which book of the Bible says that God “removes kings and sets up kings”?',opts:['Daniel','Genesis','Acts'],a:0,ok:'Daniel 2:21. Daniel said this in Babylon.',hint:'He lived as a captive in Babylon.'}],
   points:['Zongfa: the eldest son inherited and was the “main line”; the other sons branched out as “side lines.” The Zhou king and most lords were relatives; the state was a family made larger.','Fengjian originally meant granting land and setting up states, with power spread among many hands. About eight hundred years later, Qin replaced it with commanderies and counties.','The Zhou explained their victory by the Mandate of Heaven, and warned themselves: “Heaven’s mandate does not stay the same.” Lose virtue, and you lose the mandate.','The Zhou said one more thing than the Shang: Heaven cares about virtue and cares for the people, and cannot be pleased by sacrifices alone.','Some of what the Zhou said sounds like the Bible: God “removes kings and sets up kings”; “the throne is established by righteousness.” But sounding alike is not being the same: who decides whether a king has virtue?']},
 task2:{tiers:[
   {h:'What held them together? Family lines',img:'zhougong',ref:'Zuo Zhuan, Duke Xi year 24',v:'They granted lands to their kin, as a fence and screen for Zhou.',s:'The king’s eldest son became king, and the other sons became lords; a lord’s eldest son became lord, and the other sons became ministers. When a lord met the king, he came as a subject before his ruler, and also as a side line before the main line.'},

   summary:'The Zhou bound the land together through family, explained their victory by the Mandate of Heaven, and warned themselves that the mandate does not stay the same. But who would finally judge whether a king had virtue? The Zhou had no settled answer.'},
 read:[
  {kind:'cls',tag:'Classical Chinese',book:'Book of Songs',bg:'dayuRub',origin:'“King Wen” in the Book of Songs is a Zhou poem praising King Wen. These lines speak of the descendants of the Shang and of the mandate.',
   text:'[[商之孙子，其{丽|lì: number}不{亿|yì: a hundred thousand; here, countless}。]]上帝既命，侯于周服。[[侯服于周，天命靡常。]]……[[{宜鉴于殷|yí jiàn yú Yīn: you should use Yin (Shang) as a mirror}，{骏命不易|jùn mìng bú yì: the great mandate is not easy to keep}。]]',
   plain:'The descendants of the Shang were beyond counting. But once the Lord on High gave his command, they submitted to Zhou. They submitted to Zhou: Heaven’s mandate does not stay the same. … You should use the Shang as a mirror: the great mandate is not easy to keep.',
   act:{type:'pick',q:'What did the Zhou learn from the end of the Shang? Tap it.',a:2,ok:'宜鉴于殷，骏命不易: “use the Shang as a mirror; the great mandate is not easy to keep.”',hint:'Look for 鉴, “mirror.”'}},
  {kind:'cls',tag:'Classical Chinese',book:'Book of Documents',bg:'shiji',origin:'The “Announcement of the Duke of Shao” in the Book of Documents records what the Duke of Shao said to the young King Cheng.',
   text:'[[我不可不{监|jiān: to look at, to learn from}于有夏，]][[亦不可不监于有殷。]]……[[惟不敬{厥|jué: their}德，]][[乃早{坠|zhuì: to lose, to drop}厥命。]]',
   plain:'We must learn from the Xia, and we must learn from the Yin (Shang). … Only because they did not honor their virtue did they lose their mandate early.',

  {kind:'scr',tag:'Scripture',origin:'King David has sinned, and God sends the prophet Nathan to him. Nathan first tells a story about a rich man who took a poor man’s little lamb, and David is furious.',ref:'2 Samuel 12:5–7',

  {kind:'short',q:'“Whoever wins can say the mandate is mine.” What is the problem with this idea? Answer in a sentence or two.',
   ref:'A possible answer: winning is not the same as being right. The Zhou knew the mandate “does not stay the same,” but with no one able to tell the king he was wrong, the winner could always claim it.'}
 ],
 essay:{q:'How did the Zhou hold the land together? Use what you learned in this lesson to write a paragraph.',
   starts:['The Zhou held the land together by','My evidence is (give one bronze inscription or one line from an old book):','Looking at it through the Bible,'],
   ev:[['Li gui inscription','King Wu campaigned against Shang. It was the morning of a jiazi day.'],['He zun inscription','宅兹中国: I will dwell in this central land.'],['Zuo Zhuan','They granted lands to their kin, as a fence and screen for Zhou.'],['Book of Songs, “King Wen”','Heaven’s mandate does not stay the same.'],['Book of Documents, “Announcement of the Duke of Shao”','Because they did not honor their virtue, they lost their mandate early.'],['Hebrews 1:1–2','Long ago, at many times and in many ways, God spoke to our fathers by the prophets, but in these last days he has spoken to us by his Son.']],
   summary:'The Zhou and the Bible differ in one important way. The Zhou believed Heaven cares about virtue, and the Book of Songs even says “the Lord on High spoke to King Wen.” But the Zhou had no law given by Heaven, and no prophet who could rebuke a king to his face in Heaven’s name. By the time of Mencius, people put it this way: “Heaven does not speak; it shows its will through deeds and events.” That left a gap: whoever won could say the mandate was his. The Zhou tried to close the gap by saying Heaven sees through the eyes of the people; but who speaks for the people was still unsettled. The God of the Bible spoke: there is the law, and there are prophets. When King David sinned, the prophet Nathan could rebuke him to his face in God’s name. Whether a king has virtue is decided neither by the king himself nor by whoever wins.',
   peers:['The Zhou held the land together by granting it to relatives and by family lines: relatives were sent out as lords, and when a lord met the king, he was also a side line meeting the main line. My evidence is the Zuo Zhuan: “They granted lands to their kin, as a fence and screen for Zhou.” Looking at it through the Bible, even a good system only lasts a few generations; when relatives grow distant, it no longer holds.','The Zhou held the land together by the idea of the Mandate of Heaven: Heaven gives the world to those who have virtue. My evidence is the Duke of Shao telling King Cheng that the Xia and the Shang lost the mandate because they did not honor their virtue. Looking at it through the Bible, God is not a Heaven that never speaks; the prophet Nathan could rebuke King David to his face.'],
   read:[['Losing the right to rule · China and Israel','The Zhou said Heaven’s mandate leaves a ruler who loses virtue (Book of Songs, “King Wen”). In 1 Samuel 15–16, God rejects King Saul and sends Samuel to anoint David. Compare the two: in each story, who announces that a ruler has lost his place, and on what grounds?'],['Two witnesses in bronze','The Li gui is in the National Museum of China, and the He zun in the Baoji Bronze Ware Museum. Both museums show the inscriptions online.'],['A king told he was wrong','Read the whole story of Nathan and David in 2 Samuel 11–12.']],
   more:'“The state was a family made larger.” What is good about ruling a country this way? What could go wrong?'},
 close:{three:['King Wu defeated the Shang at Muye, and a bronze from the ground confirmed the old books; the Duke of Zhou brought peace to the east and built Luoyi.','The Zhou bound the land together by granting it to relatives and by family lines; fengjian originally meant granting land and setting up states.','The Zhou said the mandate is not forever: lose virtue, and you lose the mandate. Who judges whether a king has virtue? The Bible has its answer.'],
   award:'hezun',awardSay:'The He zun. Its inscription quotes King Wu: “宅兹中国,” “I will dwell in this central land.” It is the earliest known use of the two characters for “China.”'},
 lib:[
  {scr:2,q:'How was the Li gui found?',img:'ligui',
   story:['In the spring of 1976, villagers in Lingkou, Lintong, Shaanxi, were leveling a field when they dug into a buried hoard of Western Zhou bronzes.',
    'One square-based gui had thirty-two characters cast inside it. When scholars read it, they were amazed: it began, “King Wu campaigned against Shang; it was the morning of a jiazi day.” The first character joins “Wu” and “king” into one.',
    'The man who cast it was named Li, an official close to King Wu. A few days after the battle of Muye, King Wu rewarded him with bronze, and he cast this gui to remember it.',
    'It is the only bronze known that records the very day King Wu defeated the Shang. The old books say a jiazi day, and the bronze from the ground says a jiazi day.'],
   tie:'Is there other evidence for what the old books say? The Li gui is a witness from the same time.',
   think:'Why would the man who cast it want that day cast into bronze?'},
  {scr:2,q:'Was the He zun almost melted down?',img:'hezun',
   story:['In 1963, a family in Jiacun, Baoji, Shaanxi, dug a bronze out of the earth bank behind their house and used it at home to store grain.',
    'Later, when times were hard, they sold it as scrap to a recycling station for thirty yuan.',
    'In 1965, a worker from the Baoji Museum saw it at the station, felt it was unusual, and bought it for the museum.',
    'Ten years later, while cleaning the rust from the bottom inside, scholars found an inscription of 122 characters, including “宅兹中国.”'],
   tie:'From a grain jar to the earliest witness of the word “China,” all that stood between was one person’s careful eye.',
   think:'What if that worker had not looked twice?'},
  {scr:3,q:'Why didn’t Mencius believe “blood floated the pestles”?',img:'mencius',
   story:['A chapter of the Book of Documents called “Wu Cheng” describes the battle of Muye and says “blood flowed until it floated the pestles.”',
    'When Mencius read this, he said: “If you believe everything in a book, it is better to have no book. Of ‘Wu Cheng,’ I accept only two or three strips.”',
    'His reason: a truly humane man has no enemy under heaven. When the most humane man attacks the least humane, how could blood float the pestles?',
    'Mencius reasoned from principle; he did not find new evidence. Scholars today would say: his courage to doubt is admirable, but doubt also needs evidence.'],
   tie:'Reading old books takes the courage to doubt and the patience to look for evidence.',
   think:'Do you think Mencius’s reason holds up? What evidence would you still need?'}
 ]
};
