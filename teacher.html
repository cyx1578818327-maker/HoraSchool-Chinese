<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>老师端 · 作业</title>
<style>
:root{--ink:#2a2118;--paper:#f7f0e1;--paper2:#efe4cc;--card:#fffaf0;--line:#d9c9a6;--accent:#a8321f;--gold:#b8893a;--jade:#2f5d50;--muted:#7a6a55;--ok:#2f6b45;--okbg:#e3efe4;--mid:#8a5a10;--midbg:#fbefd2;--lowbg:#f6dcd5;--bg:#efe6d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#efe5d2;--paper:#2a2219;--paper2:#352b20;--card:#30271d;--line:#4d3f2e;--muted:#b3a38a;--bg:#1c160f;--okbg:#20382a;--ok:#9fd3ae;--midbg:#43351a;--mid:#e9c37a;--lowbg:#4a2a24;--accent:#e2735e;--gold:#d6aa5c}}
:root[data-theme="dark"]{--ink:#efe5d2;--paper:#2a2219;--paper2:#352b20;--card:#30271d;--line:#4d3f2e;--muted:#b3a38a;--bg:#1c160f;--okbg:#20382a;--ok:#9fd3ae;--midbg:#43351a;--mid:#e9c37a;--lowbg:#4a2a24;--accent:#e2735e;--gold:#d6aa5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;letter-spacing:.06em}header h1 small{font-size:13px;color:var(--muted);font-weight:normal;margin-left:8px;letter-spacing:0}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.login{max-width:420px;margin:12vh auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h2{margin:0 0 6px}.login p{color:var(--muted);line-height:1.7;font-size:14px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:10px 0;font-size:16px}
.err{color:var(--accent);font-size:14px;min-height:1.4em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar select,.bar input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.seg button{border:0;background:var(--card);padding:6px 14px;cursor:pointer;font-size:14px}.seg button.on{background:var(--ink);color:var(--paper)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--muted)}
.wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--paper2);font-weight:600;font-size:13px}
th.l{text-align:center;min-width:76px}th .sub{display:block;font-weight:normal;color:var(--muted);font-size:11px}
td.nm{position:sticky;left:0;background:var(--paper);font-weight:600}td.nm small{display:block;font-weight:normal;color:var(--muted);font-size:12px}
td.c{text-align:center;padding:5px}
.cell{display:inline-block;min-width:60px;padding:5px 6px;border-radius:7px;cursor:pointer;border:1px solid transparent;line-height:1.25}
.cell:hover{border-color:var(--gold)}.cell small{display:block;font-size:11px;opacity:.85}
.hi{background:var(--okbg);color:var(--ok)}.md{background:var(--midbg);color:var(--mid)}.lo{background:var(--lowbg);color:var(--accent)}
.none{color:var(--line)}
.list tr{cursor:pointer}.list tr:hover td{background:var(--paper2)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--paper2);color:var(--muted)}
.dr{position:fixed;inset:0;background:rgba(20,12,4,.55);z-index:20;display:flex;justify-content:flex-end}
.panel{width:min(720px,100%);height:100%;overflow:auto;background:var(--paper);padding:22px 26px 60px;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
.panel h2{margin:0 0 4px;font-size:22px}.panel .meta{color:var(--muted);font-size:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.sec{margin:18px 0}.sec h3{font-size:15px;margin:0 0 8px;color:var(--muted);letter-spacing:.06em}
.sum{white-space:pre-wrap;line-height:1.8;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.essay{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.essay .q{font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.6}
.essay .t{white-space:pre-wrap;line-height:2;font-size:16px;text-indent:0}
.essay .n{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.panel textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;line-height:1.7}
.hist{font-size:13px;color:var(--muted)}.hist a{color:inherit;cursor:pointer;text-decoration:underline;margin-right:10px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:640px){header{padding:10px 16px}.panel{padding:18px 16px 60px}main{padding:14px 16px 60px}}
@media print{header,.bar,.stats,.wrap,.noprint{display:none!important}.dr{position:static;background:none}.panel{width:auto;height:auto;box-shadow:none;padding:0}body{background:#fff}}
</style></head><body>
<header><h1>老师端<small>必修二 · 互动课作业</small></h1><span class="sp"></span><span id="who" class="tag"></span>
<button class="btn" id="reload" hidden>刷新</button><button class="btn" id="logout" hidden>退出</button></header>
<main id="app"></main>
<script src="assets/config.js"></script>
<script>
const ORDER=["il1","il2","il3","il4","afg1","afg2","afg3","afg4","afg5"];
const SHORT={il1:"众神的争论",il2:"老王出城",il3:"夜入敌营",il4:"归还与葬礼",afg1:"蜀山兀",afg2:"宫中一日",afg3:"楚人一炬",afg4:"后人哀之",afg5:"全文复习"};
const GRP={il:"伊利亚特",afg:"阿房宫赋"};
const $=s=>document.querySelector(s);
function h(t,a,...c){const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(v==null||v===false)continue;if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else e.setAttribute(k,v)}for(const x of c.flat())if(x!=null&&x!==false)e.append(x.nodeType?x:String(x));return e}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let KEY=LS.get("afg-tkey")||"",ROWS=[],ST={cls:"",lesson:"",q:"",view:"grid",latest:true};
const URL0=window.SUBMIT_URL||"";
const fmt=t=>{const d=new Date(t);return isNaN(d)?String(t):`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const lvl=p=>p>=90?"hi":p>=80?"md":"lo";
const hanLen=s=>(s.match(/[一-鿿]/g)||[]).length;
const lname=r=>SHORT[r.lesson]||r.course||r.lesson;
const skey=r=>(r.cls||"")+"\u0001"+r.name;

function login(msg){$("#reload").hidden=$("#logout").hidden=true;$("#who").textContent="";
  const inp=h("input",{type:"password",placeholder:"老师密码",autocomplete:"current-password"});const err=h("div",{class:"err"},msg||"");
  const go=async()=>{KEY=inp.value.trim();if(!KEY)return;err.textContent="正在读取……";const r=await load();if(r===true){LS.set("afg-tkey",KEY);render()}else{err.textContent=r}};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  $("#app").replaceChildren(h("div",{class:"login"},h("h2",{},"老师端"),
    h("p",{},URL0?"输入你在 Apps Script 里设置的老师密码。学生交上来的作业保存在你自己的 Google 表格里，这个页面只在你输入密码后读取。":"还没有接上 Google 表格：请先按设置说明部署 Apps Script，再把网址填进 assets/config.js。"),
    inp,err,h("button",{class:"btn primary",onclick:go,disabled:URL0?null:"disabled"},"进入")));inp.focus()}

async function load(){if(!URL0)return "还没有设置表格网址。";
  try{const r=await fetch(URL0+"?key="+encodeURIComponent(KEY)+"&_="+Date.now());const j=await r.json();
    if(!j.ok)return j.err||"读取失败";ROWS=(j.rows||[]).map(x=>({...x,t:typeof x.t==="number"?x.t:Date.parse(x.t)||0}));return true}
  catch(e){return "连不上 Google 表格，请检查网络或部署设置。"}}

function filtered(){let rs=ROWS.slice().sort((a,b)=>b.t-a.t);
  if(ST.cls)rs=rs.filter(r=>r.cls===ST.cls);if(ST.lesson)rs=rs.filter(r=>r.lesson===ST.lesson);
  if(ST.q){const q=ST.q.trim();rs=rs.filter(r=>(r.name+r.cls).includes(q))}return rs}
function latestOf(rs){const m=new Map();for(const r of rs){const k=skey(r)+"\u0002"+r.lesson;if(!m.has(k))m.set(k,r)}return [...m.values()]}

function render(){$("#reload").hidden=$("#logout").hidden=false;$("#who").textContent=`共 ${ROWS.length} 份`;
  const classes=[...new Set(ROWS.map(r=>r.cls).filter(Boolean))].sort();
  const lessons=[...new Set(ROWS.map(r=>r.lesson))].sort((a,b)=>(ORDER.indexOf(a)+1||99)-(ORDER.indexOf(b)+1||99));
  const sel=(v,opts,ph,on)=>{const s=h("select",{onchange:e=>on(e.target.value)},h("option",{value:""},ph),opts.map(([k,t])=>{const o=h("option",{value:k},t);if(k===v)o.selected=true;return o}));return s};
  const seg=h("div",{class:"seg"},[["grid","总览"],["list","逐份"]].map(([k,t])=>h("button",{class:ST.view===k?"on":null,onclick:()=>{ST.view=k;render()}},t)));
  const q=h("input",{type:"search",placeholder:"搜索姓名",value:ST.q});q.addEventListener("input",()=>{ST.q=q.value;draw()});
  const bar=h("div",{class:"bar"},sel(ST.cls,classes.map(c=>[c,c]),"全部班级",v=>{ST.cls=v;render()}),
    sel(ST.lesson,lessons.map(l=>[l,(GRP[l.replace(/\d+$/,"")]||"")+" · "+(SHORT[l]||l)]),"全部课时",v=>{ST.lesson=v;render()}),q,h("span",{class:"sp"}),seg);
  const body=h("div",{id:"body"});
  $("#app").replaceChildren(bar,h("div",{class:"stats",id:"stats"}),body);draw()}

function draw(){const rs=filtered(),lt=latestOf(rs);const studs=new Set(lt.map(skey));
  const wr=lt.reduce((n,r)=>n+parseW(r).length,0);const avg=lt.length?Math.round(lt.reduce((n,r)=>n+(+r.pct||0),0)/lt.length):0;
  $("#stats").replaceChildren(...[[studs.size,"名学生"],[lt.length,"份作业（最新）"],[avg+"%","平均正确率"],[wr,"篇写一写"]].map(([b,s])=>h("div",{class:"stat"},h("b",{},b),h("span",{},s))));
  const body=$("#body");if(!rs.length){body.replaceChildren(h("div",{class:"empty"},ROWS.length?"没有符合条件的作业。":"还没有学生交作业。学生在课程里点「交给老师」后，就会出现在这里。"));return}
  ST.view==="grid"?grid(body,lt):list(body,rs)}

function grid(body,lt){const ls=[...new Set(lt.map(r=>r.lesson))].sort((a,b)=>(ORDER.indexOf(a)+1||99)-(ORDER.indexOf(b)+1||99));
  const by=new Map();for(const r of lt){const k=skey(r);if(!by.has(k))by.set(k,{cls:r.cls,name:r.name,m:{}});by.get(k).m[r.lesson]=r}
  const studs=[...by.values()].sort((a,b)=>(a.cls||"").localeCompare(b.cls||"","zh")||a.name.localeCompare(b.name,"zh"));
  const tb=h("table",{},h("thead",{},h("tr",{},h("th",{},"学生"),ls.map(l=>h("th",{class:"l"},SHORT[l]||l,h("span",{class:"sub"},GRP[l.replace(/\d+$/,"")]||""))))),
    h("tbody",{},studs.map(s=>h("tr",{},h("td",{class:"nm"},s.name,s.cls?h("small",{},s.cls):null),ls.map(l=>{const r=s.m[l];if(!r)return h("td",{class:"c"},h("span",{class:"none"},"—"));
      const n=parseW(r).length;return h("td",{class:"c"},h("span",{class:"cell "+lvl(+r.pct),title:fmt(r.t),onclick:()=>detail(r)},(+r.pct||0)+"%",h("small",{},(r.done?"完成":"未完")+(n?" · 写"+n:"")+(r.note?" · 已批":""))))})))));
  body.replaceChildren(h("div",{class:"wrap"},tb))}

function list(body,rs){const tb=h("table",{class:"list"},h("thead",{},h("tr",{},["时间","班级","姓名","课时","正确率","完成","写一写","批语"].map(t=>h("th",{},t)))),
  h("tbody",{},rs.map(r=>h("tr",{onclick:()=>detail(r)},h("td",{},fmt(r.t)),h("td",{},r.cls||""),h("td",{},r.name),h("td",{},lname(r)),
    h("td",{},h("span",{class:"cell "+lvl(+r.pct)},(+r.pct||0)+"%")),h("td",{},r.done?"✓":""),h("td",{},parseW(r).length||""),h("td",{},r.note?"✓":"")))));
  body.replaceChildren(h("div",{class:"wrap"},tb))}

function parseW(r){if(r._w)return r._w;try{r._w=JSON.parse(r.writing||"[]")}catch(e){r._w=[]}return r._w}

function detail(r){const hist=ROWS.filter(x=>skey(x)===skey(r)&&x.lesson===r.lesson).sort((a,b)=>b.t-a.t);
  const ws=parseW(r);const note=h("textarea",{placeholder:"写给这位同学的批语（保存在表格的「批语」一栏）"});note.value=r.note||"";
  const saved=h("span",{class:"hist"});
  const save=async()=>{saved.textContent="保存中……";try{const u=URL0+"?key="+encodeURIComponent(KEY)+"&act=note&row="+r.row+"&note="+encodeURIComponent(note.value);const j=await (await fetch(u)).json();
    if(j.ok){r.note=note.value;saved.textContent="已保存";draw()}else saved.textContent=j.err||"没有保存成功"}catch(e){saved.textContent="没有保存成功，请检查网络"}};
  const sumTxt=String(r.summary||"").replace(/\n?写一写：[\s\S]*$/,"");
  const dr=h("div",{class:"dr",onclick:e=>{if(e.target===dr)dr.remove()}},h("div",{class:"panel"},
    h("div",{class:"noprint",style:"display:flex;gap:8px;justify-content:flex-end"},h("button",{class:"btn",onclick:()=>print()},"打印"),h("button",{class:"btn",onclick:()=>dr.remove()},"关闭")),
    h("h2",{},r.name),h("div",{class:"meta"},`${r.cls||""} · ${GRP[String(r.lesson).replace(/\d+$/,"")]||""} ${lname(r)} · ${fmt(r.t)} 提交`),
    h("div",{class:"chips"},h("span",{class:"cell "+lvl(+r.pct)},"正确率 "+(+r.pct||0)+"%"),h("span",{class:"tag"},"首次正确率 "+(+r.fp||0)+"%"),h("span",{class:"tag"},"用时 "+(+r.min||0)+" 分钟"),h("span",{class:"tag"},r.done?"本课时完成":"未完成")),
    hist.length>1?h("div",{class:"hist"},`这一课时共交了 ${hist.length} 次：`,hist.map(x=>x===r?h("b",{style:"margin-right:10px"},fmt(x.t)):h("a",{onclick:()=>{dr.remove();detail(x)}},fmt(x.t)))):null,
    ws.length?h("div",{class:"sec"},h("h3",{},"写一写"),ws.map(w=>h("div",{class:"essay"},w.q?h("div",{class:"q"},w.q):null,h("div",{class:"t"},w.text),h("div",{class:"n"},hanLen(w.text)+" 字")))):null,
    h("div",{class:"sec"},h("h3",{},"学习记录"),h("div",{class:"sum"},sumTxt||"（无）")),
    h("div",{class:"sec noprint"},h("h3",{},"批语"),note,h("div",{style:"display:flex;gap:10px;align-items:center;margin-top:8px"},h("button",{class:"btn primary",onclick:save},"保存批语"),saved))));
  document.body.append(dr)}

$("#reload").onclick=async()=>{$("#who").textContent="刷新中……";const r=await load();r===true?render():login(r)};
$("#logout").onclick=()=>{LS.del("afg-tkey");KEY="";ROWS=[];login()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const d=document.querySelector(".dr");if(d)d.remove()}});
(async()=>{if(KEY&&URL0){$("#app").replaceChildren(h("div",{class:"empty"},"正在读取……"));const r=await load();r===true?render():login(r)}else login()})();
</script></body></html>
