<style>
:root{--paper:#F4EEE3;--card:#FFFDF8;--ink:#2B2A28;--sub:#6F665A;--line:#DDD3C2;--gold:#8A5A2B;--ok:#4F7A68;--no:#B5452F;--soft:#F3EADA}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1{font-family:"Noto Serif SC",serif;font-size:26px;margin:0}
.meta{color:var(--gold);font-size:13px;letter-spacing:.08em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.bar input,.bar select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}

.tabs button{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tabs button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
td:first-child{white-space:nowrap}.tw{overflow-x:auto;border-radius:12px}
th{background:var(--soft);font-weight:500;font-size:13px;color:var(--sub);white-space:nowrap;cursor:pointer}
tr.r:hover td{background:#FBF5EA;cursor:pointer}
.pb{height:8px;background:#EDE4D3;border-radius:6px;overflow:hidden;width:120px;margin-top:4px}.pb i{display:block;height:100%;background:var(--gold)}
.pb.full i{background:var(--ok)}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.good{color:var(--ok)}.bad{color:var(--no)}.mut{color:var(--sub)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
.sec h2{font-family:"Noto Serif SC",serif;font-size:19px;margin:0 0 4px}
.sec h3{font-size:15.5px;margin:14px 0 4px}
.ref{background:var(--soft);border-radius:8px;padding:7px 10px;font-size:14px;margin:6px 0 8px}
.ref b{color:var(--gold);font-weight:500;margin-right:6px}
.ans{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.ans .who{font-weight:500}.ans .who small{display:block;color:var(--sub);font-weight:400}
.ans .t{white-space:pre-wrap;word-break:break-word}
.ans .t span.f{color:var(--sub);font-size:12.5px;margin-right:4px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.miss{color:var(--no);border-color:var(--no)}
.opt{display:grid;grid-template-columns:28px 1fr 200px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.opt .bar2{height:18px;background:#EDE4D3;border-radius:5px;position:relative;overflow:hidden}.opt .bar2 i{position:absolute;inset:0 auto 0 0;background:#C9B48F}
.opt.right .bar2 i{background:var(--ok)}.opt.right b{color:var(--ok)}
.opt .names{grid-column:2/4;color:var(--sub);font-size:12.5px;margin-top:-3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:30px;text-align:center;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.sel{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
@media(max-width:720px){.ans{grid-template-columns:1fr}.opt{grid-template-columns:24px 1fr}.opt .bar2{grid-column:2}.two{grid-template-columns:1fr}.hide-s{display:none}}
</style></head><body><div class="wrap">

"}, {"k": "ref", "l": "Meeting: which verse", "ok": ["25:22"]}], "a": "The mercy seat; two cherubim at its ends, facing one another, wings spread over it; “There I will meet with you” (25:22)."}, {"tag": "Observe", "read": "Ex 26:31–35", "q": "Which two places does the veil divide? On which side is the table, and on which the lampstand?", "f": [{"k": "text", "l": "Divides what"}, {"k": "text", "l": "Table / lampstand"}, {"k": "ref", "l": "Verse giving the sides", "ok": ["26:35"]}], "a": "The Holy Place and the Most Holy (26:33); the table on the north, the lampstand on the south, opposite each other (26:35)."}, {"tag": "Observe", "read": "Ex 30:17–18", "q": "Between which two things is the basin placed?", "f": [{"k": "text", "l": "Between what"}], "a": "Between the tent of meeting and the altar (30:18)."}, {"tag": "Compare", "read": "Ex 25:9; 25:40; 26:30; 27:8", "q": "Read these four verses together. What idea is repeated in every one?", "f": [{"k": "text", "l": "The repeated idea"}], "a": "Make it according to the pattern God showed on the mountain — not as people think best."}, {"tag": "Discover", "read": "Ex 31:12–17", "q": "At the end of all these instructions, what does God speak about? What does he call it? Which verse?", "f": [{"k": "text", "l": "He speaks about"}, {"k": "ref", "l": "Which verse", "ok": ["31:13"]}], "a": "The Sabbath: a sign between God and Israel throughout their generations, that they may know the Lord sanctifies them (31:13)."}], [{"tag": "Observe", "read": "John 1:14", "q": "When the Word became flesh, what did he do?", "f": [{"k": "text", "l": "What he did"}], "a": "He “dwelt among us”."}, {"tag": "Compare", "read": "John 1:14 and Ex 25:8", "q": "Read these two verses together and find the shared idea. What do you notice?", "f": [{"k": "text", "l": "Shared idea"}, {"k": "text", "l": "I notice"}], "a": "Both speak of dwelling among / in the midst of people. In Exodus God would dwell among his people; John says that in Jesus God has come to dwell among us."}, {"tag": "Observe", "read": "John 2:19–21", "q": "Jesus said, “Destroy this temple.” What temple did he mean? Which verse tells us?", "f": [{"k": "text", "l": "The temple was"}, {"k": "ref", "l": "Which verse", "ok": ["2:21"]}], "a": "His body (John 2:21)."}, {"tag": "Compare", "read": "Ex 26:31–33 and Matt 27:51", "q": "What was the veil in the tabernacle for? When Jesus died, what happened to the temple curtain, and from where did it tear?", "f": [{"k": "text", "l": "Its purpose"}, {"k": "text", "l": "What happened"}], "a": "It divided the Holy Place from the Most Holy and kept people out (26:33); when Jesus died it was torn in two, from top to bottom (Matt 27:51)."}, {"tag": "Discover", "read": "Heb 10:19–20", "q": "By what do we have confidence to enter the holy places? What does the writer say the curtain is? Which verse?", "f": [{"k": "text", "l": "By what"}, {"k": "ref", "l": "Verse: the curtain is…", "ok": ["10:20"]}], "a": "By the blood of Jesus; the curtain is his flesh (Heb 10:20)."}]]}, "quiz": {"quiz-warm": {"title": "热身", "items": [{"q": "你去一位长辈家做客。从哪个门进、坐在哪里，通常由谁来定？", "o": ["主人", "客人自己", "随便", "邻居"]}, {"q": "学校要接待一位很重要的客人。他还没到，大家最先会准备什么？", "o": ["他要待的地方", "自己的午饭", "放学后的计划", "什么都不准备"]}, {"q": "一份家具说明书写着“必须照图组装”。如果你照自己的想法装，可能会怎样？", "o": ["装出来的不是设计的样子", "一定更好", "完全一样", "说明书没用"]}, {"q": "下面哪一种礼物最让人高兴？", "o": ["甘心乐意送的", "被逼着送的", "为了换好处送的", "随手扔下的"]}]}, "quiz-v1": {"title": "讲解一 小测", "items": [{"q": "神要造圣所的目的是什么？", "o": ["使他可以住在百姓中间", "给百姓一个开会的地方", "显出以色列的富有", "让埃及人害怕"]}, {"q": "伊甸园东边安设了什么，把守生命树的道路？（创 3:24）", "o": ["基路伯和发火焰的剑", "城墙", "一条大河", "十二块石头"]}, {"q": "出 29:45–46 说，神领以色列人出埃及，是为了什么？", "o": ["为要住在他们中间", "为要叫他们发财", "为要他们统治埃及", "为要他们回到吾珥"]}]}, "quiz-v2": {"title": "讲解二 小测", "items": [{"q": "神吩咐会幕，是从哪一件说起的？", "o": ["约柜", "院子的门", "燔祭坛", "帐幕的幔子"]}, {"q": "圣所里，桌子和灯台各放在哪一面？（出 26:35）", "o": ["桌子在北面，灯台在南面", "桌子在南面，灯台在北面", "都放在至圣所里", "都放在院子里"]}, {"q": "这几章里一再出现的一句话是什么？", "o": ["要照着在山上指示你的样式", "照你们喜欢的方式做", "越大越好", "和埃及的庙一样"]}]}, "quiz-v3": {"title": "讲解三 小测", "items": [{"q": "约 1:14 说道成了肉身，“住”在我们中间。这个“住”字原文的意思是什么？", "o": ["支搭帐幕", "盖一座宫殿", "住一个晚上", "搬家"]}, {"q": "耶稣死的时候，殿里的幔子怎样了？（太 27:51）", "o": ["从上到下裂为两半", "被火烧了", "被人拿走了", "从下到上撕开"]}, {"q": "来 10:20 说，那幔子就是什么？", "o": ["他的身体", "十诫", "会幕的门", "祭司的衣服"]}]}}, "openq": "以色列人已经被救出埃及，也和神立了约。神为什么还要他们造一座会幕？", "texts": [["open", "开课问题（上课前）", ""], ["close", "收束（上完课再答同一题）", ""], ["w1", "复述（合上书）", "从东门往里走，按顺序说出六件器物，并说出每一件在哪里。"], ["w2", "辨析", "“敬拜神，只要心里真诚就好，用什么方式都可以。”他说得对吗？"], ["m1", "读经文 · 经文说了什么", "出 25:8"], ["m2", "读经文 · 我要回到哪里查看", "29:45–46；40:34–35；约 1:14"], ["m3", "读经文 · 所以我该怎样做", ""], ["h1", "课后 · 画会幕：我画错了几处", ""], ["h2", "课后 · 讲给谁听", ""]], "pick": {"ark": "约柜", "table": "桌子", "lamp": "灯台", "incense": "香坛", "laver": "洗濯盆", "altar": "燔祭坛", "gate": "院门"}}, "19": {"name": "金牛犊", "screens": [["p-cover", "封面"], ["p-book0", "课本 · 先看一遍"], ["p-open", "开课问题"], ["p-warm1", "热身 · 等不及"], ["p-warm2", "热身 · 山上与山下"], ["p-s1", "先查经 · 讲解一"], ["p-v1v", "讲解一 · 山下"], ["p-c1", "对照 · 讲解一"], ["p-v1q", "讲解一 · 看完想一想"], ["p-book1", "课本 · 读完第一节"], ["p-v2g", "预测 · 你是摩西"], ["p-s2", "先查经 · 讲解二"], ["p-v2v", "讲解二 · 山上"], ["p-c2", "对照 · 讲解二"], ["p-v2q", "讲解二 · 看完想一想"], ["p-book2", "课本 · 读完第二节"], ["p-s3", "先查经 · 讲解三"], ["p-v3v", "讲解三 · 下山"], ["p-c3", "对照 · 讲解三"], ["p-v3q", "讲解三 · 看完想一想"], ["p-v3g", "身临其境 · 跟摩西下山"], ["p-ask", "审问亚伦"], ["p-w1", "想一想 · 复述"], ["p-w2", "想一想 · 辨析"], ["p-verse", "读经文"], ["p-close", "收束与课后"], ["p-look", "再看一眼"], ["p-exam", "综合练习"], ["p-book3", "课本 · 学完复习"], ["p-goals", "应知应会清单"]], "study": {"zh": [[{"tag": "观察", "read": "出 32:1–4", "q": "百姓为什么要亚伦作神像？哪一节说亚伦“用雕刻的器具作成”牛犊？", "f": [{"k": "text", "l": "为什么要神像"}, {"k": "ref", "l": "哪一节（写成 32:4 这样）", "ok": ["32:4"]}], "a": "要一个“可以在我们前面引路”的神，因为“那个摩西，我们不知道他遭了什么事”；32:4——是亚伦亲手铸、亲手刻的。"}, {"tag": "比较", "read": "出 24:3、7 和 32:8", "q": "百姓不久前在山下说过什么？32:8 神说他们“快快偏离了”什么？说的和做的，有什么不同？", "f": [{"k": "text", "l": "百姓说过"}, {"k": "text", "l": "快快偏离了", "m": 4}, {"k": "text", "l": "相同 / 不同"}], "a": "“耶和华所吩咐的，我们都必遵行”；“我所吩咐的道”。说的是“都必遵行”，做的是“快快偏离”——答应过的事，很快就放下了。"}, {"tag": "比较", "read": "出 20:4、20:23 和 32:5、8", "q": "金牛犊违背了 20 章哪一节？亚伦宣告明日要向谁守节？32:8 神说他们向谁下拜献祭？两处放在一起，你看见什么？", "f": [{"k": "ref", "l": "20 章哪一节（写成 20:4 这样）", "ok": ["20:4", "20:23"]}, {"k": "text", "l": "向谁守节", "m": 3}, {"k": "text", "l": "向谁下拜献祭", "m": 2}, {"k": "text", "l": "相同 / 不同"}], "a": "“不可为自己作金银的神像”（20:23；也可答 20:4）；“向耶和华守节”；32:8 神说他们“向它下拜献祭”——嘴上用耶和华的名，实际拜的是自己造的牛犊。"}, {"tag": "发现", "read": "出 25:2–3、8 和 32:2–4", "q": "两处都在收金子。各是为什么收的？你发现了什么？", "f": [{"k": "text", "l": "25 章为什么收"}, {"k": "text", "l": "32 章为什么收"}, {"k": "text", "l": "我发现"}], "a": "山上神要收“甘心乐意”的礼物造圣所，“使我可以住在他们中间”（25:8）；山下百姓拿金环造牛犊。同样的金子，一个照神的吩咐，一个照自己的意思。"}], [{"tag": "发现", "read": "出 20:2；32:1、4、7、11", "q": "“谁领他们出埃及？”五处经文各怎么说？每格写“谁说的 → 说是谁领出来的”，最后写你发现了什么。", "tbl": 1, "f": [{"k": "text", "l": "20:2", "m": 3, "ph": "谁说的 → 说是谁"}, {"k": "text", "l": "32:1", "m": 3, "ph": "谁说的 → 说是谁"}, {"k": "text", "l": "32:4", "m": 3, "ph": "谁说的 → 说是谁"}, {"k": "text", "l": "32:7", "m": 3, "ph": "谁说的 → 说是谁"}, {"k": "text", "l": "32:11", "m": 3, "ph": "谁说的 → 说是谁"}, {"k": "text", "l": "我发现"}], "a": "20:2 神说：是我（耶和华）；32:1 百姓说：那个摩西；32:4 百姓说：这牛犊；32:7 神对摩西说：是你；32:11 摩西对神说：是你。百姓把功劳给了摩西、又给了牛犊；神对摩西说“你的百姓”，摩西却把百姓交还给神——真正领他们出来的是耶和华。"}, {"tag": "比较", "read": "出 32:11–13 和 创 22:16–17", "q": "摩西求神的三个理由各是什么？他说神“指着自己起誓”，这誓在创世记 22 章哪一节？摩西的话和神当初的誓，有什么相同？", "f": [{"k": "text", "l": "理由一", "m": 4}, {"k": "text", "l": "理由二", "m": 4}, {"k": "text", "l": "理由三", "m": 4}, {"k": "ref", "l": "创 22 章哪一节（写成 22:16 这样）", "ok": ["22:16", "22:17"]}, {"k": "text", "l": "相同 / 不同"}], "a": "一、他们是你用大能的手领出来的；二、免得埃及人议论（关乎神在列国中的名声）；三、记念你对亚伯拉罕、以撒、以色列起的誓（创 22:16–17）。摩西几乎是把神自己说过的话，说回给神。"}, {"tag": "发现", "read": "出 32:14", "q": "结果怎样？经文在这里把百姓叫作“谁的百姓”？摩西有没有说“百姓其实还不错”？他凭的是什么？", "f": [{"k": "text", "l": "结果"}, {"k": "text", "l": "“___的百姓”", "m": 2}, {"k": "text", "l": "他凭的是"}], "a": "“于是耶和华后悔，不把所说的祸降与他的百姓”——经文说“他的百姓”，他们仍是神的百姓。摩西没有一个理由说百姓好，他凭的是神的作为、神在列国中的名声和神的应许。"}], [{"tag": "观察", "read": "出 32:19–20", "q": "摩西对法版做了什么？对牛犊做了什么？", "f": [{"k": "text", "l": "对法版"}, {"k": "text", "l": "对牛犊"}], "a": "扔在山下摔碎了；用火焚烧、磨得粉碎、撒在水面上，叫以色列人喝。"}, {"tag": "比较", "read": "出 32:11 和 32:19", "q": "32:11 摩西问神：“你为什么向你的百姓发烈怒呢？”32:19 摩西自己怎样了？两处有什么相同、有什么不同？", "f": [{"k": "text", "l": "32:19 摩西", "m": 3}, {"k": "text", "l": "相同 / 不同"}], "a": "32:19 摩西自己也“发烈怒”，把版摔碎了。都是对百姓的罪发怒；在山上，摩西求神不要发怒，到了营前亲眼看见，他自己也发烈怒——百姓的罪是真实的、严重的。"}, {"tag": "比较", "read": "出 32:4 和 32:21–24", "q": "亚伦先把责任推给谁（32:22）？他说牛犊是怎么来的？32:4 却说是怎样作成的？", "f": [{"k": "text", "l": "先推给谁", "m": 2}, {"k": "text", "l": "亚伦说"}, {"k": "text", "l": "32:4 说"}, {"k": "text", "l": "不同在哪里"}], "a": "先推给百姓：“这百姓专于作恶”（32:22）；又说“我把金子扔在火中，这牛犊便出来了”（32:24）；32:4 说是他“铸了……用雕刻的器具作成”。亚伦说得好像牛犊是自己出来的，经文却说是他亲手作的。"}, {"tag": "比较", "read": "出 32:30；提前 2:5；来 7:25", "q": "摩西说他要上去做什么？他说的哪两个字表示他也说不准？提前 2:5 说在神和人中间的中保是谁？来 7:25 说这位中保能拯救到什么地步？", "f": [{"k": "text", "l": "要去做什么", "m": 4}, {"k": "text", "l": "哪两个字", "m": 2}, {"k": "text", "l": "中保是谁", "m": 4}, {"k": "text", "l": "能拯救到", "m": 2}, {"k": "text", "l": "相同 / 不同"}], "a": "为他们赎罪；“或者”；降世为人的基督耶稣；“拯救到底”。都站在神和人中间；摩西只能说“或者”，基督长远活着，替我们祈求，能拯救到底。"}]], "en": [[{"tag": "Observe", "read": "Ex 32:1–4", "q": "Why did the people want Aaron to make gods? Which verse says Aaron fashioned the calf with a graving tool?", "f": [{"k": "text", "l": "Why gods"}, {"k": "ref", "l": "Which verse (write like 32:4)", "ok": ["32:4"]}], "a": "Gods “who shall go before us,” because “as for this Moses… we do not know what has become of him”; 32:4 — Aaron cast and carved it himself."}, {"tag": "Compare", "read": "Ex 24:3, 7 and 32:8", "q": "What had the people said not long before? In 32:8, what had they “turned aside quickly” out of? How is what they said different from what they did?", "f": [{"k": "text", "l": "They had said"}, {"k": "text", "l": "Turned aside from", "m": 4}, {"k": "text", "l": "Same / different"}], "a": "“All that the LORD has spoken we will do”; “the way that I commanded them.” They said “we will do” and did “turned aside quickly” — what they promised, they quickly dropped."}, {"tag": "Compare", "read": "Ex 20:4, 20:23 and 32:5, 8", "q": "Which verse in chapter 20 did the calf break? To whom did Aaron proclaim a feast? In 32:8, to what did God say they bowed and sacrificed? Put together, what do you see?", "f": [{"k": "ref", "l": "Which verse in ch. 20 (write like 20:4)", "ok": ["20:4", "20:23"]}, {"k": "text", "l": "A feast to", "m": 3}, {"k": "text", "l": "Sacrificed to", "m": 2}, {"k": "text", "l": "Same / different"}], "a": "“Nor shall you make for yourselves gods of gold” (20:23; 20:4 also fits); “a feast to the LORD”; 32:8 “worshiped it and sacrificed to it” — the LORD’s name on their lips, a calf of their own making before their eyes."}, {"tag": "Discover", "read": "Ex 25:2–3, 8 and 32:2–4", "q": "Gold is collected in both places. Why each time? What do you notice?", "f": [{"k": "text", "l": "Why in ch. 25"}, {"k": "text", "l": "Why in ch. 32"}, {"k": "text", "l": "I notice"}], "a": "On the mountain, willing gifts for the sanctuary, “that I may dwell in their midst” (25:8); below, earrings for a calf. The same gold — one as God commanded, one their own way."}], [{"tag": "Discover", "read": "Ex 20:2; 32:1, 4, 7, 11", "q": "“Who brought them out of Egypt?” What does each of the five verses say? In each box write “who says it → who they say brought them out,” then write what you notice.", "tbl": 1, "f": [{"k": "text", "l": "20:2", "m": 3, "ph": "who says → who"}, {"k": "text", "l": "32:1", "m": 3, "ph": "who says → who"}, {"k": "text", "l": "32:4", "m": 3, "ph": "who says → who"}, {"k": "text", "l": "32:7", "m": 3, "ph": "who says → who"}, {"k": "text", "l": "32:11", "m": 3, "ph": "who says → who"}, {"k": "text", "l": "I notice"}], "a": "20:2 God: I (the LORD); 32:1 the people: this Moses; 32:4 the people: this calf; 32:7 God to Moses: you; 32:11 Moses to God: you. The people gave the credit to Moses, then to a calf; God said to Moses “your people,” but Moses handed them back to God — it was the LORD who brought them out."}, {"tag": "Compare", "read": "Ex 32:11–13 and Gen 22:16–17", "q": "What are Moses’ three reasons? He says God “swore by your own self” — which verse of Genesis 22? What is the same between Moses’ words and God’s oath?", "f": [{"k": "text", "l": "Reason 1", "m": 4}, {"k": "text", "l": "Reason 2", "m": 4}, {"k": "text", "l": "Reason 3", "m": 4}, {"k": "ref", "l": "Which verse of Gen 22 (write like 22:16)", "ok": ["22:16", "22:17"]}, {"k": "text", "l": "Same / different"}], "a": "1. You brought them out with a mighty hand; 2. do not let the Egyptians say… (how God is spoken of among the nations); 3. remember your oath to Abraham, Isaac and Israel (Gen 22:16–17). Moses was almost saying God’s own words back to him."}, {"tag": "Discover", "read": "Ex 32:14", "q": "What happened? Here, whose people does the text call them? Did Moses ever say “the people are not so bad”? What did he rely on?", "f": [{"k": "text", "l": "What happened"}, {"k": "text", "l": "“___ people”", "m": 2}, {"k": "text", "l": "He relied on"}], "a": "“The LORD relented from the disaster that he had spoken of bringing on his people” — “his people”: they are still God’s people. None of Moses’ reasons praised the people; he relied on God’s deeds, how God is spoken of among the nations, and God’s promise."}], [{"tag": "Observe", "read": "Ex 32:19–20", "q": "What did Moses do with the tablets? With the calf?", "f": [{"k": "text", "l": "The tablets"}, {"k": "text", "l": "The calf"}], "a": "Broke them at the foot of the mountain; burned it, ground it to powder, scattered it on the water and made the people drink it."}, {"tag": "Compare", "read": "Ex 32:11 and 32:19", "q": "In 32:11 Moses asked God, “Why does your wrath burn hot against your people?” What happened to Moses himself in 32:19? What is the same, and what is different?", "f": [{"k": "text", "l": "Moses in 32:19", "m": 3}, {"k": "text", "l": "Same / different"}], "a": "In 32:19 Moses’ own “anger burned hot,” and he broke the tablets. Both are anger at the people’s sin; on the mountain Moses asked God not to burn with anger, but when he saw it with his own eyes he burned with anger too — the people’s sin was real and serious."}, {"tag": "Compare", "read": "Ex 32:4 and 32:21–24", "q": "Whom did Aaron blame first (32:22)? How did he say the calf came about? What does 32:4 say?", "f": [{"k": "text", "l": "Blamed first", "m": 2}, {"k": "text", "l": "Aaron said"}, {"k": "text", "l": "32:4 says"}, {"k": "text", "l": "The difference"}], "a": "The people: “they are set on evil” (32:22); then “I threw it into the fire, and out came this calf” (32:24); 32:4: he “fashioned it with a graving tool.” Aaron made it sound as if the calf came out by itself; the text says he made it."}, {"tag": "Compare", "read": "Ex 32:30; 1 Tim 2:5; Heb 7:25", "q": "What was Moses going up to do? Which word shows he could not be sure? Who is the mediator in 1 Tim 2:5? In Heb 7:25, how far can this mediator save?", "f": [{"k": "text", "l": "Going up to", "m": 4}, {"k": "text", "l": "Which word", "m": 2}, {"k": "text", "l": "The mediator", "m": 4}, {"k": "text", "l": "Saves", "m": 2}, {"k": "text", "l": "Same / different"}], "a": "To make atonement for their sin; “perhaps”; the man Christ Jesus; “to the uttermost.” Both stand between God and people; Moses could only say “perhaps,” but Christ always lives to intercede and saves to the uttermost."}]]}, "quiz": {"quiz-warm": {"title": "热身", "items": [{"q": "你和朋友约好在校门口见，过了四十分钟他还没来，也联系不上。哪种做法最离谱？", "o": ["随便拉一个路人，就当他是那个朋友", "再等一会儿，或者去问问认识他的同学", "不等了，给他留个言，然后自己先回家"]}, {"q": "朋友出远门前给你留了一张他的照片。哪种说法最对？", "o": ["照片能让我想起他，但照片不是他", "他不在的时候，照片就等于他本人了", "照片拍得越像，就越能代替他本人"]}, {"q": "你签了班规，第一条是“上课不用手机”。一周后你上课用了，心里想“我还是很尊重老师的”。这算不算违反班规？", "o": ["算——要看做没做到，不只看心里", "不算——只要心里真的尊重老师就行", "不算——才用了一次，下次注意就好"]}]}, "quiz-v1": {"title": "讲解一 小测", "items": [{"q": "百姓为什么要亚伦作神像？", "o": ["摩西迟延不下山，要一个在前面引路的", "他们想回埃及去，要一个带他们回去的神", "亚伦先提议的，百姓就照他的话去做了"]}, {"q": "亚伦在牛犊面前筑坛，宣告“明日要向谁守节”？", "o": ["向耶和华守节", "向这牛犊守节", "向埃及的神守节"]}, {"q": "神在 20:23 刚吩咐过：不可为自己作什么？", "o": ["金银的神像", "凿成的石坛", "木头的神像"]}]}, "quiz-v2": {"title": "讲解二 小测", "items": [{"q": "神说“你的百姓，就是你从埃及地领出来的”（32:7），这里的“你”是指谁？", "o": ["摩西", "亚伦", "约书亚"]}, {"q": "下面哪一句不是摩西代求时说的？", "o": ["他们已经知道自己犯了罪", "这百姓是你从埃及领出来的", "免得埃及人议论你的作为", "记念你对先祖起过的誓"]}, {"q": "32:14 说结果怎样？", "o": ["耶和华不把所说的祸降与他的百姓", "耶和华只留下摩西和他一家的人", "耶和华仍然把这些百姓全都灭绝了"]}]}, "quiz-v3": {"title": "讲解三 小测", "items": [{"q": "两块法版上的字是谁写的？", "o": ["神写的，刻在版上", "摩西照神的话写上的", "约书亚帮摩西刻上的"]}, {"q": "亚伦怎样向摩西解释牛犊的来历？", "o": ["说他把金子扔进火里，牛犊便出来了", "说是他用雕刻的器具，亲手作成的牛犊", "说是百姓自己铸好，送到他面前来的"]}, {"q": "摩西说“凡属耶和华的，都要到我这里来”，谁聚集到他那里？", "o": ["利未的子孙", "犹大的子孙", "约书亚和长老"]}]}}, "exam": {"items": [{"q": "百姓聚集到谁那里，要求作神像？", "o": ["亚伦", "户珥", "约书亚", "七十位长老"]}, {"q": "亚伦用什么作牛犊？", "o": ["百姓耳上的金环", "为会幕献上的金子", "亚伦自己存下的金子", "摩西留在营里的金子"]}, {"q": "百姓对着牛犊说了什么？", "o": ["“这是领你出埃及地的神”", "“这是住在我们中间的神”", "“这是在西奈山上的神”", "“这是亚伯拉罕的神”"]}, {"q": "第二天百姓做了什么？", "o": ["献祭，坐下吃喝，起来玩耍", "禁食祷告，坐着等摩西下山", "拆了营帐，动身往埃及回去", "一起上山，要去寻找摩西"]}, {"q": "神对摩西说，要使谁的后裔成为大国？", "o": ["摩西", "亚伦", "约书亚", "利未"]}, {"q": "摩西求神记念哪几位先祖？", "o": ["亚伯拉罕、以撒、以色列", "亚伯拉罕、以撒、以实玛利", "亚伯拉罕、罗得、以撒", "挪亚、亚伯拉罕、以撒"]}, {"q": "约书亚听见营中的声音，以为是什么？", "o": ["争战的声音", "歌唱的声音", "哀哭的声音", "吹角的声音"]}, {"q": "摩西怎样处理那只牛犊？", "o": ["焚烧、磨碎，撒在水面叫百姓喝", "打碎以后，埋在了西奈山的山脚下", "熔化以后，把金子都还给百姓", "摔碎以后，扔进营外的大火里"]}, {"q": "32:7 神对摩西说“你的百姓”，32:11 摩西对神说“你的百姓”，32:14 经文说“他的百姓”。放在一起，最能看出什么？", "o": ["摩西把百姓交还给神，求神记念自己的作为", "神不再承认他们，要摩西从此单独负责这百姓", "摩西和神都在推卸，谁也不愿意要这百姓", "经文只是换着说法，三处的意思完全一样"]}, {"q": "25 章和 32 章都在收金子。放在一起，最能看出什么？", "o": ["同样献金子，一处照神的吩咐，一处照自己的意思", "百姓在山下献的金子，比山上神要的还要多得多", "两处都说是为了敬拜耶和华，所以神也都同样悦纳", "山下的金子后来又被收了回去，用来造了约柜"]}, {"q": "摩西代求的理由，哪一组全对？", "o": ["你领他们出来；免得埃及人议论；你对先祖的誓", "你领他们出来；百姓已经悔改；你对先祖的誓", "免得埃及人议论；百姓不懂律法；亚伦已经认错", "百姓已经悔改；百姓人数很多；我会管好他们"]}, {"q": "把亚伦的两种说法放在一起，哪一句最准确？", "o": ["32:4 说他用雕刻的器具作成，32:24 他却说牛犊自己出来了", "32:4 和 32:24 都说，牛犊是亚伦用雕刻的器具亲手作成的", "32:4 说是百姓铸的，32:24 亚伦才承认是自己亲手作出来的", "32:4 和 32:24 都说，牛犊是从火里自己出来的，不是谁作的"]}, {"q": "为什么说拜金牛犊是“背约”，而不只是“敬拜方式不对”？", "o": ["神刚说不可作金银的神像，他们也答应遵行，却照自己的意思造了", "他们献的是燔祭和平安祭，不是神在律法里吩咐他们献的赎罪祭", "他们趁摩西不在，另外立亚伦作首领，背弃了神所立的摩西的带领", "他们一天里又吃又喝又玩耍，把安息日当作平常的日子，没有守为圣"]}, {"q": "把 32:30 和来 7:25 放在一起，最能看出什么？", "o": ["摩西也说不准，只说“或者”；基督长远活着，能拯救到底", "摩西其实已经赎了罪，来 7:25 只是把同一件事再说一遍", "两处都说明，只要有人替我们祈求，罪就一定会被赦免", "新约告诉我们，摩西就是神和人中间唯一的那一位中保"]}, {"q": "小林想为一个犯了错的朋友祷告。照摩西代求的样子，哪一种最接近？", "o": ["求神照他的应许和怜悯，记念这个朋友", "先列出朋友做过的好事，求神看在这些好事上", "告诉神他已经后悔了，所以神应该赦免他", "向神保证以后会好好看着他，不让他再犯"]}]}, "openq": "以色列人在山下亲口说“耶和华所吩咐的，我们都必遵行”，四十天后怎么就造了金牛犊？这件事到底错在哪里？", "ver": "2", "tmin": 6, "plead": [["这百姓是你用大力和大能的手从埃及地领出来的", 1], ["为什么使埃及人议论说，他领他们出去，是要降祸与他们", 1], ["求你记念你的仆人亚伯拉罕、以撒、以色列，你曾指着自己起誓", 1], ["求你只罚亚伦，饶了这百姓，因为牛犊是他用金子铸的", 0], ["他们在埃及作奴仆，受了许多的苦，求你体谅他们的软弱", 0], ["他们已经知道自己犯了罪，求你看他们悔改的心，赦免他们", 0]], "texts": [["open", "开课问题（上课前）", ""], ["close", "收束（上完课再答同一题）", ""], ["w1", "复述（合上书）", "按“山下 → 山上 → 下山”说出 32:1–30 的经过。"], ["w2", "辨析", "“他们说的是‘向耶和华守节’，所以问题不大。”对吗？"], ["exw0", "综合练习 · 简答 1", "以色列人说“明日要向耶和华守节”，为什么神仍说他们“快快偏离了我所吩咐的道”？至少引两处经文（写节号）。", [[1, "指出他们确实用了耶和华的名（32:5）"], [2, "指出神已吩咐“不可为自己作金银的神像”，并引 20:4 或 20:23"], [1, "指出百姓答应过“都必遵行”（24:3 或 24:7）"], [2, "说出结论：他们向牛犊“下拜献祭”（32:8），照自己的意思敬拜，就是背约，不只是方式不对"]]], ["exw1", "综合练习 · 简答 2", "摩西代求凭的是什么？这对你为别人祷告有什么提醒？", [[3, "说出三个理由，每个 1 分：神领他们出来；免得埃及人议论；神对先祖的誓（32:11–13）"], [1, "指出摩西没有凭百姓好"], [2, "联系自己：为别人祷告凭神的应许和怜悯，并靠着基督（来 7:25）；说得具体"]]], ["descWhy", "下山 · 摩西为什么也发烈怒（写一句，不判对错）", "32:11、19"], ["askWhy", "审问亚伦 · 哪部分是真的、哪部分在推卸（不判对错）", "32:1、4–5、22–24"], ["m1", "读经文 · 经文说了什么", "出 32:30"], ["m2", "读经文 · 我要回到哪里查看", "32:11–14；提前 2:5；来 7:25"], ["m3", "读经文 · 我要为谁祈求、凭什么", ""], ["h1", "课后 · 谁听了", ""], ["h2", "课后 · 家人怎么说", ""]]}, "20": {"name": "你若不亲自和我同去", "screens": [["p-cover", "封面"], ["p-book0", "课本 · 先看一遍"], ["p-open", "开课问题"], ["p-warm1", "热身 · 礼物和人"], ["p-warm2", "热身 · 仍然给的、不给的"], ["p-s1", "先查经 · 讲解一"], ["p-v1v", "讲解一 · 涂抹我的名"], ["p-c1", "对照 · 讲解一"], ["p-v1q", "讲解一 · 看完想一想"], ["p-book1", "课本 · 读完第一节"], ["p-s2", "先查经 · 讲解二"], ["p-v2v", "讲解二 · 我自己不同去"], ["p-c2", "对照 · 讲解二"], ["p-v2q", "讲解二 · 看完想一想"], ["p-door", "身临其境 · 站在帐棚门口"], ["p-book2", "课本 · 读完第二节"], ["p-pred", "预测 · 如果你是摩西"], ["p-s3", "先查经 · 讲解三"], ["p-v3v", "讲解三 · 亲自同去"], ["p-c3", "对照 · 讲解三"], ["p-v3q", "讲解三 · 看完想一想"], ["p-w1", "想一想 · 复述"], ["p-w2", "想一想 · 辨析"], ["p-verse", "读经文"], ["p-close", "收束与课后"], ["p-look", "再看一眼"], ["p-exam", "综合练习"], ["p-book3", "课本 · 学完复习"], ["p-goals", "应知应会清单"]], "study": {"zh": [[{"tag": "观察", "read": "出 32:30–31", "q": "摩西回到耶和华那里，开口先承认了什么？他说百姓“为自己作了”什么？", "f": [{"k": "text", "l": "先承认"}, {"k": "text", "l": "为自己作了", "m": 2}], "a": "“唉！这百姓犯了大罪”；“为自己作了金像”。摩西没有替百姓找理由。"}, {"tag": "观察", "read": "出 32:32", "q": "摩西求神的第一件事是什么？“不然”以后又求什么？", "f": [{"k": "text", "l": "第一件"}, {"k": "text", "l": "不然"}], "a": "“倘或你肯赦免他们的罪”；“求你从你所写的册上涂抹我的名”。", "note": "“册”：记着属神之人名字的册子。"}, {"tag": "比较", "read": "出 32:32 和 32:33", "q": "摩西说要涂抹谁的名？神说要涂抹谁的名？两处有什么相同、不同？", "f": [{"k": "text", "l": "摩西说", "m": 3}, {"k": "text", "l": "神说", "m": 4}, {"k": "text", "l": "相同 / 不同"}], "a": "摩西愿意涂抹自己的名；神说“谁得罪我，我就从我的册上涂抹谁的名”。都说到“册上的名”。所以：摩西的心意是真的，可是神没有接受他替百姓被涂抹。"}, {"tag": "发现", "read": "出 32:34 和 23:20", "q": "32:34 神说谁必在前面引路？23 章哪一节早就应许过这件事？32:34 后半句又加了什么？", "f": [{"k": "text", "l": "谁在前面引路", "m": 3}, {"k": "ref", "l": "23 章哪一节（写成 23:20 这样）", "ok": ["23:20", "23:23"]}, {"k": "text", "l": "后半句加了"}], "a": "“我的使者必在你前面引路”；23:20（23:23 也说“我的使者要在你前面行”）；“只是到我追讨的日子，我必追讨他们的罪”。使者是早就应许的；神自己去不去，下一段才说清楚。", "note": "“追讨”：追究罪，施行惩罚。"}], [{"tag": "观察", "read": "出 33:1–3", "q": "神仍然应许了哪几样？哪一节说神自己不去？为什么不去？", "f": [{"k": "text", "l": "仍然应许"}, {"k": "ref", "l": "哪一节（写成 33:3 这样）", "ok": ["33:3"]}, {"k": "text", "l": "为什么不去"}], "a": "那地、使者、撵出迦南人、流奶与蜜之地；33:3；“因为你们是硬着颈项的百姓，恐怕我在路上把你们灭绝”。", "note": "“硬着颈项”：像不肯低头的牛，形容固执、不肯顺服。"}, {"tag": "比较", "read": "出 25:8 和 33:3", "q": "25:8 神说要怎样？33:3 神又说什么？两处有什么相同、不同？", "f": [{"k": "text", "l": "25:8"}, {"k": "text", "l": "33:3"}, {"k": "text", "l": "相同 / 不同"}], "a": "“使我可以住在他们中间”；“我自己不同你们上去”。都说到神和百姓在不在一起。所以：罪使神的同在成了危险——神不去，是“恐怕我在路上把你们灭绝”。"}, {"tag": "观察", "read": "出 33:4–6", "q": "百姓把神这话叫作什么？听见以后怎样？", "f": [{"k": "text", "l": "叫作", "m": 2}, {"k": "text", "l": "听见以后"}], "a": "“凶信”；悲哀，没有人佩戴妆饰，把身上的妆饰摘得干净。"}, {"tag": "发现", "read": "出 33:7–11", "q": "摩西把帐棚支搭在哪里？云柱怎样？百姓在哪里下拜？耶和华怎样与摩西说话？", "tbl": 1, "f": [{"k": "text", "l": "帐棚", "m": 3}, {"k": "text", "l": "云柱", "m": 3}, {"k": "text", "l": "百姓", "m": 3}, {"k": "text", "l": "说话", "m": 3}], "a": "营外，“离营却远”；降下来，立在会幕门前；各人在自己帐棚的门口下拜；“面对面……好像人与朋友说话一般”。神没有离开，可是他离营很远。"}], [{"tag": "观察", "read": "出 33:12–13", "q": "摩西说神吩咐他做什么，却没有叫他知道什么？他求神的两件事是什么？", "f": [{"k": "text", "l": "没有叫他知道"}, {"k": "text", "l": "求的两件事"}], "a": "“将这百姓领上去”，却没有叫他知道要打发谁与他同去；“求你将你的道指示我”“求你想到这民是你的民”。"}, {"tag": "比较", "read": "出 33:3 和 33:14", "q": "前面神说什么？现在神说什么？两处有什么相同、不同？", "f": [{"k": "text", "l": "33:3"}, {"k": "text", "l": "33:14"}, {"k": "text", "l": "相同 / 不同"}], "a": "“我自己不同你们上去”；“我必亲自和你同去，使你得安息”。都在说神去不去；33:14 的“你”是单数，先对摩西说，33:15–17 摩西再求神与“我们”同去。所以：神的同在是摩西代求求回来的。", "note": "“得安息”：得着平安，可以歇息。"}, {"tag": "发现", "read": "出 33:15–16", "q": "摩西说神若不亲自同去就怎样？什么使他们“与地上的万民有分别”？", "f": [{"k": "text", "l": "若不同去"}, {"k": "text", "l": "有分别是因为"}], "a": "“就不要把我们从这里领上去”；“因你与我们同去”。不是更好、更多、更强，是神同在。"}, {"tag": "比较", "read": "出 25:8 和 约 1:14", "q": "约 1:14 说道成了肉身，怎样了？和 25:8 有什么相同？", "f": [{"k": "text", "l": "约 1:14"}, {"k": "text", "l": "相同 / 不同"}], "a": "“住在我们中间”；都说神要住在人中间——25:8 是在会幕里，约 1:14 是神亲自成了人。所以：神住在人中间这条线，最后在耶稣身上成全。"}]], "en": [[{"tag": "Observe", "read": "Ex 32:30–31", "q": "When Moses returned to the LORD, what did he admit first? What did he say the people had made for themselves?", "f": [{"k": "text", "l": "He admitted"}, {"k": "text", "l": "Made for themselves", "m": 2}], "a": "“Alas, this people has sinned a great sin”; “gods of gold.” Moses made no excuses for them."}, {"tag": "Observe", "read": "Ex 32:32", "q": "What was the first thing Moses asked? After “but if not,” what did he ask?", "f": [{"k": "text", "l": "First"}, {"k": "text", "l": "But if not"}], "a": "“If you will forgive their sin”; “please blot me out of your book that you have written.”", "note": "“Your book”: the record God keeps of the names of his people."}, {"tag": "Compare", "read": "Ex 32:32 and 32:33", "q": "Whose name did Moses ask to be blotted out? Whose name did God say he would blot out? What is the same, and what is different?", "f": [{"k": "text", "l": "Moses said", "m": 3}, {"k": "text", "l": "God said", "m": 4}, {"k": "text", "l": "Same / different"}], "a": "Moses offered his own name; God said, “Whoever has sinned against me, I will blot out of my book.” Both speak of names in the book. So: Moses meant it, but God did not accept him being blotted out in their place."}, {"tag": "Discover", "read": "Ex 32:34 and 23:20", "q": "In 32:34, who will go before Moses? Which verse in chapter 23 had already promised this? What does the second half of 32:34 add?", "f": [{"k": "text", "l": "Who goes before", "m": 3}, {"k": "ref", "l": "Which verse in ch. 23 (write like 23:20)", "ok": ["23:20", "23:23"]}, {"k": "text", "l": "It adds"}], "a": "“My angel shall go before you”; 23:20 (23:23 also says “my angel goes before you”); “in the day when I visit, I will visit their sin upon them.” The angel was promised earlier; whether God himself would go becomes clear in the next section.", "note": "“Visit their sin”: hold them to account and punish it."}], [{"tag": "Observe", "read": "Ex 33:1–3", "q": "What did God still promise? Which verse says God himself will not go? Why not?", "f": [{"k": "text", "l": "Still promised"}, {"k": "ref", "l": "Which verse (write like 33:3)", "ok": ["33:3"]}, {"k": "text", "l": "Why not"}], "a": "The land, an angel, the Canaanites driven out, milk and honey; 33:3; “for you are a stiff-necked people, lest I consume you on the way.”", "note": "“Stiff-necked”: like an ox that will not bend its neck — stubborn, refusing to obey."}, {"tag": "Compare", "read": "Ex 25:8 and 33:3", "q": "What did God say in 25:8? What does he say in 33:3? What is the same, and what is different?", "f": [{"k": "text", "l": "25:8"}, {"k": "text", "l": "33:3"}, {"k": "text", "l": "Same / different"}], "a": "“That I may dwell in their midst”; “I will not go up among you.” Both are about God being with his people. So: sin made God’s presence dangerous — he would not go “lest I consume you on the way.”"}, {"tag": "Observe", "read": "Ex 33:4–6", "q": "What did the people call God’s words? What did they do when they heard them?", "f": [{"k": "text", "l": "They called it", "m": 2}, {"k": "text", "l": "They"}], "a": "A “disastrous word”; they mourned, no one put on ornaments, they stripped themselves of them."}, {"tag": "Discover", "read": "Ex 33:7–11", "q": "Where did Moses pitch the tent? What did the pillar of cloud do? Where did the people worship? How did the LORD speak with Moses?", "tbl": 1, "f": [{"k": "text", "l": "The tent", "m": 3}, {"k": "text", "l": "The cloud", "m": 3}, {"k": "text", "l": "The people", "m": 3}, {"k": "text", "l": "Speaking", "m": 3}], "a": "Outside the camp, “far off from the camp”; it came down and stood at the tent entrance; each at his own tent door; “face to face, as a man speaks to his friend.” God had not left, but he was far from the camp."}], [{"tag": "Observe", "read": "Ex 33:12–13", "q": "What had God told Moses to do, and what had he not let him know? What two things did Moses ask?", "f": [{"k": "text", "l": "Not let him know"}, {"k": "text", "l": "Two requests"}], "a": "“Bring up this people,” but not whom he would send with him; “show me now your ways” and “consider too that this nation is your people.”"}, {"tag": "Compare", "read": "Ex 33:3 and 33:14", "q": "What did God say before? What does he say now? What is the same, and what is different?", "f": [{"k": "text", "l": "33:3"}, {"k": "text", "l": "33:14"}, {"k": "text", "l": "Same / different"}], "a": "“I will not go up among you”; “My presence will go with you, and I will give you rest.” Both are about whether God goes; in 33:14 “you” is singular, spoken to Moses, and in 33:15–17 Moses asks for God to go with “us.” So: God’s presence came back through Moses’ pleading.", "note": "“Rest”: peace, a place to settle and stop wandering."}, {"tag": "Discover", "read": "Ex 33:15–16", "q": "What did Moses say if God’s presence would not go? What made them “distinct from every other people”?", "f": [{"k": "text", "l": "If not"}, {"k": "text", "l": "Distinct because"}], "a": "“Do not bring us up from here”; “your going with us.” Not better, bigger or stronger — God with them."}, {"tag": "Compare", "read": "Ex 25:8 and John 1:14", "q": "John 1:14 says the Word became flesh and did what? What does it share with 25:8?", "f": [{"k": "text", "l": "John 1:14"}, {"k": "text", "l": "Same / different"}], "a": "“Dwelt among us”; both say God will dwell among people — in 25:8 in the tabernacle, in John 1:14 by becoming a man himself. So: the line of God dwelling among people is fulfilled in Jesus."}]]}, "quiz": {"quiz-warm": {"title": "热身", "items": [{"q": "你要去外地上一所很好的学校。父母说：学费、宿舍、零用钱都给你安排好了，只是以后我们不再见你。你会怎么想？", "o": ["东西再好，也比不上和他们在一起", "太好了，要的东西一样也不少，真划算", "只要钱够用，见不见都一样"]}, {"q": "好朋友犯了错要被开除，你对校长说：“要开除就开除我吧。”校长怎样回答最合理？", "o": ["谁犯的错，就由谁自己来承担", "好，那就开除你，把他留下来吧", "那就把你们两个一起都开除"]}, {"q": "怎样最能看出一个人把你当作真正的朋友？", "o": ["他愿意和你在一起，对你说心里话", "他常常给你买东西，而且每次都不少", "他把你的名字写在自己的名单上"]}]}, "quiz-v1": {"title": "讲解一 小测", "items": [{"q": "摩西回到耶和华那里，开口先说了什么？", "o": ["这百姓犯了大罪，为自己作了金像", "这百姓已经悔改了，求你不要追究", "这都是亚伦的错，百姓是被他带坏的"]}, {"q": "32:32 摩西求神：“倘或你肯……”什么？", "o": ["赦免他们的罪", "免去他们的灾", "再给他们一次机会"]}, {"q": "神怎样回答摩西？", "o": ["谁得罪我，我就从我的册上涂抹谁的名", "好，我就涂抹你的名，饶了这一群的百姓", "我要把所有人的名都从册上涂抹掉"]}]}, "quiz-v2": {"title": "讲解二 小测", "items": [{"q": "33:3 神说自己不同去，是什么原因？", "o": ["他们是硬着颈项的百姓，恐怕在路上灭绝他们", "他们人数太多了，神要另外拣选一部分人同去", "会幕还没有造好，神在路上没有地方可住"]}, {"q": "百姓听见这话以后，没有人佩戴什么？", "o": ["妆饰", "鞋子", "外衣"]}, {"q": "摩西进营外的会幕时，百姓怎样？", "o": ["各人在自己帐棚门口下拜", "都跟着摩西进到会幕里面", "聚集到亚伦那里一同献祭"]}]}, "quiz-v3": {"title": "讲解三 小测", "items": [{"q": "33:14 神怎样回答摩西？", "o": ["我必亲自和你同去，使你得安息", "我必差遣使者与你同去，在路上保护你", "我必赐给你更多的地和牛羊群"]}, {"q": "33:15 摩西说，神若不亲自同去怎样？", "o": ["就不要把我们从这里领上去", "我们就自己上去取那一块地", "就请你另外差遣一位使者"]}, {"q": "33:12 摩西说，神没有叫他知道什么？", "o": ["要打发谁与我同去", "要领百姓走哪一条路", "要在哪一天动身上去"]}]}}, "exam": {"items": [{"q": "摩西第二天对百姓说，他上耶和华那里去“或者”可以做什么？", "o": ["为你们赎罪", "为你们求地", "为你们求食物", "为你们另立首领"]}, {"q": "32:34 神说，到什么时候必追讨他们的罪？", "o": ["到我追讨的日子", "到他们进了那地", "到摩西死的时候", "到他们的第四代"]}, {"q": "32:34 神说，谁必在摩西前面引路？", "o": ["我的使者", "云柱火柱", "约书亚", "亚伦和户珥"]}, {"q": "33:1 神说，他曾向哪几位先祖起誓应许那地？", "o": ["亚伯拉罕、以撒、雅各", "亚伯拉罕、以撒、以实玛利", "亚伯拉罕、罗得、以撒", "挪亚、亚伯拉罕、以撒"]}, {"q": "33:6 说，以色列人从住在哪里以后，就把身上的妆饰摘得干净？", "o": ["何烈山", "西奈旷野", "以琳", "利非订"]}, {"q": "33:9 摩西进会幕的时候，云柱降下来，立在哪里？", "o": ["会幕的门前", "会幕的顶上", "营的中间", "摩西的身后"]}, {"q": "33:11 约书亚是谁的儿子？", "o": ["嫩的儿子", "耶孚尼的儿子", "户珥的儿子", "亚伦的儿子"]}, {"q": "33:14 神说“我必亲自和你同去”，还说要使摩西得什么？", "o": ["安息", "尊荣", "长寿", "胜利"]}, {"q": "把 32:32 和 32:33 放在一起，最能看出什么？", "o": ["摩西愿意替百姓被涂抹，神却说谁得罪他就涂抹谁", "摩西愿意替百姓被涂抹，神就赦免了全体的百姓们", "摩西只求神赦免自己，神却说要涂抹所有的百姓", "摩西求神涂抹亚伦的名，神说只涂抹犯了罪的人"]}, {"q": "33:1–3 神仍然给了什么、不给什么？哪一组最准确？", "o": ["那地、使者、流奶与蜜都给，只是神自己不同去", "那地、流奶与蜜都给，只是不再差遣使者在前引路", "神仍然同去，只是要等百姓摘下妆饰以后", "那地和使者都给，只是要先在旷野住四十年"]}, {"q": "把 25:8、33:3、33:14 连起来，最能看出什么？", "o": ["神要住在他们中间，后来说不去，代求后又答应同去", "神一直都说要同去，只是改由使者代替他在前面引路", "神先说不去，后来因为百姓摘下妆饰，才答应同去", "神要住在他们中间，后来改为只在营外会幕里说话"]}, {"q": "会幕支在营外、“离营却远”，最能说明什么？", "o": ["神没有离开，可是他不在营的中间，而在营外", "会幕太大了，营里放不下，只好支在营的外面", "营外的会幕，是给外邦人来敬拜神的地方", "摩西想和神单独说话，所以不让百姓走近"]}, {"q": "33:16 摩西说以色列和万民有分别，分别在哪里？", "o": ["神与他们同去，他们才与万民不同", "他们有了律法，别的民族都没有律法", "他们人数众多，比别的民族强大", "他们出了埃及，别的民族没经历"]}, {"q": "有人说：“神离我们很远。”把 33:14 和约 1:14 放在一起，可以怎样回答？", "o": ["神答应同去，后来更亲自成了肉身住在我们中间", "神确实很远，所以要靠使者替我们去求他", "只要有一座会幕，神就会离我们近一点", "约 1:14 只是在说会幕，和这个问题无关"]}, {"q": "一位同学考试前只祷告“求神让我考好”，从来没想过要神同在。照 33:15，哪一种提醒最接近？", "o": ["神给的东西再好，也比不上神自己与我们同在", "只要祷告得够多够诚恳，神就一定会让他考好", "求考好是不对的，只该求神赦免，不要求别的", "先努力读书，祷告是考完以后才需要做的事"]}]}, "openq": "如果神说：“应许之地照样给你，使者照样在前面保护你，只是我自己不和你同去”——你会接受吗？为什么？", "ver": "2", "tmin": 6, "plead": [["人在何事上得知我和你的百姓在你眼前蒙恩呢？岂不是因你与我们同去", 1], ["求你将你的道指示我，使我可以认识你；求你想到这民是你的民", 1], ["有你的使者在前面，我们就放心上去了", 0], ["求你先把那流奶与蜜之地赐给我们", 0], ["我们不再硬着颈项，求你信我们这一次", 0], ["求你另拣选一个民，我留在这里事奉你", 0]], "pleadT": "预测 · 如果你是摩西（查经三之前，不计分；✓ 是摩西真正说的）", "texts": [["open", "开课问题（上课前）", ""], ["close", "收束（上完课再答同一题）", ""], ["w1", "复述（合上书）", "按“山上代求 → 神不同去 → 营外会幕 → 摩西再求”说出 32:30–33:17 的经过。"], ["w2", "辨析", "“只要能进迦南地，又有使者保护，神去不去没那么要紧。”对吗？"], ["exw0", "综合练习 · 简答 1", "神在 33:3 并不是什么都不给了，为什么百姓还把这话叫作“凶信”？至少引两处经文（写节号）。", [[1, "说出神仍然给的：那地、使者、流奶与蜜之地（33:1–3）"], [2, "说出神自己不同去，以及原因“硬着颈项的百姓”（33:3）"], [1, "联系 25:8：神本来要住在他们中间"], [2, "结论：没有神同在，地和保护都不是最要紧的（33:4 或 33:15–16）"]]], ["exw1", "综合练习 · 简答 2", "摩西在 32:32 和 33:12–16 各求什么？神在 32:33 和 33:14、17 各怎样回答？两次有什么不同？", [[1, "32:32：求神赦免，不然涂抹我的名"], [1, "32:33：谁得罪我，就涂抹谁（神没有接受摩西替百姓）"], [1, "33:13–16：求神想到这民是你的民；你若不亲自同去，就不要领我们上去"], [1, "33:14、17：我必亲自和你同去；你这所求的我也要行"], [2, "说出不同：第一次神没有接受摩西替百姓被涂抹；第二次摩西求神同在，神答应了"]]], ["descWhy", "帐棚门口 · 为什么只能远远站着（写一句，不判对错）", "33:3、7"], ["m1", "读经文 · 经文说了什么", "出 33:15–16"], ["m2", "读经文 · 我要回到哪里查看", "33:3、14；25:8；约 1:14"], ["m3", "读经文 · 只想要礼物的事，怎样祈求", ""], ["h1", "课后 · 谁听了", ""], ["h2", "课后 · 家人怎么说", ""]]}, "21": {"name": "求你显出你的荣耀", "screens": [["p-cover", "封面"], ["p-book0", "课本 · 先看一遍"], ["p-open", "开课问题"], ["p-warm1", "热身 · 认识一个人"], ["p-warm2", "热身 · 两次石版"], ["p-s1", "先查经 · 讲解一"], ["p-v1v", "讲解一 · 求你显出你的荣耀"], ["p-c1", "对照 · 讲解一"], ["p-v1q", "讲解一 · 看完想一想"], ["p-rock", "身临其境 · 在磐石穴中"], ["p-book1", "课本 · 读完第一节"], ["p-pred", "预测 · 神会怎样介绍自己"], ["p-s2", "先查经 · 讲解二"], ["p-v2v", "讲解二 · 耶和华的名"], ["p-c2", "对照 · 讲解二"], ["p-v2q", "讲解二 · 看完想一想"], ["p-name", "拼出这个名"], ["p-book2", "课本 · 读完第二节"], ["p-s3", "先查经 · 讲解三"], ["p-v3v", "讲解三 · 脸上的光"], ["p-c3", "对照 · 讲解三"], ["p-v3q", "讲解三 · 看完想一想"], ["p-shine", "身临其境 · 山下迎接摩西"], ["p-w1", "想一想 · 复述"], ["p-w2", "想一想 · 辨析"], ["p-verse", "读经文"], ["p-close", "收束与课后"], ["p-look", "再看一眼"], ["p-exam", "综合练习"], ["p-book3", "课本 · 学完复习"], ["p-goals", "应知应会清单"]], "study": {"zh": [[{"tag": "观察", "read": "出 33:18–19", "q": "摩西求看什么？神答应在他面前经过的是什么？还要宣告什么？", "f": [{"k": "text", "l": "摩西求看", "m": 2}, {"k": "text", "l": "经过的是", "m": 3}, {"k": "text", "l": "宣告", "m": 2}], "a": "“你的荣耀”；“我一切的恩慈”；“我的名”。所以：摩西求看荣耀，神给他的是恩慈和名。", "note": "“恩慈”：神的美善、好意。"}, {"tag": "观察", "read": "出 33:20", "q": "神为什么不让摩西看见他的面？", "f": [{"k": "text", "l": "因为"}], "a": "“因为人见我的面不能存活。”所以：不是神不愿意被认识，是有罪的人承受不住神完全的荣耀。"}, {"tag": "发现", "read": "出 33:21–23", "q": "神叫摩西站在哪里？荣耀经过时把他放在哪里？他最后得见什么、不得见什么？", "tbl": 1, "f": [{"k": "text", "l": "站在", "m": 3}, {"k": "text", "l": "放在", "m": 3}, {"k": "text", "l": "得见 / 不得见", "m": 4}], "a": "磐石上；磐石穴中；得见神的背，却不得见神的面。所以：神亲自保护摩西，让他看见他能承受的那一部分。"}, {"tag": "比较", "read": "出 32:16 和 34:1、4", "q": "第一次的石版是谁作的、谁写的？第二次呢？两次有什么相同、不同？", "f": [{"k": "text", "l": "第一次", "m": 4}, {"k": "text", "l": "第二次", "m": 4}, {"k": "text", "l": "相同 / 不同"}], "a": "第一次“是神的工作，字是神写的”；第二次摩西凿出石版，“其上的字我要写在这版上”。字都是神写的；石版一次是神作的，一次是摩西凿的。所以：约被打破了，神愿意重新写。"}], [{"tag": "观察", "read": "出 34:5–6", "q": "耶和华在哪里降临？他宣告自己是怎样的神？（写出至少三样）", "f": [{"k": "text", "l": "在哪里降临", "m": 2}, {"k": "text", "l": "怎样的神"}], "a": "在云中降临；有怜悯有恩典，不轻易发怒，有丰盛的慈爱和诚实。", "note": "“诚实”：信实、靠得住，说了就做。"}, {"tag": "发现", "read": "出 34:7", "q": "把 34:7 分成两半：神会做的是什么？神“万不”做的是什么？", "tbl": 1, "f": [{"k": "text", "l": "会做的"}, {"k": "text", "l": "万不做的", "m": 4}], "a": "为千万人存留慈爱，赦免罪孽、过犯和罪恶；万不以有罪的为无罪。所以：神的慈爱和公义在同一个名里。", "note": "“万不以有罪的为无罪”：绝不把有罪的当作没有罪。"}, {"tag": "比较", "read": "出 34:7 和 20:5–6", "q": "慈爱存留给多少人？追讨到几代？20:5–6 说追讨的是什么人、慈爱给什么人？", "f": [{"k": "text", "l": "慈爱 / 追讨", "m": 4}, {"k": "text", "l": "20:5–6"}], "a": "千万人；三四代。追讨“恨我的”，慈爱给“爱我、守我诫命的”。所以：慈爱远远多过追讨。", "note": "“追讨”：追究罪，施行惩罚。"}, {"tag": "观察", "read": "出 34:8–9", "q": "摩西听完做了什么？他求了哪三件事？", "f": [{"k": "text", "l": "做了什么", "m": 3}, {"k": "text", "l": "三件事"}], "a": "急忙伏地下拜；求神在我们中间同行，赦免我们的罪孽和罪恶，以我们为你的产业。所以：摩西抓住神刚宣告的名来求。"}], [{"tag": "观察", "read": "出 34:12–14", "q": "神不许他们和谁立约？要怎样对待他们的坛和柱像？34:14 说耶和华的名叫什么？", "f": [{"k": "text", "l": "不可立约"}, {"k": "text", "l": "坛和柱像"}, {"k": "text", "l": "名为", "m": 2}], "a": "那地的居民；拆毁他们的祭坛，打碎他们的柱像；忌邪者。所以：神要他们只敬拜他。", "note": "“忌邪”：专一的爱，不容别的神分走他的百姓。"}, {"tag": "发现", "read": "出 34:18–26", "q": "在这几节里找一条你在第 23 章也读到过的吩咐，写出 34 章的节号。", "f": [{"k": "text", "l": "哪一条"}, {"k": "ref", "l": "34 章哪一节（写成 34:21 这样）", "ok": ["34:18", "34:19", "34:20", "34:21", "34:22", "34:23", "34:24", "34:25", "34:26"]}], "a": "例如：守除酵节（34:18；23:15），第七日安息（34:21；23:12），一年三次朝见（34:23；23:17），初熟之物送到殿（34:26；23:19）。所以：重新立的约，就是原来的约。"}, {"tag": "观察", "read": "出 34:29–30", "q": "摩西的面皮为什么发光？他自己知道吗？百姓看见以后怎样？", "f": [{"k": "text", "l": "为什么发光"}, {"k": "text", "l": "知道吗", "m": 2}, {"k": "text", "l": "百姓"}], "a": "因耶和华和他说话；不知道；亚伦和众人怕挨近他。"}, {"tag": "发现", "read": "出 34:33–35", "q": "摩西什么时候蒙上帕子？什么时候揭去帕子？", "f": [{"k": "text", "l": "蒙上"}, {"k": "text", "l": "揭去"}], "a": "和百姓说完了话就蒙上；进到耶和华面前与他说话就揭去，出来传话时百姓看见他的脸发光，然后再蒙上。所以：光是从和神说话来的。"}]], "en": [[{"tag": "Observe", "read": "Ex 33:18–19", "q": "What did Moses ask to see? What did God say he would make pass before him? What would he proclaim?", "f": [{"k": "text", "l": "Moses asked to see", "m": 2}, {"k": "text", "l": "Pass before him", "m": 2}, {"k": "text", "l": "Proclaim", "m": 2}], "a": "“Your glory”; “all my goodness”; “my name.” So: Moses asked for glory; God gave him his goodness and his name.", "note": "“Goodness”: God’s kindness and good will."}, {"tag": "Observe", "read": "Ex 33:20", "q": "Why would God not let Moses see his face?", "f": [{"k": "text", "l": "Because"}], "a": "“For man shall not see me and live.” So: it is not that God does not want to be known; sinful people cannot bear his full glory."}, {"tag": "Discover", "read": "Ex 33:21–23", "q": "Where did God tell Moses to stand? Where would he put him while his glory passed? What would Moses see, and not see?", "tbl": 1, "f": [{"k": "text", "l": "Stand", "m": 2}, {"k": "text", "l": "Put him", "m": 2}, {"k": "text", "l": "See / not see", "m": 3}], "a": "On the rock; in a cleft of the rock; he would see God’s back, but not his face. So: God himself protected Moses and let him see what he could bear."}, {"tag": "Compare", "read": "Ex 32:16 and 34:1, 4", "q": "Who made and who wrote the first tablets? The second? What is the same and what is different?", "f": [{"k": "text", "l": "First", "m": 3}, {"k": "text", "l": "Second", "m": 3}, {"k": "text", "l": "Same / different"}], "a": "The first were “the work of God, and the writing was the writing of God”; the second Moses cut, and God said, “I will write on these tablets.” God wrote both; the stone was once God’s work, once cut by Moses. So: the covenant was broken, yet God was willing to write it again."}], [{"tag": "Observe", "read": "Ex 34:5–6", "q": "Where did the LORD descend? What kind of God did he proclaim himself to be? (Write at least three things.)", "f": [{"k": "text", "l": "Descended in", "m": 2}, {"k": "text", "l": "What kind of God"}], "a": "In the cloud; merciful and gracious, slow to anger, abounding in steadfast love and faithfulness.", "note": "“Faithfulness”: reliable — he does what he says."}, {"tag": "Discover", "read": "Ex 34:7", "q": "Split 34:7 into two halves: what does God do? What will he “by no means” do?", "tbl": 1, "f": [{"k": "text", "l": "He does"}, {"k": "text", "l": "By no means", "m": 3}], "a": "Keeps steadfast love for thousands, forgives iniquity and transgression and sin; by no means clears the guilty. So: God’s love and his justice are in one name.", "note": "“By no means clear the guilty”: never treat the guilty as if they were innocent."}, {"tag": "Compare", "read": "Ex 34:7 and 20:5–6", "q": "For how many is steadfast love kept? To how many generations is iniquity visited? In 20:5–6, on whom is it visited, and to whom is love shown?", "f": [{"k": "text", "l": "Love / visiting", "m": 3}, {"k": "text", "l": "20:5–6"}], "a": "Thousands; the third and fourth generation. Visiting is on “those who hate me”; love is for “those who love me and keep my commandments.” So: love far outweighs judgment.", "note": "“Visit iniquity”: hold sin to account and punish it."}, {"tag": "Observe", "read": "Ex 34:8–9", "q": "What did Moses do after hearing the name? What three things did he ask?", "f": [{"k": "text", "l": "He did", "m": 3}, {"k": "text", "l": "Three requests"}], "a": "He quickly bowed his head to the earth and worshiped; he asked the Lord to go in their midst, to pardon their iniquity and sin, and to take them for his inheritance. So: Moses held on to the very name God had just proclaimed."}], [{"tag": "Observe", "read": "Ex 34:12–14", "q": "With whom must they make no covenant? What must they do to their altars and pillars? In 34:14, what is the LORD’s name?", "f": [{"k": "text", "l": "No covenant with"}, {"k": "text", "l": "Altars and pillars"}, {"k": "text", "l": "Name", "m": 1}], "a": "The inhabitants of the land; tear down their altars and break their pillars; Jealous. So: God wants them to worship him alone.", "note": "“Jealous”: faithful love that will not let other gods take his people."}, {"tag": "Discover", "read": "Ex 34:18–26", "q": "Find one command here that you also read in chapter 23. Write its verse number in chapter 34.", "f": [{"k": "text", "l": "Which command"}, {"k": "ref", "l": "Which verse in ch. 34 (e.g. 34:21)", "ok": ["34:18", "34:19", "34:20", "34:21", "34:22", "34:23", "34:24", "34:25", "34:26"]}], "a": "For example: the Feast of Unleavened Bread (34:18; 23:15), rest on the seventh day (34:21; 23:12), appearing three times a year (34:23; 23:17), firstfruits to the house of the LORD (34:26; 23:19). So: the renewed covenant is the same covenant."}, {"tag": "Observe", "read": "Ex 34:29–30", "q": "Why did Moses’ face shine? Did he know? What did the people do?", "f": [{"k": "text", "l": "Why it shone"}, {"k": "text", "l": "Did he know", "m": 1}, {"k": "text", "l": "The people"}], "a": "Because he had been talking with God; he did not know; Aaron and the people were afraid to come near him."}, {"tag": "Discover", "read": "Ex 34:33–35", "q": "When did Moses put the veil on? When did he take it off?", "f": [{"k": "text", "l": "Put it on"}, {"k": "text", "l": "Took it off"}], "a": "When he finished speaking with the people; when he went in before the LORD to speak with him — and when he came out and spoke, the people saw his shining face, then he put the veil back. So: the light came from talking with God."}]]}, "quiz": {"quiz-warm": {"title": "热身", "items": [{"q": "你想认识一位新来的老师。下面哪一种最能让你真正认识他？", "o": ["听他自己说他是怎样的人，再和他相处", "只看过他的一张照片", "只远远看过他的背影"]}, {"q": "你的名字是谁起的？一个人的名字最常带着什么？", "o": ["起名的人对他的盼望，或他是怎样的人", "只是一个方便叫的记号，没有意思", "名字越长越好听，就越重要"]}, {"q": "太阳很亮的时候，为什么我们不能直直地盯着它看？", "o": ["它太亮了，眼睛承受不住", "太阳离我们太远，看不清楚", "太阳会害羞，不让人看"]}]}, "quiz-v1": {"title": "讲解一 小测", "items": [{"q": "33:18 摩西求神什么？", "o": ["求你显出你的荣耀给我看", "求你赐给我们流奶与蜜之地", "求你再给我们降吗哪"]}, {"q": "神说要在摩西面前经过的是什么？", "o": ["我一切的恩慈", "我的面和我的形象", "我的使者和云柱"]}, {"q": "神为什么不让摩西看见他的面？", "o": ["人见我的面不能存活", "摩西还没有洗净衣服", "神的面被云柱遮住了"]}]}, "quiz-v2": {"title": "讲解二 小测", "items": [{"q": "34:6 神宣告自己是怎样的神？", "o": ["有怜悯有恩典，不轻易发怒", "从来不发怒，也不追讨罪", "只对好人有怜悯有恩典"]}, {"q": "34:7 神为多少人存留慈爱？", "o": ["千万人", "三四代人", "十二支派"]}, {"q": "摩西听完以后，求神什么？", "o": ["在我们中间同行，赦免我们的罪孽和罪恶", "让我再看一次你的荣耀", "先把应许之地赐给我们"]}]}, "quiz-v3": {"title": "讲解三 小测", "items": [{"q": "34:14 说耶和华的名又叫什么？", "o": ["忌邪者", "全能者", "牧者"]}, {"q": "摩西下山时，自己知道脸发光吗？", "o": ["不知道", "知道，所以很欢喜", "知道，所以先蒙上帕子"]}, {"q": "摩西什么时候揭去帕子？", "o": ["进到耶和华面前与他说话的时候", "回到自己帐棚休息的时候", "和百姓说话的时候"]}]}}, "exam": {"items": [{"q": "33:22 神说他的荣耀经过的时候，要把摩西放在哪里？", "o": ["磐石穴中", "会幕里面", "山脚下的营里", "云柱当中"]}, {"q": "33:23 神说摩西得见的是什么？", "o": ["我的背", "我的面", "我的手", "我的脚"]}, {"q": "34:1 神吩咐摩西做什么？", "o": ["凿出两块石版，和先前的一样", "去营里把摔碎的石版捡回来", "造一个约柜放先前的石版", "把十条诫写在帐棚的门上"]}, {"q": "34:3 神说，摩西上山时，在山根也不可有什么在那里吃草？", "o": ["羊群牛群", "骆驼驴子", "马和骡子", "鹿和羚羊"]}, {"q": "34:7 神说追讨罪，“自父及子”，直到几代？", "o": ["三四代", "七代", "十代", "千代"]}, {"q": "34:8 摩西听见神宣告的名，怎样？", "o": ["急忙伏地下拜", "大声唱歌赞美", "立刻下山告诉百姓", "用帕子蒙上脸"]}, {"q": "摩西这一次在山上多少昼夜？", "o": ["四十昼夜", "七昼夜", "三昼夜", "十二昼夜"]}, {"q": "34:30 亚伦和以色列众人看见摩西的面皮发光，怎样？", "o": ["怕挨近他", "跑上去拥抱他", "围着他跳舞", "都回到帐棚里"]}, {"q": "33:11 说“面对面”，33:20 说“你不能看见我的面”，哪一个说法最准确？", "o": ["面对面是神亲自直接和摩西说话；不能看见的是神完全的荣耀", "两处是两个不同的作者写的，互相矛盾", "面对面是说摩西看见了神的形象", "33:20 以后，神就不再和摩西说话了"]}, {"q": "两次的石版有什么相同、   var cnt=it.o.map(function(){return[]}),uns=[],none=[];R.forEach(function(r){var x=qr(r,id)[i];if(!x){none.push(r.name);return}if(x.f<0)uns.push(r.name);else cnt[x.f].push(r.name+(x.f===0&&x.t>1?'':''))});
  var tot=R.length-none.length;
  it.o.forEach(function(o,k){var row=el('div','opt'+(k===0?' right':''));row.appendChild(el('b',null,k===0?'✓':'·'));row.appendChild(el('span',null,o));var b=el('div','bar2'),ii=el('i');ii.style.width=(tot?cnt[k].length/tot*100:0)+'%';b.appendChild(ii);var lab=el('span','n',' '+cnt[k].length+' 人');lab.style.cssText='position:relative;padding-left:6px;font-size:12px';b.appendChild(lab);row.appendChild(b);if(cnt[k].length)row.appendChild(el('div','names',cnt[k].join('、')));sec.appendChild(row)});
  if(uns.length)sec.appendChild(el('p','st','选了“还不确定”：'+uns.join('、')));if(none.length&&!one)sec.appendChild(el('p','st','还没做：'+none.join('、')));
  box.appendChild(sec)}
function vQuiz(v,R){v.appendChild(el('p','st','统计的是每位学生第一次点的选项（做错后可以再选，但这里只算第一次）。'));
  Object.keys(CFG.quiz).forEach(function(id){var s=el('div','sec');s.appendChild(el('h2',null,CFG.quiz[id].title));CFG.quiz[id].items.forEach(function(it,i){quizQ(s,R,id,i)});v.appendChild(s)});
  if(CFG.pick){var s=el('div','sec');s.appendChild(el('h2',null,'热身 · 猜神最先说的是哪一件（答案：约柜）'));var c={};R.forEach(function(r){var p=r.d.pick;if(p)(c[p]=c[p]||[]).push(r.name)});Object.keys(c).forEach(function(k){s.appendChild(el('div',null,(CFG.pick[k]||k)+'：'+c[k].join('、')))});v.appendChild(s)}
  if(CFG.plead){var sp=el('div','sec');sp.appendChild(el('h2',null,CFG.pleadT||'预测 · 你是摩西（查经二之前，不计分；✓ 是摩西真正说的）'));CFG.plead.forEach(function(c,i){var nm=R.filter(function(r){return (r.d.pleadPick||'').split(',').indexOf(String(i))>=0}).map(function(r){return r.name});var row=el('div','opt'+(c[1]?' right':''));row.appendChild(el('b',null,c[1]?'✓':'·'));row.appendChild(el('span',null,c[0]+'（'+nm.length+' 人）'));if(nm.length)row.appendChild(el('div','names',nm.join('、')));sp.appendChild(row)});v.appendChild(sp)}
  if(CFG.exam){var se=el('div','sec');se.appendChild(el('h2',null,'综合练习（交卷后的选择）'));CFG.exam.items.forEach(function(it,i){var sec=el('div');sec.appendChild(el('h3',null,(i+1)+'. '+it.q));var cnt=it.o.map(function(){return[]}),none=[];R.forEach(function(r){var a;try{a=JSON.parse(r.d.exAns||'null')}catch(e){a=null}if(!a||a[i]==null||a[i]<0||r.d.exSub!=='1'){none.push(r.name);return}cnt[a[i]].push(r.name)});var tot=R.length-none.length;it.o.forEach(function(o,k){var row=el('div','opt'+(k===0?' right':''));row.appendChild(el('b',null,k===0?'✓':'·'));row.appendChild(el('span',null,o));var b=el('div','bar2'),ii=el('i');ii.style.width=(tot?cnt[k].length/tot*100:0)+'%';b.appendChild(ii);var lab=el('span','n',' '+cnt[k].length+' 人');lab.style.cssText='position:relative;padding-left:6px;font-size:12px';b.appendChild(lab);row.appendChild(b);if(cnt[k].length)row.appendChild(el('div','names',cnt[k].join('、')));sec.appendChild(row)});if(none.length)sec.appendChild(el('p','st','还没交卷：'+none.join('、')));se.appendChild(sec)});v.appendChild(se)}}
function textBlock(box,R,k,title,sub,only,rb){var sec=el('div');sec.appendChild(el('h3',null,title));if(sub)sec.appendChild(el('div','ref',sub));if(rb){var rr=el('div','ref');rr.appendChild(el('b',null,'评分要点（共 '+rb.reduce(function(a,x){return a+x[0]},0)+' 分）'));rb.forEach(function(x){rr.appendChild(el('div',null,x[0]+' 分 · '+x[1]))});sec.appendChild(rr)}
  R.forEach(function(r){var row=el('div','ans');if(!only)row.appendChild(who(r));var v=r.d[k]||'';row.appendChild(el('div','t'+(v?'':' mut'),v||'—'));row.appendChild(el('div'));if(only)row.style.gridTemplateColumns='1fr';sec.appendChild(row)});box.appendChild(sec)}
function vText(v,R){var s=el('div','sec');s.appendChild(el('h2',null,'开课问题：上课前 / 上完课'));s.appendChild(el('div','ref',CFG.openq));
  R.forEach(function(r){var row=el('div','ans');row.style.gridTemplateColumns='150px 1fr';row.appendChild(who(r));var two=el('div','two');var a=el('div','t'),b=el('div','t');a.appendChild(el('span','f','上课前：'));a.appendChild(document.createTextNode(r.d.open||'—'));b.appendChild(el('span','f','上完课：'));b.appendChild(document.createTextNode(r.d.close||'—'));two.appendChild(a);two.appendChild(b);row.appendChild(two);s.appendChild(row)});v.appendChild(s);
  var s2=el('div','sec');s2.appendChild(el('h2',null,'想一想 · 读经文 · 课后'));CFG.texts.slice(2).forEach(function(x){textBlock(s2,R,x[0],x[1],x[2],0,x[3])});v.appendChild(s2)}
function vOne(v,R){var sel=el('select','sel');sel.appendChild(el('option',null,'选择学生…'));R.forEach(function(r){var o=el('option',null,(r.cls?r.cls+' · ':'')+(r.name||'（没写名字）'));o.value=r.sid;if(r.sid===STU)o.selected=true;sel.appendChild(o)});sel.onchange=function(){STU=sel.value;render()};v.appendChild(sel);
  var r=ROWS.filter(function(x){return x.sid===STU})[0];if(!r)return;var s=stats(r);
  var hd=el('div','sec');hd.appendChild(el('h2',null,(r.name||'')+'　'+(r.cls||'')));hd.appendChild(el('p',null,'进度 '+r.prog+' / '+r.total+'（'+scrName(r)+'）· 查经完成 '+s.sd+' / '+s.st+' · 小测一次答对 '+s.qOk+' / '+s.qN+' · 自评“差一点” '+s.miss+' 题 · 游戏里点错 '+s.err+' 次 · '+ago(r.updated)+'更新'+(r.lang==='en'?' · 英文版':'')));
  var del=el('button','btn red','删除这份记录');del.onclick=function(){if(!confirm('确定删除“'+(r.name||'')+'”的这份记录？（只用于删除测试记录）'))return;fetch(API+'/del?lesson='+LES+'&sid='+encodeURIComponent(r.sid),{method:'POST',headers:{Authorization:'Bearer '+$('key').value.trim()}}).then(function(){STU=null;load()})};hd.appendChild(del);v.appendChild(hd);
  var t=el('div','sec');t.appendChild(el('h2',null,'写的答案'));CFG.texts.forEach(function(x){textBlock(t,[r],x[0],x[1],x[2],1,x[3])});v.appendChild(t);
  [0,1,2].forEach(function(k){var b=el('div','sec');b.appendChild(el('h2',null,'查经'+'一二三'[k]));CFG.study.zh[k].forEach(function(q,qi){studyQ(b,[r],k,qi,1)});v.appendChild(b)});
  var q=el('div','sec');q.appendChild(el('h2',null,'选择题（第一次点的）'));Object.keys(CFG.quiz).forEach(function(id){CFG.quiz[id].items.forEach(function(it,i){var x=qr(r,id)[i];var line=el('div','ans');line.style.gridTemplateColumns='1fr 160px';line.appendChild(el('div',null,CFG.quiz[id].title+' '+(i+1)+'. '+it.q));line.appendChild(el('div',!x?'mut':x.f===0&&x.t===1?'good':'bad',!x?'没做':x.f<0?'还不确定':x.f===0?(x.t===1?'✓ 一次答对':'答对（第 '+x.t+' 次）'):'先选了：'+it.o[x.f]));q.appendChild(line)})});v.appendChild(q)}

/* ---- CSV ---- */
$('csv').onclick=function(){var R=rows();if(!R.length)return;var head=['姓名','班级','进度','查经完成','小测一次答对','自评差一点','游戏点错','最后更新'];
  CFG.study.zh.forEach(function(qs,t){qs.forEach(function(q,qi){head.push('查经'+(t+1)+'-'+(qi+1));head.push('自评'+(t+1)+'-'+(qi+1))})});CFG.texts.forEach(function(x){head.push(x[1])});
  var lines=[head];R.forEach(function(r){var s=stats(r),en=r.lang==='en',a=[r.name,r.cls,r.prog+'/'+r.total,s.sd+'/'+s.st,s.qOk+'/'+s.qN,s.miss,s.err,new Date(r.updated).toLocaleString()];
    CFG.study[en?'en':'zh'].forEach(function(qs,t){qs.forEach(function(q,qi){a.push(q.f.map(function(f,j){return f.l+'：'+(r.d['s'+t+'_'+qi+'_'+j]||'')}).join(' / '));a.push({ok:'找到了',miss:'差一点'}[r.d['cmp'+t+'_'+qi]]||'')})});
    CFG.texts.forEach(function(x){a.push(r.d[x[0]]||'')});lines.push(a)});
  var csv='﻿'+lines.map(function(l){return l.map(function(c){c=String(c==null?'':c);return '"'+c.replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var a=el('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='出埃及记第'+LES+'课-学生答案.csv';document.body.appendChild(a);a.click();a.remove()};
var sl=$('les');KEYS.forEach(function(k){var o=el('option',null,'第 '+k+' 课 · '+CFGS[k].name);o.value=k;sl.appendChild(o)});sl.value=LES;sl.onchange=function(){LES=sl.value;CFG=CFGS[LES];ls('les',LES);ROWS=[];STU=null;setMeta();render();if($('key').value)load()};setMeta();
render();if($('key').value)load();
