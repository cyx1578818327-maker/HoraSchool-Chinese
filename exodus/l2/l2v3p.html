function paintRow(items, opt) {
  var n = items.length, w = 440, gap = 80, h = 400, y = opt.y || 150, x0 = (1920 - (n * w + (n - 1) * gap)) / 2;
  return items.map(function (it, i) {
    var X = x0 + i * (w + gap);
    var v = pos(mk('div'), X, y, w, h); v.style.border = '8px solid #FBF8F1'; v.style.boxShadow = '0 16px 36px rgba(60,40,20,.16)'; v.style.overflow = 'hidden'; v.style.boxSizing = 'border-box';
    v.innerHTML = '<svg viewBox="0 0 440 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">' + it.paint + '</svg>';
    var l = pos(mk('div'), X, y + h + 28, w);
    l.innerHTML = '<div style="display:flex;gap:18px;align-items:flex-start"><div style="font-family:SS4;font-weight:600;font-size:56px;line-height:.95;color:' + C.acc + '">' + (i + 1) + '</div><div><div style="font-family:' + KIT_SERIF() + ';font-weight:600;font-size:40px;line-height:1.18;color:' + C.ink + '">' + it.t + '</div><div style="font-size:25px;line-height:1.35;color:' + C.ink2 + ';margin-top:8px">' + it.s + '</div></div></div>';

}

var EX1TXT={"zh": "以色列的众子，各带家眷，和雅各一同来到埃及。他们的名字记在下面。有流便、西缅、利未、犹大、以萨迦、西布伦、便雅悯、但、拿弗他利、迦得、亚设。凡从雅各而生的，共有七十人。约瑟已经在埃及。约瑟和他的弟兄，并那一代的人，都死了。以色列人生养众多，并且繁茂，极其强盛，满了那地。有不认识约瑟的新王起来，治理埃及，对他的百姓说：看哪，这以色列民比我们还多，又比我们强盛。来罢，我们不如用巧计待他们，恐怕他们多起来，日后若遇甚么争战的事，就连合我们的仇敌攻击我们，离开这地去了。於是埃及人派督工的辖制他们，加重担苦害他们。他们为法老建造两座积货城，就是比东和兰塞。只是越发苦害他们，他们越发多起来，越发蔓延；埃及人就因以色列人愁烦。埃及人严严的使以色列人做工，使他们因做苦工觉得命苦；无论是和泥，是作砖，是作田间各样的工，在一切的工上都严严的待他们。有希伯来的两个收生婆，一名施弗拉，一名普阿；埃及王对他们说：你们为希伯来妇人收生，看他们临盆的时候，若是男孩，就把他杀了；若是女孩，就留他存活。但是收生婆敬畏神，不照埃及王的吩咐行，竟存留男孩的性命。埃及王召了收生婆来，说：你们为甚么做这事，存留男孩的性命呢？收生婆对法老说：因为希伯来妇人与埃及妇人不同；希伯来妇人本是健壮的（原文作活泼的），收生婆还没有到，他们已经生产了。神厚待收生婆。以色列人多起来，极其强盛。收生婆因为敬畏神，神便叫他们成立家室。法老吩咐他的众民说：以色列人所生的男孩，你们都要丢在河里；一切的女孩，你们要存留他的性命。", "en": "These are the names of the sons of Israel who came to Egypt with Jacob, each with his household: Reuben, Simeon, Levi, and Judah, Issachar, Zebulun, and Benjamin, Dan and Naphtali, Gad and Asher. All the descendants of Jacob were seventy persons; Joseph was already in Egypt. Then Joseph died, and all his brothers and all that generation. But the people of Israel were fruitful and increased greatly; they multiplied and grew exceedingly strong, so that the land was filled with them. Now there arose a new king over Egypt, who did not know Joseph. And he said to his people, “Behold, the people of Israel are too many and too mighty for us. Come, let us deal shrewdly with them, lest they multiply, and, if war breaks out, they join our enemies and fight against us and escape from the land.” Therefore they set taskmasters over them to afflict them with heavy burdens. They built for Pharaoh store cities, Pithom and Raamses. But the more they were oppressed, the more they multiplied and the more they spread abroad. And the Egyptians were in dread of the people of Israel. So they ruthlessly made the people of Israel work as slaves and made their lives bitter with hard service, in mortar and brick, and in all kinds of work in the field. In all their work they ruthlessly made them work as slaves. Then the king of Egypt said to the Hebrew midwives, one of whom was named Shiphrah and the other Puah, “When you serve as midwife to the Hebrew women and see them on the birthstool, if it is a son, you shall kill him, but if it is a daughter, she shall live.” But the midwives feared God and did not do as the king of Egypt commanded them, but let the male children live. So the king of Egypt called the midwives and said to them, “Why have you done this, and let the male children live?” The midwives said to Pharaoh, “Because the Hebrew women are not like the Egyptian women, for they are vigorous and give birth before the midwife comes to them.” So God dealt well with the midwives. And the people multiplied and grew very strong. And because the midwives feared God, he gave them families. Then Pharaoh commanded all his people, “Every son that is born to the Hebrews you shall cast into the Nile, but you shall let every daughter live.”"};

<script>
(function(){
