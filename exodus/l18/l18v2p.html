.scene{position:absolute;inset:0;z-index:1}
.scene>*{position:absolute}

.img.contain{box-shadow:none;background:none}.img.contain img{object-fit:contain}
.corner,.credit,.sub{position:absolute}

.credit{right:48px;bottom:100px;font-size:17px;color:#9A9387;z-index:40;max-width:1000px;text-align:right}

function paintRow(items, opt) {
  var n = items.length, w = 440, gap = 80, h = 400, y = opt.y || 150, x0 = (1920 - (n * w + (n - 1) * gap)) / 2;
