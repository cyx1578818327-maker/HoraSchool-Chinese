// 摩西故事插图（手绘风，440×400），用于“摩西的一生”
function paintRow(items, opt) {
  var n = items.length, w = 440, gap = 80, h = 400, y = opt.y || 150, x0 = (1920 - (n * w + (n - 1) * gap)) / 2;
  return items.map(function (it, i) {
    var X = x0 + i * (w + gap);
    var v = pos(mk('div'), X, y, w, h); v.style.border = '8px solid #FBF8F1'; v.style.boxShadow = '0 16px 36px rgba(60,40,20,.16)'; v.style.overflow = 'hidden'; v.style.boxSizing = 'border-box';
    v.innerHTML = '<svg viewBox="0 0 440 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">' + it.paint + '</svg>';
    var l = pos(mk('div'), X, y + h + 28, w);
    l.innerHTML = '<div style="display:flex;gap:18px;align-items:flex-start"><div style="font-family:SS4;font-weight:600;font-size:56px;line-height:.95;color:' + C.acc + '">' + (i + 1) + '</div><div><div style="font-family:' + KIT_SERIF() + ';font-weight:600;font-size:40px;line-height:1.18;color:' + C.ink + '">' + it.t + '</div><div style="font-size:25px;line-height:1.35;color:' + C.ink2 + ';margin-top:8px">' + it.s + '</div></div></div>';
    return { v: v, l: l, p: null }
  })
}
function _robe(x, y, s, col, staff, bend) { // 穿长袍的人（侧影，无五官），脚底在 (x,y)
  var g = '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">';
  if (staff) g += '<path d="M22,-118 Q25,-60 20,0" stroke="#3A2A1A" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M22,-118 q-7,-6 -3,-12" stroke="#3A2A1A" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
  g += '<path d="M-14,0 Q-18,-50 -10,-80 Q-6,-96 0,-98 Q8,-96 11,-82 Q18,-50 16,0 Z" fill="' + col + '"/>';
  g += '<path d="M-10,-80 Q-2,-90 11,-82 L16,-60 Q2,-66 -12,-58 Z" fill="#000" opacity=".12"/>';
  g += '<path d="M-7,-98 Q0,-118 8,-101 Q10,-92 3,-90 Q-5,-90 -7,-98 Z" fill="' + col + '"/><path d="M-9,-98 Q-1,-122 10,-100 L12,-86 Q2,-94 -10,-88 Z" fill="#E8DCC2" opacity=".75"/>';
  if (staff) g += '<path d="M6,-74 Q16,-70 21,-66" stroke="' + col + '" stroke-width="7" stroke-linecap="round"/>';
  return g + '</g>'
}

<script>
(function(){
 var vp=document.getElementById('vp'),st=document.getElementById('stage'),au=document.getElementById('au'),big=document.getElementById('big'),pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm'),cc=document.getElementById('cc'),ld=document.getElementById('ld');
 function fit(){var w=vp.clientWidth,h=vp.clientHeight,s=Math.min(w/1920,h/1080);st.style.transform='translate('+((w-1920*s)/2)+'px,'+((h-1080*s)/2)+'px) scale('+s+')'}
 window.addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);document.addEventListener('webkitfullscreenchange',fit);
 boot();fit();
 var D=T.dur,last=-1,dragging=false,POSTER=3.2,cap=document.getElementById('cap');function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
 function draw(t){if(Math.abs(t-last)<0.001)return;last=t;render(t);cap.textContent=SUB.textContent;tm.textContent=fmt(t)+' / '+fmt(D);if(!dragging)sk.value=Math.round(t/D*1000)}
 function loop(){draw(au.currentTime||0);if(!au.paused)requestAnimationFrame(loop)}
 var imgs=[].slice.call(st.querySelectorAll('img'));var pend=imgs.length;function one(){if(--pend<=0)ready()}
 imgs.forEach(function(i){if(i.complete)one();else{i.addEventListener('load',one);i.addEventListener('error',one)}});if(!imgs.length)ready();
 var rdy=false;function ready(){if(rdy)return;rdy=true;document.fonts.ready.then(function(){ld.style.display='none';last=-1;draw(au.currentTime||POSTER)})}
 setTimeout(ready,8000);
 function play(){var p=au.play();if(p&&p.catch)p.catch(function(){});}
 function toggle(){if(au.paused){if(au.ended||au.currentTime>=D-.2)au.currentTime=0;play()}else au.pause()}
 au.addEventListener('play',function(){big.classList.add('hide');pp.textContent='❚❚';pp.setAttribute('aria-label','Pause');requestAnimationFrame(loop)});
 au.addEventListener('pause',function(){pp.textContent='▶';pp.setAttribute('aria-label','Play');draw(au.currentTime)});
 au.addEventListener('ended',function(){big.classList.remove('hide')});
 au.addEventListener('loadedmetadata',function(){D=Math.max(T.dur,au.duration||0);last=-1;draw(au.currentTime||POSTER)});
 big.onclick=function(e){e.stopPropagation();toggle()};vp.addEventListener('click',toggle);pp.onclick=toggle;
 sk.addEventListener('input',function(){dragging=true;var t=sk.value/1000*D;last=-1;draw(t);tm.textContent=fmt(t)+' / '+fmt(D)});
 sk.addEventListener('change',function(){au.currentTime=sk.value/1000*D;dragging=false;last=-1;draw(au.currentTime)});
 cc.onclick=function(){var on=!cc.classList.contains('on');cc.classList.toggle('on',on);vp.classList.toggle('nocc',!on)};
 document.getElementById('fs').onclick=function(){var r=vp.requestFullscreen||vp.webkitRequestFullscreen;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else if(r){var p=r.call(vp);if(p&&p.catch)p.catch(function(){vp.classList.add('pf');fit()})}else{vp.classList.add('pf');fit()}};document.getElementById('xpf').onclick=function(e){e.stopPropagation();vp.classList.remove('pf');fit()};
 document.addEventListener('keydown',function(e){if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}if(e.code==='ArrowRight')au.currentTime=Math.min(D,au.currentTime+5);if(e.code==='ArrowLeft')au.currentTime=Math.max(0,au.currentTime-5)});
 au.addEventListener('seeked',function(){last=-1;draw(au.currentTime)});
})();
</script><script>
(function(){var q=new URLSearchParams(location.search);if(!q.get('embed'))return;document.documentElement.classList.add('embed');var au=document.getElementById('au');var lock=q.get('lock')==='1',mx=+q.get('max')||0,ended=false;
function post(m){try{parent.postMessage(m,'*')}catch(e){}}

var lt=-9;au.addEventListener('timeupdate',function(){var t=au.currentTime;if(lock){if(t>mx+1.5){au.currentTime=mx;return}if(t>mx)mx=t}if(Math.abs(t-lt)>=1){lt=t;post({lp:'t',t:t,d:au.duration})}if(!ended&&au.duration&&t>=au.duration-.4){ended=true;post({lp:'end'})}});

})();
