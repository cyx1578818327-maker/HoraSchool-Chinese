}

// 摩西故事插图（手绘风，440×400），用于“摩西的一生”
function paintRow(items, opt) {
  var n = items.length, w = 440, gap = 80, h = 400, y = opt.y || 150, x0 = (1920 - (n * w + (n - 1) * gap)) / 2;
  return items.map(function (it, i) {
    var X = x0 + i * (w + gap);
    var v = pos(mk('div'), X, y, w, h); v.style.border = '8px solid #FBF8F1'; v.style.boxShadow = '0 16px 36px rgba(60,40,20,.16)'; v.style.overflow = 'hidden'; v.style.boxSizing = 'border-box';
    v.innerHTML = '<svg viewBox="0 0 440 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">' + it.paint + '</svg>';
    var l = pos(mk('div'), X, y + h + 28, w);
    l.innerHTML = '<div style="display:flex;gap:18px;align-items:flex-start"><div style="font-family:SS4;font-weight:600;font-size:56px;line-height:.95;color:' + C.acc + '">' + (i + 1) + '</div><div><div style="font-family:' + KIT_SERIF() + ';font-weight:600;font-size:40px;line-height:1.18;color:' + C.ink + '">' + it.t + '</div><div style="font-size:25px;line-height:1.35;color:' + C.ink2 + ';margin-top:8px">' + it.s + '</div></div></div>';
    return { v: v, l: l, p: null }
  })
}
function _robe(x, y, s, col, staff, bend) { // 穿长袍的人（侧影，无五官），脚底在 (x,y)
  var g = '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">';
  if (staff) g += '<path d="M22,-118 Q25,-60 20,0" stroke="#3A2A1A" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M22,-118 q-7,-6 -3,-12" stroke="#3A2A1A" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
  g += '<path d="M-14,0 Q-18,-50 -10,-80 Q-6,-96 0,-98 Q8,-96 11,-82 Q18,-50 16,0 Z" fill="' + col + '"/>';
  g += '<path d="M-10,-80 Q-2,-90 11,-82 L16,-60 Q2,-66 -12,-58 Z" fill="#000" opacity=".12"/>';
  g += '<path d="M-7,-98 Q0,-118 8,-101 Q10,-92 3,-90 Q-5,-90 -7,-98 Z" fill="' + col + '"/><path d="M-9,-98 Q-1,-122 10,-100 L12,-86 Q2,-94 -10,-88 Z" fill="#E8DCC2" opacity=".75"/>';
  if (staff) g += '<path d="M6,-74 Q16,-70 21,-66" stroke="' + col + '" stroke-width="7" stroke-linecap="round"/>';
  return g + '</g>'
}
